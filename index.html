};
const SRC_QUIZ_OBS = [{"id": "obs-ustalenie-001", "rola": "obserwator", "faza": "ustalenie_wynikow", "cel_uczenia": "Rozpoznać, że obserwatorka ma prawo być obecna przy wszystkich czynnościach ustalania wyniku (kompetencja: znajomość prawa).", "poziom_blooma": "rozumienie", "typ": "wielokrotny_wybor", "kontekst": "Komisja przystępuje do liczenia po zamknięciu lokalu.", "pytanie": "Wskaż, przy których czynnościach komisji podczas ustalania wyniku obserwatorka społeczna ma prawo być obecna.", "opcje": [{"tekst": "Przy wszystkich czynnościach komisji — od zamknięcia lokalu po sporządzenie protokołu.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Tylko do momentu zamknięcia lokalu; przy liczeniu głosów już nie.", "poprawna": false, "uzasadnienie_dystraktora": "myli fazę — obserwator ma prawo obecności także przy liczeniu i sporządzaniu protokołu (art. 103b § 1 pkt 2)"}, {"tekst": "Przy każdej czynności, ale za każdorazową zgodą przewodniczącego.", "poprawna": false, "uzasadnienie_dystraktora": "zaniża uprawnienie — prawo obecności nie zależy od zgody komisji przy poszczególnych czynnościach"}], "feedback_poprawny": "Tak. Obserwatorka społeczna, na mocy art. 103c stosującego odpowiednio przepisy o mężu zaufania, ma prawo być obecna przy wszystkich czynnościach komisji, w tym przy liczeniu i sporządzaniu protokołu (art. 103b § 1 pkt 1–2). To prawo obserwacji jest podstawą całej jej roli.", "feedback_niepoprawny": "Sprawdź zakres prawa obecności: nie kończy się ono na zamknięciu lokalu i nie wymaga zgody komisji przy każdej czynności. Obejmuje wszystkie czynności ustalania wyniku.", "zrodlo": {"chunk_id": "kodeks-wyborczy:art103c", "akt": "Ustawa z dnia 5 stycznia 2011 r. — Kodeks wyborczy", "jednostka": "art. 103c", "stan_prawny": "2023-03-31", "wybory": null}}, {"id": "obs-ustalenie-002", "rola": "obserwator", "faza": "ustalenie_wynikow", "cel_uczenia": "Odróżnić uprawnienia obserwatora społecznego od męża zaufania — brak prawa wnoszenia uwag do protokołu (kompetencja: granica roli).", "poziom_blooma": "rozumienie", "typ": "prawda_falsz", "kontekst": null, "pytanie": "Obserwatorka społeczna może wnieść do protokołu głosowania uwagi z wymienieniem konkretnych zarzutów.", "opcje": [{"tekst": "Prawda", "poprawna": false, "uzasadnienie_dystraktora": "myli obserwatora społecznego z mężem zaufania — wnoszenie uwag do protokołu (art. 103b § 1 pkt 3) jest dla obserwatora społecznego wyłączone przez art. 103c § 2"}, {"tekst": "Fałsz", "poprawna": true, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Fałsz — zgadza się. Prawo wnoszenia uwag do protokołu przysługuje mężowi zaufania (art. 103b § 1 pkt 3), ale wobec obserwatora społecznego jest wyłączone (art. 103c § 2). Anna dokumentuje odstępstwa we własnych notatkach i przekazuje je swoją ścieżką (koordynator, raport akcji) — to jej właściwy tryb.", "feedback_niepoprawny": "To rozpowszechniona pomyłka. Uwagi do protokołu wnosi mąż zaufania, nie obserwator społeczny. Anna zapisuje spostrzeżenia u siebie i zgłasza je koordynatorowi — nie do protokołu komisji.", "zrodlo": {"chunk_id": "kodeks-wyborczy:art103c", "akt": "Ustawa z dnia 5 stycznia 2011 r. — Kodeks wyborczy", "jednostka": "art. 103c", "stan_prawny": "2023-03-31", "wybory": null}}, {"id": "obs-ustalenie-003", "rola": "obserwator", "faza": "ustalenie_wynikow", "cel_uczenia": "Rozpoznać zakazany podział komisji na podgrupy liczące równolegle (kompetencja: rozpoznanie odstępstwa).", "poziom_blooma": "rozumienie", "typ": "prawda_falsz", "kontekst": null, "pytanie": "Aby liczyć szybciej, komisja może podzielić się na podgrupy, z których każda liczy równolegle inny stos kart.", "opcje": [{"tekst": "Prawda", "poprawna": false, "uzasadnienie_dystraktora": "mit „będzie szybciej” — kuszący przy zmęczeniu, ale niedopuszczalny: liczenie prowadzi cała komisja wspólnie"}, {"tekst": "Fałsz", "poprawna": true, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Fałsz — dobrze. Czynności liczenia komisja wykonuje wspólnie, bez dzielenia się na równolegle pracujące podgrupy (art. 69). Chodzi o to, by każdy członek widział karty. Podział na podgrupy Anna zanotuje jako odstępstwo.", "feedback_niepoprawny": "To częsta pułapka „będzie szybciej”. Mimo presji czasu komisja nie może liczyć w rozdzielnych podgrupach — to czynność wspólna całego składu. Taki podział jest odstępstwem do zanotowania.", "zrodlo": {"chunk_id": "kodeks-wyborczy:art69", "akt": "Ustawa z dnia 5 stycznia 2011 r. — Kodeks wyborczy", "jednostka": "art. 69", "stan_prawny": "2023-03-31", "wybory": null}}, {"id": "obs-ustalenie-004", "rola": "obserwator", "faza": "ustalenie_wynikow", "cel_uczenia": "Zastosować granicę roli, gdy w liczeniu uczestniczy osoba spoza komisji (kompetencja: znajomość prawa + brak ingerencji).", "poziom_blooma": "analiza", "typ": "scenariusz", "kontekst": "Podczas liczenia Anna widzi, że mąż zaufania sortuje i przelicza karty razem z członkami komisji.", "pytanie": "Wskaż, jak powinna zareagować Anna.", "opcje": [{"tekst": "Odnotować odstępstwo — karty liczy sam skład komisji, a mąż zaufania nie ma do tego uprawnienia.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Uznać udział za dozwolony, bo mąż zaufania ma przecież prawo być obecny przy liczeniu głosów.", "poprawna": false, "uzasadnienie_dystraktora": "myli prawo obecności z prawem udziału w czynności — obecność nie uprawnia do liczenia kart"}, {"tekst": "Samej włączyć się do liczenia kart, skoro również jest obecna w lokalu podczas prac komisji.", "poprawna": false, "uzasadnienie_dystraktora": "rażące wyjście z roli — obserwator patrzy i notuje, nie wykonuje czynności komisji"}], "feedback_poprawny": "Tak. Liczenia dokonuje sama komisja (art. 69 § 1). Udział osoby spoza składu to odstępstwo — Anna opisuje je faktograficznie (kto, kiedy, przy którym kroku), nie ingerując w pracę komisji.", "feedback_niepoprawny": "Rozdziel dwie rzeczy: prawo obecności to nie prawo udziału w liczeniu. Karty liczy tylko komisja. Anna tego nie robi ani nie sankcjonuje — odnotowuje.", "zrodlo": {"chunk_id": "kodeks-wyborczy:art69", "akt": "Ustawa z dnia 5 stycznia 2011 r. — Kodeks wyborczy", "jednostka": "art. 69", "stan_prawny": "2023-03-31", "wybory": null}}, {"id": "obs-ustalenie-005", "rola": "obserwator", "faza": "ustalenie_wynikow", "cel_uczenia": "Ocenić reakcję komisji na niezgodność sumy — ponowne przeliczenie, nie „domykanie” (kompetencja: rzetelność procesu).", "poziom_blooma": "ocena", "typ": "scenariusz", "kontekst": "Suma się nie zgadza; komisja poprawia liczbę „na oko”, żeby wynik się zgodził, i idzie dalej.", "pytanie": "Zdecyduj, co Anna powinna zrobić.", "opcje": [{"tekst": "Odnotować brak reakcji na rozbieżność, ze wskazaniem protokołu.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Uznać, że drobne korekty wyniku „na oko” są dopuszczalne, więc nie ma tu czego odnotowywać.", "poprawna": false, "uzasadnienie_dystraktora": "sankcjonowanie nieprawidłowości — przy rozbieżności prawo wymaga ponownego przeliczenia (art. 71 § 1)"}, {"tekst": "Podać komisji poprawny wynik, który sama wyliczyła, żeby szybko naprawić dostrzeżony błąd.", "poprawna": false, "uzasadnienie_dystraktora": "wyjście z roli — obserwator nie ustala wyniku za komisję ani nie koryguje jej pracy"}], "feedback_poprawny": "Tak. Przy niezgodności komisja ma przeliczyć ponownie to, czego dotyczy rozbieżność (art. 71 § 1), a nie „domknąć” wynik. Brak takiej reakcji to odstępstwo — Anna opisuje je faktograficznie, nie zastępując decyzji komisji.", "feedback_niepoprawny": "„Domknięcie” wyniku bez ponownego przeliczenia jest nieprawidłowe. Anna tego nie akceptuje jako normy, ale też nie liczy za komisję — notuje brak reakcji na rozbieżność.", "zrodlo": {"chunk_id": "kodeks-wyborczy:art71", "akt": "Ustawa z dnia 5 stycznia 2011 r. — Kodeks wyborczy", "jednostka": "art. 71", "stan_prawny": "2023-03-31", "wybory": null}}, {"id": "obs-ustalenie-006", "rola": "obserwator", "faza": "ustalenie_wynikow", "cel_uczenia": "Zastosować katalog osób uprawnionych do obecności i granicę roli (kompetencja: znajomość prawa + brak ingerencji).", "poziom_blooma": "analiza", "typ": "scenariusz", "kontekst": "Podczas liczenia w lokalu pojawia się osoba, która nie należy do komisji ani do katalogu osób uprawnionych do obecności.", "pytanie": "Wskaż właściwe działanie Anny.", "opcje": [{"tekst": "Odnotować obecność osoby nieuprawnionej — godzina i opis.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Samodzielnie i stanowczo wyprosić tę osobę z lokalu wyborczego.", "poprawna": false, "uzasadnienie_dystraktora": "nadgorliwość i wyjście z roli — porządku w lokalu pilnuje komisja, nie obserwator"}, {"tekst": "Założyć, że skoro osoba tam jest, to ktoś ją wpuścił zgodnie z zasadami, i nic nie notować.", "poprawna": false, "uzasadnienie_dystraktora": "bierność — obecność osoby spoza katalogu uprawnionych to odstępstwo, które należy udokumentować"}], "feedback_poprawny": "Tak. Po zamknięciu lokalu mogą w nim przebywać m.in. mężowie zaufania, obserwatorzy społeczni i międzynarodowi oraz obsługa informatyczna (pkt 100). Obecność osoby spoza tego katalogu Anna dokumentuje faktograficznie; usunięcie osoby należy do komisji.", "feedback_niepoprawny": "Dwa wychylenia są tu błędne: samodzielne wypraszanie (to zadanie komisji) oraz zignorowanie sytuacji. Właściwa reakcja to rzetelne odnotowanie z godziną i opisem.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt100", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział V, pkt 100", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-zakonczenie-007", "rola": "obserwator", "faza": "zakonczenie_glosowania", "cel_uczenia": "Rozpoznać, czy liczenie rozpoczęto przy wymaganym kworum 2/3 (kompetencja: znajomość prawa).", "poziom_blooma": "analiza", "typ": "scenariusz", "kontekst": "Anna liczy obecnych członków — jest ich mniej niż 2/3 składu, a komisja zaczyna liczyć głosy.", "pytanie": "Zdecyduj, co robi Anna.", "opcje": [{"tekst": "Odnotować, że liczenie rozpoczęto bez wymaganego kworum, z godziną i liczbą obecnych członków.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Samodzielnie wstrzymać liczenie do czasu uzupełnienia składu.", "poprawna": false, "uzasadnienie_dystraktora": "wyjście z roli — obserwator nie wstrzymuje czynności komisji"}, {"tekst": "Uznać, że liczebność składu to wewnętrzna sprawa komisji, i nie notować.", "poprawna": false, "uzasadnienie_dystraktora": "bierność — rozpoczęcie liczenia bez kworum to odstępstwo, które należy udokumentować"}], "feedback_poprawny": "Tak. Do liczenia komisja przystępuje przy obecności co najmniej 2/3 pełnego składu, w tym przewodniczącego lub zastępcy (pkt 99). Rozpoczęcie bez kworum to odstępstwo — Anna je opisuje; jeśli chce zwrócić komisji uwagę, robi to w formie pytania, nie polecenia.", "feedback_niepoprawny": "Kworum 2/3 to warunek rozpoczęcia liczenia, więc jego brak jest istotny i podlega odnotowaniu. Anna nie wstrzymuje jednak czynności sama — dokumentuje i ewentualnie pyta.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt99", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział V, pkt 99", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-zakonczenie-008", "rola": "obserwator", "faza": "zakonczenie_glosowania", "cel_uczenia": "Zastosować zasadę „pytanie zamiast polecenia” wobec braku zabezpieczenia urny (kompetencja: interakcje z administracją + bezzwłoczny przekaz).", "poziom_blooma": "stosowanie", "typ": "scenariusz", "kontekst": "Przed rozpoczęciem liczenia Anna widzi, że otwór urny nie został prawidłowo zapieczętowany.", "pytanie": "Wskaż reakcję zgodną z rolą obserwatora.", "opcje": [{"tekst": "Odnotować brak prawidłowego zapieczętowania i niezwłocznie przekazać koordynatorowi; komisji można zwrócić uwagę w formie pytania.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Poinformować komisję poleceniem: „Ta urna jest źle zaplombowana, poprawcie to natychmiast”.", "poprawna": false, "uzasadnienie_dystraktora": "forma polecenia — Kodeks postępowania dopuszcza zwrócenie uwagi tylko w formie pytania, nie nakazu"}, {"tekst": "Samodzielnie dokleić pasek i przyłożyć zabezpieczenie, żeby usprawnić pracę.", "poprawna": false, "uzasadnienie_dystraktora": "nadgorliwość i dotykanie sprzętu komisji — obserwator nie wykonuje czynności zabezpieczających"}], "feedback_poprawny": "Tak. Otwór urny pieczętuje przewodniczący (pkt 101). Niezabezpieczona urna to sytuacja poważna — wymaga bezzwłocznego przekazania koordynatorowi (reguła rzetelnego/bezzwłocznego przekazu). Komisji Anna może zwrócić uwagę wyłącznie w formie pytania (reguła interakcji z administracją).", "feedback_niepoprawny": "Kierunek jest dobry, ale nie przez polecenie ani samodzielną naprawę. Właściwie: odnotuj, przekaż koordynatorowi bez zwłoki, a komisji — jeśli już — zadaj pytanie.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt101", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział V, pkt 101", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-rozliczenie-009", "rola": "obserwator", "faza": "rozliczenie_kart", "cel_uczenia": "Rozpoznać naruszenie rozdzielności trzech protokołów przy liczbie otrzymanych kart (kompetencja: rzetelny przekaz faktograficzny).", "poziom_blooma": "analiza", "typ": "scenariusz", "kontekst": "Komisja wpisuje jedną, łączną liczbę otrzymanych kart zamiast trzech odrębnych.", "pytanie": "Zdecyduj, co odnotowuje Anna.", "opcje": [{"tekst": "Odnotować brak odrębnego wpisu dla Sejmu, Senatu i referendum.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Uznać jeden wpis łączny za wystarczający, bo „sumy i tak się na koniec zgodzą”.", "poprawna": false, "uzasadnienie_dystraktora": "myli rozdzielność protokołów — w wyborach łączonych każdą liczbę ustala się osobno dla trzech głosowań (pkt 111)"}, {"tekst": "Samodzielnie przepisać brakujące liczby do właściwych protokołów, żeby pomóc komisji.", "poprawna": false, "uzasadnienie_dystraktora": "wyjście z roli — wypełnianie protokołów należy do komisji, nie do obserwatora"}], "feedback_poprawny": "Tak. W wyborach łączonych liczbę otrzymanych kart przenosi się z protokołu wewnętrznego odrębnie do każdego z trzech protokołów (pkt 111). Wpis łączny to odstępstwo — Anna opisuje je, wskazując konkretny protokół; nie uzupełnia protokołów za komisję.", "feedback_niepoprawny": "Rozdzielność trzech protokołów jest tu istotą: liczba łączna nie zastępuje trzech odrębnych wpisów. Anna to odnotowuje, ale protokołów nie wypełnia.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt111", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 111", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-rozliczenie-010", "rola": "obserwator", "faza": "rozliczenie_kart", "cel_uczenia": "Zastosować kontrolę spójności: liczba uprawnionych równa w trzech protokołach (kompetencja: kontrola sum).", "poziom_blooma": "rozumienie", "typ": "prawda_falsz", "kontekst": null, "pytanie": "Liczba osób uprawnionych do głosowania może się różnić między protokołem dla Sejmu, dla Senatu i dla referendum.", "opcje": [{"tekst": "Prawda", "poprawna": false, "uzasadnienie_dystraktora": "myli liczbę uprawnionych (ta sama grupa wyborców) z liczbą kart danego głosowania — liczby uprawnionych mają być równe we wszystkich trzech protokołach"}, {"tekst": "Fałsz", "poprawna": true, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Fałsz — dobrze. To ta sama grupa uprawnionych wyborców, więc liczba uprawnionych powinna być równa w protokole Sejmu, Senatu i referendum (pkt 111). Rozbieżność bez wyjaśnienia Anna zanotuje jako sygnał do sprawdzenia.", "feedback_niepoprawny": "Uważaj na pojęcia: liczba uprawnionych to ta sama grupa dla wszystkich trzech głosowań, więc powinna być równa. Różne bywają liczby kart, nie liczba uprawnionych.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt111", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 111", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-rozliczenie-011", "rola": "obserwator", "faza": "rozliczenie_kart", "cel_uczenia": "Rozpoznać nieprawidłowe pakowanie kart niewykorzystanych (kompetencja: rozpoznanie odstępstwa).", "poziom_blooma": "analiza", "typ": "scenariusz", "kontekst": "Komisja wrzuca karty niewykorzystane z trzech głosowań do jednego pudełka, bez pieczęci.", "pytanie": "Wskaż, co odnotowuje Anna.", "opcje": [{"tekst": "Odnotować, że kart niewykorzystanych nie spakowano odrębnie dla trzech głosowań ani nie opieczętowano.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Uznać wspólne, niezapieczętowane pakowanie za dopuszczalne, bo oszczędza czas.", "poprawna": false, "uzasadnienie_dystraktora": "mit oszczędności — karty niewykorzystane pakuje się odrębnie dla każdych wyborów, pieczętuje i podpisuje (pkt 111)"}, {"tekst": "Samej rozdzielić i opieczętować pakiety, by pomóc komisji.", "poprawna": false, "uzasadnienie_dystraktora": "wyjście z roli i dotykanie kart — pakowanie i pieczętowanie wykonuje komisja"}], "feedback_poprawny": "Tak. Karty niewykorzystane liczy się i pakuje odrębnie dla Sejmu, Senatu i referendum, a pakiety pieczętuje i podpisuje (pkt 111). Wspólne lub niezabezpieczone pakowanie to odstępstwo — Anna je opisuje, nie wykonując tych czynności sama.", "feedback_niepoprawny": "Odrębność i zabezpieczenie pakietów to nie formalność — to warunek rozliczalności kart. Anna to odnotowuje, ale pakietów nie pakuje ani nie pieczętuje.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt111", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 111", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-rozliczenie-012", "rola": "obserwator", "faza": "rozliczenie_kart", "cel_uczenia": "Rozpoznać niewłaściwe potraktowanie karty znalezionej/zwróconej (kompetencja: znajomość prawa).", "poziom_blooma": "analiza", "typ": "scenariusz", "kontekst": "Komisja znajduje kartę poza urną i wrzuca ją do urny, żeby „głos się nie zmarnował”.", "pytanie": "Zdecyduj, co robi Anna.", "opcje": [{"tekst": "Odnotować odstępstwo — taka karta idzie do odrębnego pakietu, nie do urny.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Uznać wrzucenie karty do urny za właściwe rozwiązanie, „żeby głos się nie zmarnował”.", "poprawna": false, "uzasadnienie_dystraktora": "sankcjonowanie nieprawidłowości — takich kart nie uwzględnia się w obliczeniach (pkt 102)"}, {"tekst": "Samodzielnie sięgnąć do urny i wyjąć z niej tę kartę.", "poprawna": false, "uzasadnienie_dystraktora": "rażące wyjście z roli i dotykanie kart — obserwator nie ingeruje w zawartość urny"}], "feedback_poprawny": "Tak. Kart znalezionych lub zwróconych przez wyborcę nie wrzuca się do urny ani nie uwzględnia w obliczeniach — pakuje się je odrębnie (pkt 102). Wrzucenie takiej karty do urny to odstępstwo, które Anna opisuje; sama kart nie wyjmuje.", "feedback_niepoprawny": "„Żeby się nie zmarnował” to pułapka — takiej karty nie liczy się i nie wrzuca do urny. Anna to notuje, ale nie sięga do urny.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt102", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział V, pkt 102", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-ustalenie-013", "rola": "obserwator", "faza": "ustalenie_wynikow", "cel_uczenia": "Ocenić krytyczne odstępstwo: otwarcie urny bez kontroli plomb (kompetencja: bezzwłoczny przekaz + znajomość prawa).", "poziom_blooma": "ocena", "typ": "scenariusz", "kontekst": "Komisja od razu otwiera urnę i wyjmuje karty, nie sprawdzając wcześniej, czy plomby są nienaruszone.", "pytanie": "Wskaż właściwą reakcję Anny.", "opcje": [{"tekst": "Odnotować jako krytyczne odstępstwo brak kontroli plomb i zgłosić to koordynatorowi bez zwłoki.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Uznać, że skoro plomby z daleka wyglądają w porządku, osobna kontrola przed otwarciem nie jest konieczna.", "poprawna": false, "uzasadnienie_dystraktora": "bierność — sprawdzenie nienaruszenia plomb przed otwarciem urny jest wymaganym krokiem (pkt 112–113)"}, {"tekst": "Samodzielnie podejść do urny i obejrzeć z bliska stan plomb przed otwarciem.", "poprawna": false, "uzasadnienie_dystraktora": "wyjście z roli i dotykanie sprzętu — kontrolę plomb wykonuje komisja, nie obserwator"}], "feedback_poprawny": "Tak. Przed otwarciem urny komisja sprawdza nienaruszenie plomb i zaklejenia (pkt 112–113). Pominięcie tej kontroli to poważne, krytyczne odstępstwo — wymaga bezzwłocznego przekazania koordynatorowi. Anna nie sprawdza plomb sama.", "feedback_niepoprawny": "Kontrola plomb przed otwarciem urny jest warunkiem wiarygodności liczenia, więc jej pominięcie jest krytyczne — notuj i zgłoś od razu. Ale plomb nie sprawdzasz osobiście.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt112", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 112", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-ustalenie-014", "rola": "obserwator", "faza": "ustalenie_wynikow", "cel_uczenia": "Zastosować rozdzielność liczenia kart z kopert (głosowanie korespondencyjne) (kompetencja: kontrola rozdzielności).", "poziom_blooma": "rozumienie", "typ": "prawda_falsz", "kontekst": null, "pytanie": "Karty wyjęte z kopert na kartę do głosowania (głosowanie korespondencyjne) można policzyć łącznie dla wszystkich trzech głosowań.", "opcje": [{"tekst": "Prawda", "poprawna": false, "uzasadnienie_dystraktora": "myli rozdzielność protokołów — karty z kopert ustala się odrębnie dla Sejmu, Senatu i referendum (pkt 115)"}, {"tekst": "Fałsz", "poprawna": true, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Fałsz — zgadza się. Karty z kopert ustala się i liczy odrębnie dla każdego z trzech głosowań (pkt 115). Połączenie liczb Anna zanotuje jako odstępstwo.", "feedback_niepoprawny": "Także karty korespondencyjne podlegają rozdzielności trzech protokołów — liczy się je osobno, nie łącznie.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt115", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 115", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-ustalenie-015", "rola": "obserwator", "faza": "ustalenie_wynikow", "cel_uczenia": "Rozpoznać błędną kwalifikację karty całkowicie przedartej (kompetencja: rozpoznanie odstępstwa).", "poziom_blooma": "analiza", "typ": "scenariusz", "kontekst": "Komisja wlicza do obliczeń kartę, która jest całkowicie przedarta na dwie części.", "pytanie": "Zdecyduj, co odnotowuje Anna.", "opcje": [{"tekst": "Odnotować, że karta całkowicie przedarta została wliczona do obliczeń, mimo że należy ją pominąć.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Uznać, że skoro na karcie widać znak przy nazwisku, głos i tak się liczy.", "poprawna": false, "uzasadnienie_dystraktora": "błędna kwalifikacja — kartę całkowicie przedartą pomija się w obliczeniach niezależnie od jej treści (pkt 116)"}, {"tekst": "Samodzielnie zdecydować, że karta jest nieważna, i tak ją zakwalifikować.", "poprawna": false, "uzasadnienie_dystraktora": "wyjście z roli sędziego — o kwalifikacji kart decyduje komisja, nie obserwator"}], "feedback_poprawny": "Tak. Kartę całkowicie przedartą pomija się przy ustalaniu liczby kart (pkt 116). Wliczenie jej to odstępstwo — Anna je opisuje. O kwalifikacji kart decyduje komisja; Anna jej nie zastępuje.", "feedback_niepoprawny": "Rozdziel dwie rzeczy: rozpoznanie błędu (to robisz) od rozstrzygania o ważności karty (to robi komisja). Karta całkowicie przedarta jest pomijana.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt116", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 116", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-ustalenie-016", "rola": "obserwator", "faza": "ustalenie_wynikow", "cel_uczenia": "Ocenić, czy o kartach spornych komisja decyduje wspólnie (kompetencja: granica „świadek, nie sędzia”).", "poziom_blooma": "ocena", "typ": "scenariusz", "kontekst": "Członek komisji samodzielnie uznaje sporną kartę za ważną i odkłada ją na stos, bez decyzji całego składu.", "pytanie": "Wskaż właściwą reakcję Anny.", "opcje": [{"tekst": "Odnotować jednoosobowe rozstrzygnięcie spornej karty, z przykładem.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Uznać za normalne, że to najbardziej doświadczony członek komisji sam rozstrzyga sporne karty.", "poprawna": false, "uzasadnienie_dystraktora": "sankcjonowanie nieprawidłowości — o kartach/głosach spornych komisja decyduje wspólnie (pkt 118)"}, {"tekst": "Przedstawić komisji własną ocenę tego, czy sporna karta jest ważna.", "poprawna": false, "uzasadnienie_dystraktora": "wyjście z roli sędziego — obserwator nie rozstrzyga o ważności kart"}], "feedback_poprawny": "Tak. O kartach i głosach spornych komisja decyduje wspólnie (pkt 118). Rozstrzygnięcie jednoosobowe to odstępstwo — Anna opisuje je na konkretnym przykładzie. Sama nie przedstawia oceny ważności; jest świadkiem, nie sędzią.", "feedback_niepoprawny": "Istota roli: dokumentujesz, że decyzja zapadła niewłaściwym trybem (jednoosobowo), ale nie proponujesz własnego rozstrzygnięcia. O ważności decyduje komisja wspólnie.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt118", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 118", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-ustalenie-017", "rola": "obserwator", "faza": "ustalenie_wynikow", "cel_uczenia": "Zastosować kontrolę sumy kart (nieważne + ważne = wyjęte z urny) (kompetencja: kontrola sum).", "poziom_blooma": "rozumienie", "typ": "prawda_falsz", "kontekst": null, "pytanie": "Jeśli suma kart ważnych i nieważnych nie zgadza się z liczbą kart wyjętych z urny, komisja może przejść dalej, o ile różnica jest niewielka.", "opcje": [{"tekst": "Prawda", "poprawna": false, "uzasadnienie_dystraktora": "mit „drobnej różnicy” — kontrola sumy musi się zgadzać; przy rozbieżności właściwą reakcją jest ponowne przeliczenie, nie akceptacja różnicy"}, {"tekst": "Fałsz", "poprawna": true, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Fałsz — dobrze. W każdym protokole suma kart nieważnych i ważnych ma równać się liczbie kart wyjętych z urny (pkt 118). Niezgodności nie „przepuszcza się” z powodu małej różnicy — Anna zanotuje brak reakcji na rozbieżność.", "feedback_niepoprawny": "„Niewielka różnica” nie jest dopuszczalna — suma musi się zgadzać. Rozbieżność to sygnał do ponownego przeliczenia, a jej zignorowanie jest odstępstwem.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt118", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 118", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-ustalenie-018", "rola": "obserwator", "faza": "ustalenie_wynikow", "cel_uczenia": "Rozpoznać niezachowanie kolejności/zabezpieczenia kart Senatu i referendum (kompetencja: rozpoznanie odstępstwa).", "poziom_blooma": "analiza", "typ": "scenariusz", "kontekst": "Komisja jednocześnie liczy głosy do Sejmu, Senatu i referendum, a stosy kart się mieszają.", "pytanie": "Wskaż, co odnotowuje Anna.", "opcje": [{"tekst": "Odnotować równoległe ustalanie wyników trzech głosowań z mieszaniem stosów kart.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Uznać równoległe ustalanie wyników za dopuszczalne, ponieważ wyraźnie przyspiesza pracę komisji.", "poprawna": false, "uzasadnienie_dystraktora": "przeniesienie mitu podgrup na porządek prac — wyniki ustala się pojedynczo, a karty pozostałych głosowań zabezpiecza w pakietach tymczasowych (pkt 118)"}, {"tekst": "Zaproponować komisji właściwą, pojedynczą kolejność ustalania wyników trzech głosowań.", "poprawna": false, "uzasadnienie_dystraktora": "forma polecenia/organizowania pracy — obserwator nie kieruje przebiegiem czynności komisji"}], "feedback_poprawny": "Tak. Karty ważne do Senatu i referendum zabezpiecza się w opisanych, opieczętowanych pakietach tymczasowych, a wynik ustala pojedynczo (pkt 118). Równoległe mieszanie stosów to odstępstwo — Anna je opisuje, nie organizując pracy komisji.", "feedback_niepoprawny": "Porządek prac też podlega obserwacji: równoległe ustalanie z mieszaniem stosów jest nieprawidłowe. Anna to notuje, ale nie narzuca komisji kolejności.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt118", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 118", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-ustalenie-019", "rola": "obserwator", "faza": "ustalenie_wynikow", "cel_uczenia": "Rozpoznać wymóg podania wyników do publicznej wiadomości i rolę obserwatora (kompetencja: obrona jawności).", "poziom_blooma": "analiza", "typ": "wielokrotny_wybor", "kontekst": "Komisja podpisała protokół i przygotowuje się do przekazania go wyżej.", "pytanie": "Wskaż, co komisja ma zrobić dla jawności wyniku i co weryfikuje Anna.", "opcje": [{"tekst": "Wywiesić kopię protokołu w lokalu, w miejscu łatwo dostępnym dla wyborców; Anna sprawdza, czy to zrobiono.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Przekazać wynik tylko komisji wyższego stopnia; wywieszenie w lokalu nie jest wymagane.", "poprawna": false, "uzasadnienie_dystraktora": "błędna wiedza — komisja podaje wyniki do publicznej wiadomości przez wywieszenie kopii protokołu (art. 77 § 1)"}, {"tekst": "Anna sama wywiesza kopię protokołu, jeśli komisja zwleka.", "poprawna": false, "uzasadnienie_dystraktora": "wyjście z roli — czynność podania wyniku do wiadomości wykonuje komisja, nie obserwator"}], "feedback_poprawny": "Tak. Niezwłocznie po sporządzeniu protokołu komisja podaje wyniki do publicznej wiadomości, wywieszając kopię protokołu w łatwo dostępnym miejscu (art. 77 § 1). Anna weryfikuje, czy to zrobiono; nie wykonuje tej czynności za komisję.", "feedback_niepoprawny": "Jawność wyniku to nie tylko przekazanie „w górę” — wymagane jest publiczne wywieszenie kopii protokołu. Anna to sprawdza, ale sama kopii nie wywiesza.", "zrodlo": {"chunk_id": "kodeks-wyborczy:art77", "akt": "Ustawa z dnia 5 stycznia 2011 r. — Kodeks wyborczy", "jednostka": "art. 77", "stan_prawny": "2023-03-31", "wybory": null}}, {"id": "obs-ustalenie-020", "rola": "obserwator", "faza": "ustalenie_wynikow", "cel_uczenia": "Zastosować zasadę rzetelnego przekazu — tylko własne, naoczne obserwacje (kompetencja: rzetelny przekaz).", "poziom_blooma": "ocena", "typ": "scenariusz", "kontekst": "Inny obserwator mówi Annie, że „ktoś podmienił karty” — Anna sama tego nie widziała.", "pytanie": "Zdecyduj, jak Anna powinna postąpić z tą informacją.", "opcje": [{"tekst": "Zgłosić szczegółowo własne, naoczne spostrzeżenia; cudzą relację co najwyżej jako niepotwierdzoną.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Zgłosić usłyszaną od innej osoby relację jako fakt, ponieważ sam zarzut brzmi bardzo poważnie.", "poprawna": false, "uzasadnienie_dystraktora": "sankcjonowanie cudzej obserwacji — relacja z drugiej ręki może być manipulacją; przekazuje się własne, naoczne spostrzeżenia"}, {"tekst": "Nie zgłaszać w tej sprawie niczego, żeby nie ryzykować jakiejkolwiek pomyłki w raporcie.", "poprawna": false, "uzasadnienie_dystraktora": "bierność — własne, pewne spostrzeżenia należy przekazać; milczenie osłabia obronę praw wyborców"}], "feedback_poprawny": "Tak. Rzetelny przekaz opiera się na naoczności: Anna opisuje szczegółowo (kto, co, kiedy, jak) to, czego sama jest pewna, a relacji z drugiej ręki nie podaje jako własnej obserwacji. To chroni wiarygodność całej akcji obserwacyjnej.", "feedback_niepoprawny": "Znajdź środek między dwoma błędami: nie podawaj cudzej relacji jako faktu, ale też nie milcz o tym, co sama pewnie zaobserwowałaś. Podstawą jest własna naoczność.", "zrodlo": {"chunk_id": "kodeks-wyborczy:art103c", "akt": "Ustawa z dnia 5 stycznia 2011 r. — Kodeks wyborczy", "jednostka": "art. 103c", "stan_prawny": "2023-03-31", "wybory": null}}];
const SRC_QUIZ_KOM = [{"id": "kom-ustalenie-001", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Zastosować próg 2/3 pełnego składu (z zaokrągleniem w górę) przed rozpoczęciem ustalania wyników (kompetencja: kworum czynności).", "poziom_blooma": "stosowanie", "typ": "scenariusz", "kontekst": "Komisja liczy 9 osób. O 21:30 obecnych jest 5 członków, w tym przewodniczący. Część osób chce zaczynać liczenie.", "pytanie": "Zdecyduj, czy komisja może przystąpić do ustalania wyników głosowania.", "opcje": [{"tekst": "Nie — przy 9-osobowym składzie potrzeba co najmniej 6 obecnych; czekacie na kolejnego członka.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Tak — 5 osób to ponad połowa składu, a przewodniczący jest na miejscu.", "poprawna": false, "uzasadnienie_dystraktora": "myli próg połowy z progiem 2/3 pełnego składu, zaokrąglanym w górę (przy 9 osobach → 6)"}, {"tekst": "Tak — o gotowości do liczenia rozstrzyga przewodniczący, niezależnie od liczby obecnych.", "poprawna": false, "uzasadnienie_dystraktora": "przenosi wymóg kworum na decyzję jednej osoby — próg 2/3 wiąże także przewodniczącego"}], "feedback_poprawny": "Tak. Czynności ustalania wyników komisja wykonuje w składzie co najmniej 2/3 pełnego składu, w tym przewodniczący lub zastępca; ułamek zaokrągla się w górę, więc przy 9 osobach minimum to 6 (pkt 104). Kwadrans czekania jest tańszy niż podważona procedura.", "feedback_niepoprawny": "Sprawdź próg: 2/3 pełnego składu z zaokrągleniem w górę — przy 9 osobach to 6 członków, a decyzja przewodniczącego tego progu nie zastępuje (pkt 104).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt104", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 104", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-ustalenie-002", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Rozpoznać i zablokować pomysł podziału komisji na grupy robocze po zakończeniu głosowania (kompetencja: wspólność czynności).", "poziom_blooma": "stosowanie", "typ": "scenariusz", "kontekst": "Jest po północy. Doświadczony członek proponuje: „Podzielmy się — jedna grupa liczy Sejm, druga Senat, skończymy dwa razy szybciej”.", "pytanie": "Wskaż, jak reagujesz jako członek komisji.", "opcje": [{"tekst": "Zgłaszasz sprzeciw — czynności po zakończeniu głosowania komisja wykonuje wspólnie, bez grup roboczych.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Zgadzasz się, jeśli podział przegłosuje większość członków komisji.", "poprawna": false, "uzasadnienie_dystraktora": "uchwała większości nie uchyla zakazu z wytycznych — tworzenie grup roboczych jest niedopuszczalne"}, {"tekst": "Zgadzasz się, o ile obie grupy pracują przy sąsiednich stołach i widzą się nawzajem.", "poprawna": false, "uzasadnienie_dystraktora": "wspólna sala nie zmienia istoty: część kart ocenia wtedy część składu, a nie cała komisja"}], "feedback_poprawny": "Tak. Tworzenie z członków komisji grup roboczych, które wykonywałyby oddzielnie czynności po zakończeniu głosowania, jest niedopuszczalne (pkt 105). Twój spokojny sprzeciw chroni wynik przed podważeniem — to nie jest „utrudnianie pracy”.", "feedback_niepoprawny": "Ani głosowanie, ani sąsiednie stoły nie legalizują podgrup: każdy członek ma widzieć każdą kartę, a zakaz grup roboczych jest zapisany wprost (pkt 105).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt105", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 105", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-ustalenie-003", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Rozpoznać, że każdą kartę przed oceną okazuje się wszystkim obecnym członkom (kompetencja: wspólny ogląd kart).", "poziom_blooma": "rozumienie", "typ": "prawda_falsz", "kontekst": null, "pytanie": "Członek komisji może samodzielnie przejrzeć część kart, jeśli po skończeniu pokaże pozostałym wyniki swojego liczenia.", "opcje": [{"tekst": "Prawda", "poprawna": false, "uzasadnienie_dystraktora": "myli okazanie wyników z okazaniem kart — przed oceną każdą kartę okazuje się wszystkim obecnym członkom, a przeglądanie pojedynczo lub w grupach jest zakazane (pkt 106)"}, {"tekst": "Fałsz", "poprawna": true, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Fałsz — dobrze. Przed ustaleniem ważności karty i głosu każda karta jest okazywana wszystkim obecnym członkom komisji; przeglądanie kart pojedynczo przez część członków albo w odrębnych grupach jest zakazane (pkt 106).", "feedback_niepoprawny": "Pokazanie kolegom gotowego wyniku to za mało: wszyscy obecni członkowie mają widzieć każdą kartę przed jej oceną (pkt 106).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt106", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 106", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-ustalenie-004", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Wskazać właściwą organizację przeglądania kart: wspólny ogląd bez paraliżowania pracy (kompetencja: organizacja czynności).", "poziom_blooma": "rozumienie", "typ": "wielokrotny_wybor", "kontekst": null, "pytanie": "Wskaż, jak komisja organizuje przeglądanie kart podczas ustalania wyników.", "opcje": [{"tekst": "Tak, aby każdy członek widział karty i mógł dokonać ich oceny, bez opóźniania pracy komisji.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Tak, aby karty oceniał przewodniczący, a pozostali członkowie zapisywali podawane wyniki.", "poprawna": false, "uzasadnienie_dystraktora": "przenosi ocenę kart na jedną osobę — ocena to czynność wspólna całego składu"}, {"tekst": "Tak, aby każdy członek dokładnie przejrzał swój przydzielony stos kart.", "poprawna": false, "uzasadnienie_dystraktora": "to praca w podgrupach: część kart widzi wtedy część składu, wbrew zasadzie wspólnego oglądu"}], "feedback_poprawny": "Tak. Pracę organizuje się tak, by każdy członek widział karty i mógł je ocenić, a jednocześnie by nie prowadziło to do utrudniania, opóźniania ani paraliżowania pracy komisji (pkt 107). Wspólny ogląd i płynność idą w parze.", "feedback_niepoprawny": "Ocena kart nie należy do jednej osoby ani do „przydzielonych stosów” — każdy członek ma widzieć karty, a organizacja ma nie paraliżować pracy (pkt 107).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt107", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 107", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-ustalenie-005", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Wykonać kontrolę nienaruszenia pieczęci i plomb bezpośrednio przed otwarciem urny (kompetencja: zabezpieczenie materiałów).", "poziom_blooma": "stosowanie", "typ": "scenariusz", "kontekst": "Lokal zamknięty, kworum jest. Członek komisji sięga do urny: „Otwieramy i wyjmujemy?”.", "pytanie": "Zdecyduj, co komisja robi w pierwszej kolejności.", "opcje": [{"tekst": "Sprawdza, czy pieczęcie na urnie i wlocie lub jednorazowe plomby–nalepki pozostały nienaruszone, i dopiero potem otwiera urnę.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Otwiera urnę od razu — plomby były zakładane przy zamykaniu lokalu, więc kolejna kontrola dubluje pracę.", "poprawna": false, "uzasadnienie_dystraktora": "pomija wymaganą kontrolę nienaruszenia pieczęci i plomb wykonywaną bezpośrednio przed otwarciem urny (pkt 112)"}, {"tekst": "Prosi obserwatora społecznego, aby obejrzał plomby i potwierdził, że są w porządku.", "poprawna": false, "uzasadnienie_dystraktora": "przenosi czynność komisji na obserwatora — kontrola plomb to zadanie komisji, obserwator jedynie patrzy"}], "feedback_poprawny": "Tak. Komisja sprawdza, czy pieczęcie na urnie i na wlocie (lub plomby–nalepki) pozostały nienaruszone, po czym otwiera urnę i wyjmuje karty (pkt 112). Ta minuta kontroli to dowód, że nikt nie ingerował w karty.", "feedback_niepoprawny": "Kontrola plomb bezpośrednio przed otwarciem urny to osobny, wymagany krok — i wykonuje go komisja, nie obserwator (pkt 112).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt112", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 112", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-ustalenie-006", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Rozpoznać niedopuszczalność przewracania wypełnionej urny przy wyjmowaniu kart (kompetencja: staranność z materiałami).", "poziom_blooma": "rozumienie", "typ": "prawda_falsz", "kontekst": null, "pytanie": "Gdy urna jest mocno zapełniona, komisja może ją przewrócić i wysypać karty na stół, żeby przyspieszyć pracę.", "opcje": [{"tekst": "Prawda", "poprawna": false, "uzasadnienie_dystraktora": "mit „będzie szybciej” — przewracanie wypełnionej urny jest niedopuszczalne; przy pełnej urnie najpierw wyjmuje się część kart (pkt 113)"}, {"tekst": "Fałsz", "poprawna": true, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Fałsz — dobrze. Karty wyjmuje się starannie, tak by nie uszkodzić ani kart, ani urny; przewracanie wypełnionej urny jest niedopuszczalne, a przy mocno zapełnionej urnie najpierw wyjmuje się część kart (pkt 113).", "feedback_niepoprawny": "To pułapka pośpiechu: wysypanie kart grozi ich uszkodzeniem, a karty całkowicie przedarte wypadają z obliczeń. Wyjmuj karty partiami (pkt 113).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt113", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 113", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-ustalenie-007", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Wykonać właściwe postępowanie z przedmiotami innymi niż karty znalezionymi w urnie (kompetencja: rozdzielenie i odnotowanie).", "poziom_blooma": "stosowanie", "typ": "scenariusz", "kontekst": "Po otwarciu urny między kartami znajdujecie czystą kartkę papieru i ulotkę reklamową.", "pytanie": "Wskaż, co komisja robi z takim znaleziskiem.", "opcje": [{"tekst": "Oddziela je od kart do głosowania i odnotowuje ich odnalezienie we właściwych punktach protokołów.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Dolicza je do kart nieważnych, bo nie są urzędowymi kartami do głosowania.", "poprawna": false, "uzasadnienie_dystraktora": "myli przedmiot z kartą nieważną — kartka czy ulotka nie wchodzi do obliczeń w punkcie 11, tylko podlega odnotowaniu"}, {"tekst": "Usuwa je od razu z lokalu, żeby nie mieszały się z kartami podczas liczenia.", "poprawna": false, "uzasadnienie_dystraktora": "pomija obowiązek odnotowania — informację o odnalezieniu przedmiotów wpisuje się do protokołów"}], "feedback_poprawny": "Tak. Inne przedmioty (np. czyste kartki, nakładki brajlowskie) komisja oddziela od kart, a informację o ich odnalezieniu odnotowuje w punkcie 24 protokołów Sejmu i Senatu oraz w punkcie 32 protokołu referendum (pkt 114).", "feedback_niepoprawny": "Rozdziel pojęcia: kartka to przedmiot, nie karta nieważna — nie wchodzi do obliczeń, ale jej odnalezienie odnotowuje się w protokołach; usunięcie bez śladu też jest błędem (pkt 114).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt114", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 114", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}, "punkt_protokolu": "pkt 24 (Sejm/Senat) · pkt 32 (referendum)"}, {"id": "kom-ustalenie-008", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Wykonać pierwszą czynność wobec kopert na kartę do głosowania: odrębne ustalenie liczby kart z kopert (kompetencja: głosowanie korespondencyjne).", "poziom_blooma": "rozumienie", "typ": "wielokrotny_wybor", "kontekst": null, "pytanie": "Wskaż, co komisja robi w pierwszej kolejności z kopertami na kartę do głosowania znalezionymi w urnie.", "opcje": [{"tekst": "Wyjmuje z nich karty i ustala ich liczbę odrębnie dla Sejmu, Senatu i referendum, wpisując ją w punkcie 10a protokołów.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Dokłada karty z kopert do wspólnego stosu i liczy je razem ze wszystkimi kartami wyjętymi z urny.", "poprawna": false, "uzasadnienie_dystraktora": "gubi odrębne ustalenie liczby kart z kopert — punkt 10a wymaga osobnych liczb dla trzech głosowań"}, {"tekst": "Odkłada zaklejone koperty do pakietu i przekazuje je do komisji wyższego stopnia.", "poprawna": false, "uzasadnienie_dystraktora": "to karty do policzenia w obwodzie, nie depozyt do przekazania — liczby porównuje się z liczbą kopert"}], "feedback_poprawny": "Tak. W pierwszej kolejności wyjmuje się karty z kopert na kartę do głosowania i ustala ich liczbę — odrębnie w wyborach do Sejmu, do Senatu oraz w referendum — wpisując ją w punkcie 10a właściwego protokołu (pkt 115).", "feedback_niepoprawny": "Karty z głosowania korespondencyjnego liczy się w obwodzie, odrębnie dla każdego głosowania (punkt 10a), zanim trafią do dalszych obliczeń (pkt 115).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt115", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 115", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}, "punkt_protokolu": "pkt 10a"}, {"id": "kom-ustalenie-009", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Zdecydować o właściwym postępowaniu z kartą całkowicie przedartą (kompetencja: kwalifikacja kart).", "poziom_blooma": "analiza", "typ": "scenariusz", "kontekst": "Wśród kart z urny jest karta przedarta całkowicie na dwie części; obie części leżą obok siebie i widać znak „x”.", "pytanie": "Zdecyduj, co komisja robi z tą kartą.", "opcje": [{"tekst": "Wydziela ją, nie bierze pod uwagę przy obliczeniach i pakuje w opieczętowany, opisany pakiet.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Skleja obie części i liczy kartę normalnie, skoro znak „x” jest czytelny.", "poprawna": false, "uzasadnienie_dystraktora": "„ratowanie” karty — kartę całkowicie przedartą pomija się w obliczeniach niezależnie od czytelności znaku (pkt 116)"}, {"tekst": "Liczy ją jako kartę nieważną i wpisuje do punktu 11 protokołu.", "poprawna": false, "uzasadnienie_dystraktora": "myli kategorie — karta nieważna to karta nieurzędowa lub bez pieczęci; przedartej całkowicie w ogóle nie bierze się pod uwagę"}], "feedback_poprawny": "Tak. Karty całkowicie przedarte na dwie lub więcej części wydziela się i nie bierze pod uwagę przy obliczeniach, a następnie pakuje w opieczętowany i opisany pakiet (pkt 116). Nie wchodzą one ani do kart ważnych, ani do nieważnych.", "feedback_niepoprawny": "Nie sklejamy kart: całkowicie przedarta karta wypada z obliczeń — i nie jest tym samym co karta nieważna z punktu 11 (pkt 116).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt116", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 116", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-ustalenie-010", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Odróżnić kartę nieważną (pkt 11 protokołu) od głosu nieważnego (kompetencja: pojęcia protokołu).", "poziom_blooma": "analiza", "typ": "wielokrotny_wybor", "kontekst": null, "pytanie": "Wskaż kartę, którą komisja policzy jako kartę nieważną w punkcie 11 protokołu.", "opcje": [{"tekst": "Kartę nieopatrzoną pieczęcią obwodowej komisji.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Kartę ze znakiem „x” przy kandydatach z dwóch różnych list.", "poprawna": false, "uzasadnienie_dystraktora": "to głos nieważny na karcie ważnej — wytyczne wprost przestrzegają, by nie pomylić tych liczb w protokole"}, {"tekst": "Kartę z dopiskiem wyborcy na marginesie, poza kratkami.", "poprawna": false, "uzasadnienie_dystraktora": "dopiski poza kratką nie wpływają na ważność — karta i głos pozostają ważne"}], "feedback_poprawny": "Tak. Karta nieważna to karta inna niż ustalona urzędowo lub nieopatrzona pieczęcią komisji (pkt 118). Wytyczne wprost przestrzegają, by w punkcie 11 nie wpisać omyłkowo liczby głosów nieważnych — to dwie różne rzeczy.", "feedback_niepoprawny": "Rozdziel dwa poziomy: ważność karty (urzędowa karta z pieczęcią) i ważność głosu (co zaznaczono w kratkach). „X” przy dwóch listach to głos nieważny, a dopisek nie zmienia niczego (pkt 118).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt118", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 118", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}, "punkt_protokolu": "pkt 11"}, {"id": "kom-ustalenie-011", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Wpisać liczbę zero do protokołu we właściwy sposób (kompetencja: wypełnianie protokołu).", "poziom_blooma": "zapamietywanie", "typ": "prawda_falsz", "kontekst": null, "pytanie": "Jeżeli ustalona przez komisję liczba wynosi zero, właściwe kratki w protokole zostawia się puste.", "opcje": [{"tekst": "Prawda", "poprawna": false, "uzasadnienie_dystraktora": "puste pole wygląda jak przeoczenie i pozwala dopisać cyfrę — przy zerze wpisuje się „0” w ostatniej kratce z prawej strony (pkt 110)"}, {"tekst": "Fałsz", "poprawna": true, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Fałsz — dobrze. Liczby wpisuje się od prawej strony, a jeżeli ustalona liczba wynosi zero, w ostatniej kratce z prawej strony wpisuje się cyfrę „0” (pkt 110). Wypełniona kratka odróżnia „ustaliliśmy zero” od „zapomnieliśmy wpisać”.", "feedback_niepoprawny": "Puste pole to nie zero — to luka, którą ktoś może zakwestionować. Wpisz „0” w ostatniej kratce z prawej strony (pkt 110).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt110", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 110", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-ustalenie-012", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Zastosować obowiązek przejrzenia całej karty przed kwalifikacją głosu (kompetencja: metoda oceny kart).", "poziom_blooma": "stosowanie", "typ": "scenariusz", "kontekst": "Kolega z komisji przegląda karty szybko: widzi pierwszy znak „x” na liście nr 2 i od razu odkłada kartę na stos głosów ważnych.", "pytanie": "Rozpoznaj, co jest nie tak w tym sposobie pracy.", "opcje": [{"tekst": "Kartę trzeba przejrzeć w całości — dalej może być znak „x” na innej liście, a to czyni głos nieważnym.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Nic — pierwszy znak „x” przesądza, na kogo oddano głos, więc dalsze przeglądanie to strata czasu.", "poprawna": false, "uzasadnienie_dystraktora": "mit „pierwszego x” — o ważności decyduje cała karta, nie pierwszy znaleziony znak (pkt 119)"}, {"tekst": "Karty powinien przeglądać w ten sposób przewodniczący, a nie szeregowy członek komisji.", "poprawna": false, "uzasadnienie_dystraktora": "przenosi problem na hierarchię — ocena kart jest czynnością wspólną, a błąd dotyczy metody, nie stanowiska"}], "feedback_poprawny": "Tak. Komisja jest obowiązana przejrzeć całą kartę, a nie poprzestać na miejscu pierwszego znaku „x” — znak przy kandydatach na więcej niż jednej liście powoduje nieważność głosu (pkt 119). Pełne przejrzenie każdej karty to najtańsza ochrona przed błędnym wynikiem.", "feedback_niepoprawny": "Pierwszy znak „x” niczego nie przesądza: dopiero cała karta pokazuje, czy głos jest ważny. To kwestia metody, nie stanowiska w komisji (pkt 119).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt119", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 119", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-ustalenie-013", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Rozpoznać definicję znaku „x” i to, że wątpliwości rozstrzyga komisja (kompetencja: ocena znaku).", "poziom_blooma": "rozumienie", "typ": "wielokrotny_wybor", "kontekst": null, "pytanie": "Wskaż, jak wytyczne definiują znak „x” w kratce i kto rozstrzyga przypadki wątpliwe.", "opcje": [{"tekst": "Co najmniej dwie linie przecinające się w obrębie kratki; wątpliwości rozstrzyga komisja.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Dwie proste linie tworzące symetryczny krzyżyk; wątpliwości rozstrzyga przewodniczący.", "poprawna": false, "uzasadnienie_dystraktora": "zawęża definicję do „idealnego krzyżyka” i oddaje rozstrzygnięcie jednej osobie zamiast komisji"}, {"tekst": "Dowolny znak wyrażający wolę wyborcy; wątpliwości rozstrzyga mąż zaufania.", "poprawna": false, "uzasadnienie_dystraktora": "rozszerza definicję poza znak „x” i oddaje decyzję osobie, która nie ocenia kart"}], "feedback_poprawny": "Tak. Znakiem „x” są co najmniej dwie linie, które przecinają się w obrębie kratki; ustalenie, czy znak jest znakiem „x” i czy stoi w kratce, należy do komisji (pkt 119). Znak nie musi być „ładny” — musi się przecinać w kratce.", "feedback_niepoprawny": "Definicja jest szeroka (co najmniej dwie przecinające się linie), a rozstrzyganie wątpliwości należy do komisji jako całości — nie do przewodniczącego ani męża zaufania (pkt 119).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt119", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 119", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-ustalenie-014", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Rozpoznać, że znaki poza kratką traktuje się jako dopiski bez wpływu na ważność głosu (kompetencja: ocena znaku).", "poziom_blooma": "rozumienie", "typ": "prawda_falsz", "kontekst": null, "pytanie": "Znak „x” postawiony przez wyborcę poza kratką unieważnia głos na tej karcie.", "opcje": [{"tekst": "Prawda", "poprawna": false, "uzasadnienie_dystraktora": "myli dopisek z głosem — znaki poza kratką, w tym znak „x”, traktuje się jako dopiski, które nie wpływają na ważność głosu (pkt 119)"}, {"tekst": "Fałsz", "poprawna": true, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Fałsz — dobrze. Wszelkie znaki, wykreślenia i przekreślenia poza kratką — także znak „x” — traktuje się jako dopiski, które nie wpływają na ważność głosu (pkt 119). Liczy się to, co w kratkach.", "feedback_niepoprawny": "W wyborach o ważności głosu decydują znaki w kratkach; to, co poza nimi, jest dopiskiem. Uwaga: w referendum reguły dla znaków w obrębie kratki są surowsze (pkt 119, por. pkt 143).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt119", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 119", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-ustalenie-015", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Zakwalifikować głos ze znakiem „x” przy dwóch kandydatach z tej samej listy (kompetencja: kwalifikacja głosu, Sejm).", "poziom_blooma": "analiza", "typ": "scenariusz", "kontekst": "Na karcie do Sejmu wyborca postawił znak „x” przy dwóch kandydatach z tej samej listy: przy pozycji 3 i przy pozycji 7.", "pytanie": "Zdecyduj, jak komisja kwalifikuje ten głos.", "opcje": [{"tekst": "Głos ważny, oddany na kandydata z pozycji 3 — tego, którego nazwisko jest wyżej na liście.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Głos nieważny, bo znak „x” postawiono przy więcej niż jednym kandydacie.", "poprawna": false, "uzasadnienie_dystraktora": "przenosi regułę różnych list na jedną listę — w obrębie jednej listy głos pozostaje ważny (pkt 120)"}, {"tekst": "Głos ważny na listę, ale bez wskazania pierwszeństwa któregokolwiek kandydata.", "poprawna": false, "uzasadnienie_dystraktora": "myli z przypadkiem „x” wyłącznie przy skreślonym kandydacie — tu pierwszeństwo ma kandydat wyżej umieszczony"}], "feedback_poprawny": "Tak. Znak „x” przy dwóch lub więcej kandydatach z jednej listy daje głos ważny, oddany na tego z nich, którego nazwisko jest umieszczone wyżej na liście (pkt 120). Nieważność powstaje dopiero przy znakach na różnych listach.", "feedback_niepoprawny": "Kluczowe rozróżnienie: dwa „x” na jednej liście → głos ważny (liczy się kandydat wyżej); „x” na dwóch różnych listach → głos nieważny (pkt 120–121).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt120", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 120", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-ustalenie-016", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Wskazać przypadek głosu nieważnego w wyborach do Sejmu (kompetencja: kwalifikacja głosu, Sejm).", "poziom_blooma": "analiza", "typ": "wielokrotny_wybor", "kontekst": null, "pytanie": "Wskaż kartę, na której głos w wyborach do Sejmu jest nieważny.", "opcje": [{"tekst": "Znak „x” przy nazwiskach kandydatów z dwóch różnych list.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Znak „x” przy dwóch kandydatach z tej samej listy.", "poprawna": false, "uzasadnienie_dystraktora": "w obrębie jednej listy głos jest ważny — liczy się kandydat umieszczony wyżej (pkt 120)"}, {"tekst": "Znak „x” w kratce oraz hasło dopisane obok, poza kratkami.", "poprawna": false, "uzasadnienie_dystraktora": "dopiski poza kratką nie wpływają na ważność głosu (pkt 119)"}], "feedback_poprawny": "Tak. Głos jest nieważny, gdy znak „x” postawiono przy kandydatach z dwóch lub większej liczby różnych list, gdy nie postawiono go przy nikim albo gdy stoi wyłącznie przy liście, której rejestrację unieważniono (pkt 121).", "feedback_niepoprawny": "Dwa „x” w obrębie jednej listy i dopiski nie unieważniają głosu. Nieważność powstaje przy znakach na różnych listach, przy pustej karcie lub przy liście unieważnionej (pkt 120–121).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt121", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 121", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-ustalenie-017", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Ocenić właściwą reakcję na niezgodność sumy głosów z liczbą kart ważnych (kompetencja: kontrola sum protokołu).", "poziom_blooma": "ocena", "typ": "scenariusz", "kontekst": "Suma głosów nieważnych (pkt 13) i ważnych (pkt 14) jest o 2 mniejsza niż liczba kart ważnych (pkt 12). Jest 2:40 w nocy i część komisji chce po prostu wpisać liczby.", "pytanie": "Zdecyduj, co komisja powinna zrobić.", "opcje": [{"tekst": "Poszukać przyczyny błędu, sprostować obliczenia i dopiero właściwe liczby wpisać do protokołu.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Wpisać liczby mimo rozbieżności i opisać różnicę w uwagach protokołu.", "poprawna": false, "uzasadnienie_dystraktora": "uwagi nie zastępują zgodności — te liczby muszą być równe, a rozbieżność wymaga sprostowania obliczeń (pkt 123)"}, {"tekst": "Powiększyć liczbę głosów ważnych o 2, tak aby suma zgodziła się z liczbą kart.", "poprawna": false, "uzasadnienie_dystraktora": "„domykanie” wyniku — dopisanie liczby bez przeliczenia fałszuje obliczenia zamiast je prostować"}], "feedback_poprawny": "Tak. Suma punktów 13 i 14 musi równać się liczbie z punktu 12; przy rozbieżności komisja szuka przyczyny błędu i po sprostowaniu obliczeń wpisuje właściwe liczby (pkt 123). Zmęczenie o 2:40 jest realne — ale protokół z niezgodną sumą i tak wróci do poprawy.", "feedback_niepoprawny": "Ani uwagi, ani „dopisanie dwóch głosów” nie rozwiązują problemu: liczby muszą być równe, a droga prowadzi przez znalezienie błędu i ponowne obliczenie (pkt 123).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt123", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 123", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}, "punkt_protokolu": "pkt 12–14"}, {"id": "kom-ustalenie-018", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Wykonać właściwą kolejność: kontrola pakietu Senatu po zakończeniu obliczeń dla Sejmu (kompetencja: porządek trzech głosowań).", "poziom_blooma": "rozumienie", "typ": "wielokrotny_wybor", "kontekst": null, "pytanie": "Komisja zakończyła obliczenia dla wyborów do Sejmu. Wskaż następny krok.", "opcje": [{"tekst": "Sprawdza, czy pakiet z kartami ważnymi do Senatu nie został naruszony, i przystępuje do ustalania wyników do Senatu.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Ustala równolegle wyniki do Senatu i referendum, żeby nadrobić czas.", "poprawna": false, "uzasadnienie_dystraktora": "równoległe liczenie to praca w podgrupach — wyniki trzech głosowań ustala się po kolei (pkt 125)"}, {"tekst": "Wprowadza dane sejmowe do systemu informatycznego, zanim zajmie się kolejnymi głosowaniami.", "poprawna": false, "uzasadnienie_dystraktora": "myli kolejność — dane wprowadza się po sporządzeniu protokołu, nie między głosowaniami"}], "feedback_poprawny": "Tak. Po wykonaniu czynności dla Sejmu komisja sprawdza, czy pakiet z kartami ważnymi do Senatu nie został naruszony, i przystępuje do ustalania wyników głosowania na kandydatów na senatora; analogicznie potem dla referendum (pkt 125).", "feedback_niepoprawny": "Wyniki trzech głosowań ustala się po kolei, nie równolegle, a dane do systemu to etap po sporządzeniu protokołu. Najpierw kontrola pakietu Senatu (pkt 125).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt125", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 125", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-ustalenie-019", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Zakwalifikować głos do Senatu ze znakiem przy kandydacie skreślonym i innym kandydacie (kompetencja: kwalifikacja głosu, Senat).", "poziom_blooma": "rozumienie", "typ": "prawda_falsz", "kontekst": null, "pytanie": "Na karcie do Senatu wyborca postawił znak „x” przy kandydacie skreślonym i przy innym kandydacie. Taki głos jest nieważny.", "opcje": [{"tekst": "Prawda", "poprawna": false, "uzasadnienie_dystraktora": "zbyt pochopna nieważność — taki głos jest ważny i zalicza się go kandydatowi, którego nazwisko nie zostało skreślone (pkt 128)"}, {"tekst": "Fałsz", "poprawna": true, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Fałsz — dobrze. Jeżeli wyborca postawił znak „x” przy nazwisku kandydata skreślonego oraz przy nazwisku innego kandydata, głos jest ważny i zaliczany kandydatowi nieskreślonemu (pkt 128).", "feedback_niepoprawny": "Zanim uznasz głos za nieważny, sprawdź reguły ratujące jego ważność: przy skreślonym i innym kandydacie głos liczy się nieskreślonemu (pkt 128).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt128", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 128", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-ustalenie-020", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Ocenić głos referendalny z zamazaną kratką — reguła surowsza niż w wyborach (kompetencja: kwalifikacja głosu, referendum).", "poziom_blooma": "ocena", "typ": "scenariusz", "kontekst": "Na karcie referendalnej przy pierwszym pytaniu wyborca zamazał długopisem kratkę „TAK”, a następnie postawił wyraźny znak „x” w kratce „NIE”.", "pytanie": "Oceń, jak komisja kwalifikuje głos w zakresie tego pytania.", "opcje": [{"tekst": "Głos nieważny przy tym pytaniu — w referendum zamazanie kratki powoduje nieważność głosu.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Głos ważny na „NIE” — intencja wyborcy jest czytelna, a zamazanie traktuje się jak dopisek.", "poprawna": false, "uzasadnienie_dystraktora": "przenosi łagodniejszą regułę wyborów na referendum — w referendum znaki graficzne w obrębie kratki, w tym zamazania, powodują nieważność głosu przy danym pytaniu (pkt 143)"}, {"tekst": "Kartę pomija się w obliczeniach dla tego pytania, jak kartę uszkodzoną.", "poprawna": false, "uzasadnienie_dystraktora": "myli głos nieważny z kartą pomijaną — pomija się karty całkowicie przedarte; karta z nieważnym głosem zostaje w obliczeniach"}], "feedback_poprawny": "Tak. W referendum znaki graficzne naniesione w obrębie kratki — w szczególności zamazanie kratki czy przekreślenie znaku — powodują nieważność głosu w zakresie danego pytania; wytyczne podkreślają, że ta reguła różni się od reguł w wyborach (pkt 143). Nieważność dotyczy tego pytania, nie całej karty.", "feedback_niepoprawny": "To najczęstsza pułapka referendalna: reguła „dopisków” z wyborów nie działa wewnątrz kratki referendalnej. Zamazana kratka unieważnia głos przy tym pytaniu, ale karta zostaje w obliczeniach (pkt 143).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt143", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 143", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}];

function etapEnabled(k){ return Object.keys(MAT).some(m=>inScope(state.rola,k,m)); }
function matEnabled(m){ return state.etap ? inScope(state.rola,state.etap,m) : ETAPY.some(e=>inScope(state.rola,e.k,m)); }
function etapOf(k){ return ETAPY.find(e=>e.k===k); }
function etapLabel(k){ const e=etapOf(k); return e? e.k+") "+e.t : k; }

/* ================= STAN (tylko w pamięci sesji) ================= */
const state = {
  screen:"start", ekspert:"", rola:null, etap:null, material:null,

/* ================= NARZĘDZIA ================= */
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function today(){ return new Date().toISOString().slice(0,10); }
function descHtml(s){
  const lines=String(s).split("\n"); let out="", ul=false;
  lines.forEach(l=>{
    const t=l.trim();
    if(t.startsWith("- ")){ if(!ul){out+='<ul class="desc-ul">';ul=true;} out+="<li>"+esc(t.slice(2))+"</li>"; }
    else { if(ul){out+="</ul>";ul=false;} if(t) out+="<p>"+esc(t)+"</p>"; }
  });
  if(ul) out+="</ul>";
  return out;
}
let tt;
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show");

/* ================= NAWIGACJA ================= */

function setEkspert(v){ state.ekspert=v; const b=document.getElementById("startbtn"); if(b) b.disabled=!v; }

function setEtap(k){ if(!etapEnabled(k)){ toast("Etap poza zakresem pilotażu — element nieaktywny"); return; }

function setMat(m){ if(!matEnabled(m)){ toast("Ten typ materiału jest poza zakresem pilotażu dla wybranego etapu"); return; }

function nextFromEtap(){

  if(!state.material){toast("Wybierz typ materiału");return;}

function startGen(){

function buildSession(){

function sess(){ return state.session; }
function setDecision(id,dec){ const d=sess().decisions[id];

function bankTags(s,it){
  const t=[ROLE[s.rola], etapLabel(s.etap), MAT[s.material]];
  if(it.typ && TYP[it.typ]) t.push(TYP[it.typ]);
  if(it.poziom_blooma) t.push("Bloom: "+it.poziom_blooma);
  if(it.faza) t.push("faza: "+String(it.faza).replace(/_/g," "));
  return t;
}
function publish(){
  const s=sess(); if(!s) return;
  let bad=null;
  s.items.forEach(it=>{ const d=s.decisions[it.id];
    if(!d.decyzja){ bad=bad||{id:it.id,why:"dec"}; }
    else if((d.decyzja==="POPRAW"||d.decyzja==="USUN") && !(d.uwagi||"").trim()){ bad=bad||{id:it.id,why:"uw"}; }
  });
  if(bad){
    if(bad.why==="uw"){ const w=document.getElementById("note-"+bad.id); if(w) w.classList.add("missing"); }
    toast(bad.why==="dec" ? "Oceń wszystkie pozycje — bramka wymaga decyzji dla każdej" : "Decyzje POPRAW i USUŃ wymagają uzasadnienia");
    const el=document.getElementById("card-"+bad.id); if(el) el.scrollIntoView({behavior:"smooth",block:"center"});
    return;
  }
  const key=s.rola+"|"+s.etap+"|"+s.material;
  const n=(state.pubCount[key]||0); state.pubCount[key]=n+1;
  const wersja="v1."+n; const dt=today();
  state.bank.forEach(b=>{ if(b.rola===s.rola && b.etap===s.etap && b.typ===s.material && b.status!=="archiwalne") b.status="archiwalne"; });
  const stat={TAK:"opublikowane",POPRAW:"do_poprawek",USUN:"wykluczone"};
  const c={TAK:0,POPRAW:0,USUN:0};
  s.items.forEach(it=>{ const d=s.decisions[it.id]; c[d.decyzja]++;
    state.bank.push({uid:key+"|"+wersja+"|"+it.id, id:it.id, rola:s.rola, etap:s.etap, typ:s.material,
      status:stat[d.decyzja], wersja:wersja, data:dt, owner:state.ekspert, uwagi:(d.uwagi||"").trim()||null, tagi:bankTags(s,it), payload:it});
  });
  const pubRecs = state.bank.filter(b=> b.rola===s.rola && b.etap===s.etap && b.typ===s.material && b.wersja===wersja && b.status==="opublikowane");
  const fixRecs = state.bank.filter(b=> b.rola===s.rola && b.etap===s.etap && b.typ===s.material && b.wersja===wersja && b.status==="do_poprawek");
  const delRecs = state.bank.filter(b=> b.rola===s.rola && b.etap===s.etap && b.typ===s.material && b.wersja===wersja && b.status==="wykluczone");
  state.lastPub={c:c,wersja:wersja,dt:dt,rola:s.rola,etap:s.etap,typ:s.material,razem:s.items.length,records:pubRecs,fixes:fixRecs,dels:delRecs};
  state.session=null; state.genPhase=0;
  openPub();
  savePubFiles();
}

/* ================= ZAPIS PLIKÓW PO AKCEPTACJI (CSV zaakceptowane + CSV do poprawy + HTML baza banku) ================= */
function fnSafe(s){ return String(s==null?"":s).replace(/[\\\/:*?"<>|]/g,"-").replace(/\s+/g," ").trim(); }
function pubFileBase(){
  const p=state.lastPub; if(!p) return "bank-materialow";
  return [ fnSafe(state.ekspert||"ekspert"), "Bank Materiałów", "zatwierdzone", fnSafe(etapLabel(p.etap)), fnSafe(ROLE[p.rola]), p.dt ].join("_");
}
function fixFileBase(){
  const p=state.lastPub; if(!p) return "do-poprawy";
  return [ fnSafe(state.ekspert||"ekspert"), "Bank Materiałów", "do poprawy", fnSafe(etapLabel(p.etap)), fnSafe(ROLE[p.rola]), p.dt ].join("_");
}
function delFileBase(){
  const p=state.lastPub; if(!p) return "do-usuniecia";
  return [ fnSafe(state.ekspert||"ekspert"), "Bank Materiałów", "do usunięcia", fnSafe(etapLabel(p.etap)), fnSafe(ROLE[p.rola]), p.dt ].join("_");
}
function bankFileBase(){
  return [ fnSafe(state.ekspert||"ekspert"), "Bank Materiałów", "baza zaakceptowanych", today() ].join("_");
}
function csvCell(v){ v=(v==null?"":String(v)); return '"'+v.replace(/"/g,'""')+'"'; }
function pubOptTxt(it){
  if(!it.opcje) return {opcje:"",poprawna:""};
  const all=it.opcje.map(o=>(o.poprawna?"[POPRAWNA] ":"")+o.tekst).join(" | ");
  const ok=it.opcje.filter(o=>o.poprawna).map(o=>o.tekst).join(" | ");
  return {opcje:all,poprawna:ok};
}
function buildPubCSV(){
  const p=state.lastPub; if(!p||!p.records) return "";
  const head=["lp","id","typ_materialu","odbiorca","etap","tytul_lub_pytanie","tresc_lub_kontekst","opcje","odpowiedz_poprawna","zrodlo_prawa","wersja","data_utworzenia","recenzent","status"];
  const rows=[head.map(csvCell).join(",")];
  p.records.forEach((b,i)=>{
    const it=b.payload||{};
    const isQuiz=(b.typ==="quiz");
    const o=pubOptTxt(it);
    const zrodlo=isQuiz ? (it.zrodlo? (it.zrodlo.akt+" · "+it.zrodlo.jednostka+" · stan prawny "+it.zrodlo.stan_prawny) : "") : (it.prawo||"");
    rows.push([ i+1, b.id, MAT[b.typ]||b.typ, ROLE[b.rola]||b.rola, etapLabel(b.etap),
      isQuiz? (it.pytanie||"") : (it.nazwa||""),
      isQuiz? (it.kontekst||"") : (it.opis||""),
      o.opcje, o.poprawna, zrodlo, b.wersja, b.data, b.owner, b.status
    ].map(csvCell).join(","));
  });
  return "\uFEFF"+rows.join("\r\n");
}
function buildFixCSV(){
  const p=state.lastPub; if(!p||!p.fixes) return "";
  const head=["lp","id","typ_materialu","odbiorca","etap","tytul_lub_pytanie","notatka_eksperta","tresc_oryginalna_json","polecenie_dla_AI","wersja","data_recenzji","recenzent","status"];
  const rows=[head.map(csvCell).join(",")];
  p.fixes.forEach((b,i)=>{
    const it=b.payload||{};
    const isQuiz=(b.typ==="quiz");
    const cmd="Popraw materiał "+b.id+" zgodnie z notatką eksperta z kolumny notatka_eksperta. Pracuj wyłącznie na treści z kolumny tresc_oryginalna_json: zachowaj strukturę JSON, rolę, poziom Blooma i cytowane źródło prawa (pkt wytycznych zmieniaj tylko, jeśli notatka tego wymaga). Nie dodawaj nowych faktów prawnych bez oparcia w źródle — braki oznacz [DO UZUPEŁNIENIA]. Zwróć pełny poprawiony JSON do ponownej recenzji eksperta.";
    rows.push([ i+1, b.id, MAT[b.typ]||b.typ, ROLE[b.rola]||b.rola, etapLabel(b.etap),
      isQuiz? (it.pytanie||"") : (it.nazwa||""),
      b.uwagi||"", JSON.stringify(it), cmd, b.wersja, b.data, b.owner, b.status
    ].map(csvCell).join(","));
  });
  return "\uFEFF"+rows.join("\r\n");
}
function buildDelCSV(){
  const p=state.lastPub; if(!p||!p.dels) return "";
  const head=["lp","id","typ_materialu","odbiorca","etap","tytul_lub_pytanie","uzasadnienie_usuniecia","tresc_oryginalna_json","wersja","data_recenzji","recenzent","status"];
  const rows=[head.map(csvCell).join(",")];
  p.dels.forEach((b,i)=>{
    const it=b.payload||{};
    const isQuiz=(b.typ==="quiz");
    rows.push([ i+1, b.id, MAT[b.typ]||b.typ, ROLE[b.rola]||b.rola, etapLabel(b.etap),
      isQuiz? (it.pytanie||"") : (it.nazwa||""),
      b.uwagi||"", JSON.stringify(it), b.wersja, b.data, b.owner, b.status
    ].map(csvCell).join(","));
  });
  return "\uFEFF"+rows.join("\r\n");
}

function triggerDownload(content,mime,fname){
  const blob=new Blob([content],{type:mime});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=fname;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function downloadPub(kind){
  const p=state.lastPub;
  if(kind==="csv"){
    if(!p||!p.records||!p.records.length){ toast("Brak zaakceptowanych pozycji w tej publikacji"); return; }
    triggerDownload(buildPubCSV(),"text/csv;charset=utf-8",pubFileBase()+".csv");
  } else if(kind==="fix"){
    if(!p||!p.fixes||!p.fixes.length){ toast("Ta publikacja nie ma pozycji do poprawy"); return; }
    triggerDownload(buildFixCSV(),"text/csv;charset=utf-8",fixFileBase()+".csv");
  } else if(kind==="del"){
    if(!p||!p.dels||!p.dels.length){ toast("Ta publikacja nie ma pozycji do usunięcia"); return; }
    triggerDownload(buildDelCSV(),"text/csv;charset=utf-8",delFileBase()+".csv");
  } else if(kind==="bank"){
    if(!bankAccepted().length){ toast("Bank nie zawiera jeszcze zaakceptowanych pozycji"); return; }
    triggerDownload(buildBankHTML(),"text/html;charset=utf-8",bankFileBase()+".html");
  }
}
function savePubFiles(){
  const p=state.lastPub; if(!p) return;
  const parts=[];
  if(p.records && p.records.length){ downloadPub("csv"); parts.push("CSV zaakceptowane"); }
  if(p.fixes && p.fixes.length){ setTimeout(()=>downloadPub("fix"),700); parts.push("CSV do poprawy"); }
  if(p.dels && p.dels.length){ setTimeout(()=>downloadPub("del"),1050); parts.push("CSV do usunięcia"); }
  if(bankAccepted().length){ setTimeout(()=>downloadPub("bank"),1400); parts.push("HTML baza banku"); }
  if(parts.length) toast("Zapisano: "+parts.join(" + "));
}

/* ================= RENDER: nagłówek ================= */
const STEPS=[
 {id:"start", lab:"Ekspert"},
 {id:"odbiorca", lab:"Odbiorca"},
 {id:"etap", lab:"Etap i materiał"},
 {id:"gen", lab:"Propozycja i recenzja"},
 {id:"bank", lab:"Bank"}
];
function stepIdx(){ const s=state.screen;
  if(s==="start")return 0; if(s==="odbiorca")return 1; if(s==="etap")return 2;
  if(s==="generacja"||s==="fallback"||s==="recenzja")return 3; return 4; }
function stepGo(i){
  if(i===0) go("start");
  else if(i===1) goOdbiorca();
  else if(i===2){ if(state.rola) go("etap"); }
  else if(i===3){ if(state.session) go("recenzja"); else if(state.rola&&state.etap&&state.material) nextFromEtap(); }
  else if(i===4) go("bank");
}
function renderTopbar(){
  const tb=document.getElementById("topbar");
  tb.hidden = (state.screen==="start");
  document.getElementById("btnRole").hidden = (state.screen==="odbiorca");
  document.getElementById("who").textContent =
    (state.ekspert? "recenzent: "+state.ekspert : "") + (state.rola? " · odbiorca: "+ROLE[state.rola] : "");
  const cur=stepIdx();
  document.getElementById("stepper").innerHTML = STEPS.map((st,i)=>{
    const cls = i===cur? "cur" : (i<cur? "done":"");
    const clickable = (i===0) || (i===1) || (i===2&&state.rola) || (i===3&&(state.session||(state.rola&&state.etap&&state.material))) || (i===4);
    return '<li class="step '+cls+'"><button '+(clickable&&i!==cur?'':'disabled ')+'onclick="stepGo('+i+')"><span class="dot">'+(i+1)+'</span>'+st.lab+'</button></li>';
  }).join("");
  document.getElementById("actionbar").hidden = (state.screen!=="recenzja");
}
