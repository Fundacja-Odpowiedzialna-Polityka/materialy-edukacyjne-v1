": "wytyczne-kraj:pkt20", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział I, pkt 20 w zw. z pkt 9", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-A-q02", "rola": "obserwator", "faza": "otwarcie_lokalu", "cel_uczenia": "Znać różnicę uprawnień: rejestracja przysługuje mężom zaufania, nie obserwatorom.", "poziom_blooma": "zapamietywanie", "typ": "prawda_falsz", "kontekst": "Chcesz nagrać telefonem czynności komisji przed rozpoczęciem głosowania.", "pytanie": "Obserwatorka społeczna może rejestrować prace komisji własnym urządzeniem.", "opcje": [{"tekst": "Prawda", "poprawna": false, "uzasadnienie_dystraktora": "rejestrować czynności komisji mogą mężowie zaufania (pkt 10); obserwatorzy społeczni są tego uprawnienia wprost pozbawieni (pkt 20)"}, {"tekst": "Fałsz", "poprawna": true, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Tak — obserwatorzy społeczni nie mogą rejestrować prac komisji, wnosić uwag do protokołów ani być obecni przy ich przewożeniu (pkt 20).", "feedback_niepoprawny": "Sprawdź pkt 20: rejestracja to uprawnienie mężów zaufania; obserwator społeczny jest go pozbawiony.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt20", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział I, pkt 20", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-A-q03", "rola": "obserwator", "faza": "otwarcie_lokalu", "cel_uczenia": "Wiedzieć, jakie dokumenty obserwatorka przedstawia przewodniczącemu.", "poziom_blooma": "zapamietywanie", "typ": "wielokrotny_wybor", "kontekst": "Przychodzisz do lokalu o 5:50, przed rozpoczęciem czynności komisji.", "pytanie": "Co przedstawiasz przewodniczącemu komisji przed przystąpieniem do obserwacji?", "opcje": [{"tekst": "Dokument tożsamości oraz zaświadczenie zgodne ze wzorem PKW, podpisane przez osobę reprezentującą organizację.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Wyłącznie legitymację członkowską fundacji.", "poprawna": false, "uzasadnienie_dystraktora": "legitymacja nie zastępuje zaświadczenia według wzoru PKW (uchwała nr 66/2023) ani dokumentu tożsamości"}, {"tekst": "Zgodę komisarza wyborczego na obserwację w tym obwodzie.", "poprawna": false, "uzasadnienie_dystraktora": "wytyczne nie przewidują zgody komisarza — wystarczy dokument tożsamości i zaświadczenie od organizacji"}], "feedback_poprawny": "Tak. Obserwatorka okazuje dokument tożsamości i zaświadczenie sporządzone według wzoru PKW (pkt 19).", "feedback_niepoprawny": "Zerknij do pkt 19: dokument tożsamości + zaświadczenie wg wzoru PKW — to komplet.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt19", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział I, pkt 19", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-A-q04", "rola": "obserwator", "faza": "otwarcie_lokalu", "cel_uczenia": "Ocenić prawidłowość ustawienia urny z perspektywy obserwacji.", "poziom_blooma": "rozumienie", "typ": "prawda_falsz", "kontekst": "Komisja ustawia urnę we wnęce, częściowo zasłoniętej filarem.", "pytanie": "Urna powinna być ustawiona tak, by przez cały czas głosowania była widoczna m.in. dla obserwatorów społecznych.", "opcje": [{"tekst": "Prawda", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Fałsz", "poprawna": false, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Tak. Urna ma być widoczna przez cały czas głosowania dla członków komisji, mężów zaufania oraz obserwatorów społecznych i międzynarodowych (pkt 39 ppkt 7).", "feedback_niepoprawny": "Sprawdź pkt 39 ppkt 7: widoczność urny obejmuje wprost obserwatorów społecznych.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt39", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział III, pkt 39 ppkt 7", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-A-q05", "rola": "obserwator", "faza": "otwarcie_lokalu", "cel_uczenia": "Znać wyłączenia podmiotowe funkcji obserwatora społecznego.", "poziom_blooma": "zapamietywanie", "typ": "wielokrotny_wybor", "kontekst": "Organizacja kompletuje listę obserwatorów na dzień głosowania.", "pytanie": "Kto NIE może pełnić funkcji obserwatora społecznego?", "opcje": [{"tekst": "Kandydat w wyborach.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Osoba, która ukończyła 18 lat w dniu głosowania.", "poprawna": false, "uzasadnienie_dystraktora": "ukończenie 18 lat najpóźniej w dniu głosowania spełnia warunek czynnego prawa wyborczego (pkt 17)"}, {"tekst": "Członek fundacji, która go wyznaczyła.", "poprawna": false, "uzasadnienie_dystraktora": "członkostwo w delegującej organizacji nie jest przeszkodą — katalog wyłączeń z pkt 18 go nie obejmuje"}], "feedback_poprawny": "Tak. Obserwatorem nie może być m.in. kandydat w wyborach, komisarz wyborczy, pełnomocnik wyborczy i finansowy, urzędnik wyborczy, członek komisji (pkt 18).", "feedback_niepoprawny": "Wróć do pkt 18 — katalog wyłączeń otwiera kandydat w wyborach.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt18", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział I, pkt 18", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}], "B": [{"id": "obs-B-q01", "rola": "obserwator", "faza": "obsluga_wyborcy", "cel_uczenia": "Znać zakaz udzielania pomocy w głosowaniu przez obserwatora.", "poziom_blooma": "zapamietywanie", "typ": "prawda_falsz", "kontekst": "Wyborca prosi Cię o pomoc przy wypełnieniu karty.", "pytanie": "Obserwatorka społeczna może pomóc wyborcy w głosowaniu, jeśli ten o to poprosi.", "opcje": [{"tekst": "Prawda", "poprawna": false, "uzasadnienie_dystraktora": "pomocy w głosowaniu nie może udzielać członek komisji, mąż zaufania, obserwator społeczny ani międzynarodowy (pkt 65)"}, {"tekst": "Fałsz", "poprawna": true, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Tak — pomoc techniczna może pochodzić od innej osoby wskazanej przez wyborcę, ale nigdy od obserwatora, męża zaufania ani członka komisji (pkt 65).", "feedback_niepoprawny": "Wróć do pkt 65: obserwator społeczny jest wprost wyłączony z udzielania pomocy w głosowaniu.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt65", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział IV, pkt 65", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-B-q02", "rola": "obserwator", "faza": "obsluga_wyborcy", "cel_uczenia": "Zareagować prawidłowo na prośbę wyborcy o pomoc.", "poziom_blooma": "stosowanie", "typ": "scenariusz", "kontekst": "Starsza wyborczyni podchodzi do Ciebie: „Pani mi pomoże zaznaczyć, ja słabo widzę”.", "pytanie": "Jak reagujesz?", "opcje": [{"tekst": "Grzecznie odmawiam i wyjaśniam, że pomóc technicznie może inna wskazana przez nią osoba — np. ktoś towarzyszący — ale nie obserwatorka.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Pomagam dyskretnie za kotarą — to tylko pomoc techniczna.", "poprawna": false, "uzasadnienie_dystraktora": "nawet czysto techniczna pomoc jest dla obserwatora zakazana (pkt 65)"}, {"tekst": "Proszę członka komisji, żeby zaznaczył głos za wyborczynię.", "poprawna": false, "uzasadnienie_dystraktora": "członek komisji też nie może udzielać pomocy w głosowaniu, a nikt nie może głosować w zastępstwie wyborcy (pkt 65)"}], "feedback_poprawny": "Tak. Pomoc może mieć tylko techniczny charakter i pochodzić od innej osoby, także niepełnoletniej — nigdy od obserwatora czy członka komisji (pkt 65).", "feedback_niepoprawny": "Sprawdź pkt 65: krąg osób wyłączonych z pomocy obejmuje obserwatorkę; wskaż wyborczyni dopuszczalną ścieżkę.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt65", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział IV, pkt 65", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-B-q03", "rola": "obserwator", "faza": "obsluga_wyborcy", "cel_uczenia": "Znać standard tajności przy wrzucaniu kart do urny.", "poziom_blooma": "rozumienie", "typ": "prawda_falsz", "kontekst": "Obserwujesz strefę urny.", "pytanie": "Wyborcy powinni wrzucać karty do urny tak, aby strona zadrukowana była niewidoczna.", "opcje": [{"tekst": "Prawda", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Fałsz", "poprawna": false, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Tak — to standard tajności z pkt 63 (art. 52 § 6 KW); czuwa nad nim m.in. członek komisji wyznaczony do urny.", "feedback_niepoprawny": "Sprawdź pkt 63: karty wrzuca się stroną zadrukowaną niewidoczną.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt63", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział IV, pkt 63", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-B-q04", "rola": "obserwator", "faza": "obsluga_wyborcy", "cel_uczenia": "Ocenić dopuszczalność głosowania za inną osobę.", "poziom_blooma": "ocena", "typ": "wielokrotny_wybor", "kontekst": "Widzisz, jak mężczyzna bierze dwie serie kart i mówi: „żona czeka w aucie, zagłosuję za nią”.", "pytanie": "Jaka jest prawidłowa ocena tej sytuacji?", "opcje": [{"tekst": "To niedopuszczalne — głosować za inną osobę może wyłącznie pełnomocnik z aktem pełnomocnictwa.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "To dopuszczalne między małżonkami.", "poprawna": false, "uzasadnienie_dystraktora": "niedopuszczalne jest głosowanie za członka rodziny lub inną osobę; wyjątkiem jest tylko pełnomocnictwo do głosowania (pkt 64)"}, {"tekst": "To dopuszczalne, jeśli komisja wyrazi zgodę.", "poprawna": false, "uzasadnienie_dystraktora": "komisja nie ma kompetencji do uchylenia zakazu — zakaz łamie zasadę osobistego głosowania (pkt 63–64)"}], "feedback_poprawny": "Tak. Głosowanie za członka rodziny jest niedopuszczalne; zakaz nie dotyczy jedynie osób z pełnomocnictwem do głosowania (pkt 64).", "feedback_niepoprawny": "Wróć do pkt 64: wyjątek od osobistego głosowania to wyłącznie pełnomocnictwo.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt64", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział IV, pkt 64", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-B-q05", "rola": "obserwator", "faza": "obsluga_wyborcy", "cel_uczenia": "Znać procedurę reakcji komisji na wyniesienie karty z lokalu.", "poziom_blooma": "rozumienie", "typ": "wielokrotny_wybor", "kontekst": "Ktoś informuje komisję, że wyborca wyniósł kartę do głosowania przed budynek i oferuje jej odstąpienie.", "pytanie": "Czego powinnaś oczekiwać od komisji zgodnie z wytycznymi?", "opcje": [{"tekst": "Niezwłocznego zawiadomienia Policji i opisania zdarzenia we właściwym protokole głosowania.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Odebrania karty i wrzucenia jej do urny po powrocie wyborcy.", "poprawna": false, "uzasadnienie_dystraktora": "wytyczne nie przewidują „odzyskiwania” karty — ścieżka to zawiadomienie Policji i opis w protokole (pkt 67)"}, {"tekst": "Braku reakcji — poza lokalem komisja nie działa.", "poprawna": false, "uzasadnienie_dystraktora": "pkt 67 obejmuje także zdarzenia poza lokalem: komisja zawiadamia Policję i opisuje zdarzenie w protokole"}], "feedback_poprawny": "Tak. Przy wyniesieniu lub obrocie kartami komisja niezwłocznie zawiadamia Policję i opisuje zdarzenie w protokole (pkt 67).", "feedback_niepoprawny": "Sprawdź pkt 67: zawiadomienie Policji + opis w protokole — to miara prawidłowej reakcji komisji.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt67", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział IV, pkt 67", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}], "C": [{"id": "obs-C-q01", "rola": "obserwator", "faza": "pelnomocnik", "cel_uczenia": "Znać prawo obecności obserwatorki przy czynnościach komisji.", "poziom_blooma": "zapamietywanie", "typ": "prawda_falsz", "kontekst": "Komisja weryfikuje akt pełnomocnictwa przy stole.", "pytanie": "Obserwatorka może przyglądać się czynnościom komisji przy weryfikacji aktu pełnomocnictwa.", "opcje": [{"tekst": "Prawda", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Fałsz", "poprawna": false, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Tak — obserwatorka ma uprawnienia męża zaufania (pkt 20), a więc prawo obecności przy czynnościach komisji; nie może jedynie ich wykonywać ani dotykać dokumentów głosowania.", "feedback_niepoprawny": "Sprawdź pkt 20: obecność tak, wykonywanie czynności i dotykanie kart — nie.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt20", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział I, pkt 20", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-C-q02", "rola": "obserwator", "faza": "pelnomocnik", "cel_uczenia": "Ocenić prawidłowość odmowy wobec mocodawcy po głosie pełnomocnika.", "poziom_blooma": "ocena", "typ": "scenariusz", "kontekst": "Komisja odmawia dopuszczenia wyborcy, którego pełnomocnik zagłosował rano — mimo że wyborca okazuje pisemne cofnięcie pełnomocnictwa. Wyborca prosi Cię o interwencję.", "pytanie": "Jaka jest prawidłowa ocena?", "opcje": [{"tekst": "Komisja postępuje prawidłowo — po głosowaniu pełnomocnika cofnięcie jest bezskuteczne, a mocodawca nie głosuje.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Komisja się myli — pisemne cofnięcie zawsze przywraca prawo głosu.", "poprawna": false, "uzasadnienie_dystraktora": "cofnięcie działa tylko zanim pełnomocnik zagłosuje; później jest bezskuteczne (pkt 59)"}, {"tekst": "Komisja powinna dopuścić wyborcę warunkowo i opisać spór w protokole.", "poprawna": false, "uzasadnienie_dystraktora": "wytyczne nie znają głosowania warunkowego — rozstrzygnięcie z pkt 59 jest jednoznaczne"}], "feedback_poprawny": "Tak. Gdy pełnomocnik już głosował, komisja nie dopuszcza mocodawcy; cofnięcie złożone po fakcie jest bezskuteczne (pkt 59).", "feedback_niepoprawny": "Wróć do pkt 59 — obserwatorka odnotowuje przebieg, ale odmowa komisji jest tu zgodna z wytycznymi.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt59", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział IV, pkt 59", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-C-q03", "rola": "obserwator", "faza": "pelnomocnik", "cel_uczenia": "Znać zakaz dotykania dokumentów głosowania przez obserwatorkę.", "poziom_blooma": "zapamietywanie", "typ": "wielokrotny_wybor", "kontekst": "Przewodniczący podaje Ci akt pełnomocnictwa: „niech pani sprawdzi, czy wygląda w porządku”.", "pytanie": "Jak reagujesz?", "opcje": [{"tekst": "Odmawiam — obserwatorka nie wykonuje czynności komisji; weryfikacja aktu należy do komisji.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Sprawdzam akt — to tylko pomoc, nie czynność komisji.", "poprawna": false, "uzasadnienie_dystraktora": "weryfikacja dokumentu uprawniającego do głosowania jest czynnością komisji, której obserwator nie wykonuje (pkt 20 w zw. z pkt 9 ppkt 1)"}, {"tekst": "Sprawdzam, jeśli obecny jest mąż zaufania jako świadek.", "poprawna": false, "uzasadnienie_dystraktora": "obecność świadka nie zmienia zakazu wykonywania czynności komisji przez obserwatora"}], "feedback_poprawny": "Tak. Ocena aktu pełnomocnictwa to czynność komisji — obserwatorka obserwuje, nie wykonuje (pkt 20 w zw. z pkt 9).", "feedback_niepoprawny": "Sprawdź pkt 20 i pkt 9: żadnych czynności komisji, nawet na prośbę przewodniczącego.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt20", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział I, pkt 20 w zw. z pkt 9", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-C-q04", "rola": "obserwator", "faza": "pelnomocnik", "cel_uczenia": "Znać zasadę stosowania adnotacji o odmowie kart do pełnomocnika.", "poziom_blooma": "rozumienie", "typ": "prawda_falsz", "kontekst": "Pełnomocnik odmawia przyjęcia karty referendalnej.", "pytanie": "Zasady odmowy przyjęcia kart (adnotacje typu „bez referendum”) stosuje się również do głosowania przez pełnomocnika.", "opcje": [{"tekst": "Prawda", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Fałsz", "poprawna": false, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Tak — pkt 60 odsyła wprost do zasad z pkt 50–52.", "feedback_niepoprawny": "Sprawdź pkt 60: reguły odmowy i zwrotu kart obejmują pełnomocnika.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt60", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział IV, pkt 60", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-C-q05", "rola": "obserwator", "faza": "pelnomocnik", "cel_uczenia": "Wiedzieć, jak komisja rozlicza głosowanie pełnomocników po zakończeniu głosowania.", "poziom_blooma": "rozumienie", "typ": "wielokrotny_wybor", "kontekst": "Wieczorem obserwujesz rozliczanie protokołów.", "pytanie": "Z czym komisja porównuje liczbę głosujących przez pełnomocnika ustaloną z podpisów w spisie?", "opcje": [{"tekst": "Z liczbą otrzymanych aktów pełnomocnictwa (pomijając akty cofnięte i wygasłe).", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Z liczbą wszystkich podpisów w spisie.", "poprawna": false, "uzasadnienie_dystraktora": "punktem odniesienia są akty pełnomocnictwa, nie ogół podpisów (pkt 111 ppkt 8)"}, {"tekst": "Z szacunkiem członków komisji z pamięci.", "poprawna": false, "uzasadnienie_dystraktora": "rozliczenie opiera się na dokumentach: adnotacjach w spisie i aktach pełnomocnictwa (pkt 111 ppkt 8)"}], "feedback_poprawny": "Tak. Liczbę z adnotacji „Udzielono pełnomocnictwa do głosowania – art. 56 Kw” porównuje się z liczbą aktów pełnomocnictwa; rozbieżność oznacza ponowne przeliczenie (pkt 111 ppkt 8).", "feedback_niepoprawny": "Wróć do pkt 111 ppkt 8: podpisy przy adnotacji kontra akty pełnomocnictwa.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt111", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 111 ppkt 8", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}], "D": [{"id": "obs-D-q01", "rola": "obserwator", "faza": "pomoc_wyborcy", "cel_uczenia": "Znać zakaz pomocy w głosowaniu przez obserwatorkę — bez wyjątków sytuacyjnych.", "poziom_blooma": "zapamietywanie", "typ": "prawda_falsz", "kontekst": "W lokalu nie ma nikogo, kto mógłby pomóc wyborcy z niepełnosprawnością.", "pytanie": "Skoro nikt inny nie może pomóc, obserwatorka może wyjątkowo udzielić pomocy technicznej.", "opcje": [{"tekst": "Prawda", "poprawna": false, "uzasadnienie_dystraktora": "wytyczne nie przewidują wyjątku „z braku innych osób” — obserwator społeczny jest bezwzględnie wyłączony z pomocy w głosowaniu (pkt 65)"}, {"tekst": "Fałsz", "poprawna": true, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Tak — zakaz jest bezwarunkowy: pomocy nie udziela członek komisji, mąż zaufania, obserwator społeczny ani międzynarodowy (pkt 65).", "feedback_niepoprawny": "Sprawdź pkt 65: brak innych pomocników nie tworzy wyjątku dla obserwatorki.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt65", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział IV, pkt 65", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-D-q02", "rola": "obserwator", "faza": "pomoc_wyborcy", "cel_uczenia": "Ocenić prawidłowość wydania kart wyborcy niemogącemu się podpisać.", "poziom_blooma": "ocena", "typ": "wielokrotny_wybor", "kontekst": "Wyborca okazuje orzeczenie o znacznym stopniu niepełnosprawności i nie może się podpisać. Członek komisji wydaje karty i coś notuje w spisie.", "pytanie": "Jaka jest prawidłowa ocena?", "opcje": [{"tekst": "Postępowanie prawidłowe — komisja wydaje karty, a w rubryce „Uwagi” odnotowuje fakt wydania i przyczynę braku podpisu.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Nieprawidłowe — bez podpisu kart wydawać nie wolno nigdy.", "poprawna": false, "uzasadnienie_dystraktora": "reguła „najpierw podpis” ma wyjątek dla udokumentowanej znacznej/umiarkowanej niepełnosprawności (pkt 53)"}, {"tekst": "Nieprawidłowe — za wyborcę powinien podpisać się członek komisji.", "poprawna": false, "uzasadnienie_dystraktora": "nikt nie podpisuje się za wyborcę; właściwa ścieżka to adnotacja w „Uwagach” (pkt 53)"}], "feedback_poprawny": "Tak. Przy udokumentowanym znacznym lub umiarkowanym stopniu niepełnosprawności komisja wydaje karty i odnotowuje przyczynę braku podpisu w „Uwagach” (pkt 53).", "feedback_niepoprawny": "Wróć do pkt 53: wyjątek od podpisu istnieje, ale wymaga dokumentu i adnotacji.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt53", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział IV, pkt 53", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-D-q03", "rola": "obserwator", "faza": "pomoc_wyborcy", "cel_uczenia": "Rozpoznać nieprawidłowość: członek komisji pomagający w głosowaniu.", "poziom_blooma": "ocena", "typ": "scenariusz", "kontekst": "Członek komisji wchodzi z wyborcą za kotarę, mówiąc: „pomogę panu zaznaczyć”.", "pytanie": "Jak to oceniasz?", "opcje": [{"tekst": "To nieprawidłowość do odnotowania — członek komisji nie może udzielać pomocy w głosowaniu.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "To dopuszczalne — członek komisji jest osobą zaufania publicznego.", "poprawna": false, "uzasadnienie_dystraktora": "pkt 65 wyłącza członków komisji z udzielania pomocy w głosowaniu niezależnie od intencji"}, {"tekst": "To dopuszczalne, jeśli drugi członek komisji patrzy.", "poprawna": false, "uzasadnienie_dystraktora": "świadek nie uchyla zakazu — pomoc może pochodzić tylko od innej osoby wskazanej przez wyborcę"}], "feedback_poprawny": "Tak. Pomocy w głosowaniu nie może udzielać członek komisji (pkt 65) — obserwatorka odnotowuje takie zdarzenie.", "feedback_niepoprawny": "Sprawdź pkt 65: krąg wyłączonych obejmuje członków komisji; to klasyczna nieprawidłowość do odnotowania.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt65", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział IV, pkt 65", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-D-q04", "rola": "obserwator", "faza": "pomoc_wyborcy", "cel_uczenia": "Znać wymóg tajności miejsca użycia nakładki Braille’a.", "poziom_blooma": "rozumienie", "typ": "prawda_falsz", "kontekst": "Wyborca z nakładką wypełnia kartę przy stole komisji, na widoku.", "pytanie": "Komisja powinna zapewnić wyborcy korzystającemu z nakładek miejsce gwarantujące tajność głosowania.", "opcje": [{"tekst": "Prawda", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Fałsz", "poprawna": false, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Tak — właściwe miejsce (np. odpowiedni stolik) musi zapewniać tajność (pkt 62). Wypełnianie karty na widoku to odstępstwo do odnotowania.", "feedback_niepoprawny": "Sprawdź pkt 62: nakładka nie zawiesza zasady tajności.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt62", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział IV, pkt 62", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-D-q05", "rola": "obserwator", "faza": "pomoc_wyborcy", "cel_uczenia": "Wiedzieć, kogo komisja informuje o utracie nakładek.", "poziom_blooma": "zapamietywanie", "typ": "wielokrotny_wybor", "kontekst": "Po głosowaniu okazuje się, że jedna nakładka zniknęła.", "pytanie": "Kogo komisja niezwłocznie informuje o utracie lub zniszczeniu nakładek?", "opcje": [{"tekst": "Urząd gminy.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Państwową Komisję Wyborczą.", "poprawna": false, "uzasadnienie_dystraktora": "ścieżka z pkt 62 wskazuje urząd gminy, nie PKW"}, {"tekst": "Policję.", "poprawna": false, "uzasadnienie_dystraktora": "utrata nakładki to zdarzenie organizacyjne zgłaszane do urzędu gminy (pkt 62), nie sprawa dla Policji"}], "feedback_poprawny": "Tak. O utracie lub zniszczeniu nakładek komisja niezwłocznie informuje urząd gminy (pkt 62).", "feedback_niepoprawny": "Wróć do pkt 62: adresatem informacji jest urząd gminy.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt62", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział IV, pkt 62", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}], "E": [{"id": "obs-E-q01", "rola": "obserwator", "faza": "zaswiadczenie", "cel_uczenia": "Znać granicę: obserwatorka nie weryfikuje dokumentów wyborców.", "poziom_blooma": "zapamietywanie", "typ": "prawda_falsz", "kontekst": "Masz wątpliwość, czy okazane komisji zaświadczenie jest oryginałem.", "pytanie": "Obserwatorka może zażądać od wyborcy okazania jej zaświadczenia do własnej weryfikacji.", "opcje": [{"tekst": "Prawda", "poprawna": false, "uzasadnienie_dystraktora": "weryfikacja dokumentów to czynność komisji; obserwatorka nie wykonuje czynności komisji (pkt 20 w zw. z pkt 9 ppkt 1) — może odnotować wątpliwość"}, {"tekst": "Fałsz", "poprawna": true, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Tak — obserwatorka obserwuje i odnotowuje; weryfikacja zaświadczenia należy do komisji (pkt 20 w zw. z pkt 9).", "feedback_niepoprawny": "Sprawdź pkt 20 i pkt 9: żadnego żądania dokumentów od wyborców.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt20", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział I, pkt 20 w zw. z pkt 9", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-E-q02", "rola": "obserwator", "faza": "zaswiadczenie", "cel_uczenia": "Wiedzieć, jak wieczorem rozlicza się głosowanie z zaświadczeń.", "poziom_blooma": "rozumienie", "typ": "wielokrotny_wybor", "kontekst": "Obserwujesz wypełnianie punktu 8 protokołów.", "pytanie": "Z czym komisja porównuje liczbę adnotacji o głosowaniu na podstawie zaświadczenia?", "opcje": [{"tekst": "Z liczbą odebranych od wyborców zaświadczeń.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Z liczbą wyborców dopisanych do spisu z jakiegokolwiek powodu.", "poprawna": false, "uzasadnienie_dystraktora": "punktem odniesienia są odebrane zaświadczenia, nie wszystkie dopisania (pkt 111 ppkt 9)"}, {"tekst": "Z liczbą kart wyjętych z urny.", "poprawna": false, "uzasadnienie_dystraktora": "karty z urny rozlicza się w innych punktach — tu liczą się adnotacje kontra zaświadczenia (pkt 111 ppkt 9)"}], "feedback_poprawny": "Tak. Liczbę adnotacji porównuje się z liczbą otrzymanych zaświadczeń; te liczby powinny być równe, a rozbieżność wymusza ponowne przeliczenie (pkt 111 ppkt 9).", "feedback_niepoprawny": "Wróć do pkt 111 ppkt 9: adnotacje kontra odebrane zaświadczenia.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt111", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 111 ppkt 9", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-E-q03", "rola": "obserwator", "faza": "zaswiadczenie", "cel_uczenia": "Rozpoznać nieprawidłowość: zwrot zaświadczenia wyborcy.", "poziom_blooma": "ocena", "typ": "scenariusz", "kontekst": "Członek komisji wpisuje adnotację, po czym oddaje wyborcy zaświadczenie „na pamiątkę”.", "pytanie": "Jak to oceniasz?", "opcje": [{"tekst": "To nieprawidłowość — zaświadczenie odbiera się od wyborcy i dołącza do spisu; bez tego wieczorne rozliczenie punktu 8 się nie zepnie.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "To dopuszczalne — liczy się adnotacja, dokument jest wyborcy.", "poprawna": false, "uzasadnienie_dystraktora": "zaświadczenie należy odebrać i dołączyć do spisu (pkt 47 ppkt 1); oddanie go uniemożliwia porównanie z pkt 111 ppkt 9"}, {"tekst": "To dopuszczalne za zgodą przewodniczącego.", "poprawna": false, "uzasadnienie_dystraktora": "przewodniczący nie może uchylić obowiązku odebrania zaświadczenia"}], "feedback_poprawny": "Tak. Zaświadczenie zostaje przy komisji — dołączone do spisu — bo wieczorem porównuje się je z adnotacjami (pkt 47 ppkt 1; pkt 111 ppkt 9).", "feedback_niepoprawny": "Sprawdź pkt 47 ppkt 1: dokument zostaje w dokumentacji komisji, nie u wyborcy.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt47", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział IV, pkt 47 ppkt 1", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-E-q04", "rola": "obserwator", "faza": "zaswiadczenie", "cel_uczenia": "Znać zasadę osłaniania dodatkowego formularza spisu.", "poziom_blooma": "rozumienie", "typ": "prawda_falsz", "kontekst": "Wyborca dopisany z zaświadczenia składa podpis na dodatkowym formularzu.", "pytanie": "Dodatkowy formularz spisu również powinien być osłaniany podczas składania podpisów.", "opcje": [{"tekst": "Prawda", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Fałsz", "poprawna": false, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Tak — osłona chroni dane osobowe innych wyborców także na dodatkowym formularzu (pkt 55).", "feedback_niepoprawny": "Sprawdź pkt 55: obowiązek osłony obejmuje dodatkowy formularz spisu.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt55", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział IV, pkt 55", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-E-q05", "rola": "obserwator", "faza": "zaswiadczenie", "cel_uczenia": "Znać prawo wyborcy do zaświadczenia o odmowie wydania kart.", "poziom_blooma": "rozumienie", "typ": "wielokrotny_wybor", "kontekst": "Wyborca bez zaświadczenia i spoza spisu nie otrzymał kart. Jest oburzony i pyta, co może zrobić.", "pytanie": "Czego zgodnie z wytycznymi może zażądać od komisji?", "opcje": [{"tekst": "Zaświadczenia potwierdzającego odmowę wydania kart z podaniem przyczyny.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Wydania kart „warunkowo”, do wyjaśnienia.", "poprawna": false, "uzasadnienie_dystraktora": "wytyczne nie znają głosowania warunkowego — poza spisem i bez zaświadczenia kart się nie wydaje"}, {"tekst": "Wpisania go do spisu na podstawie samego dowodu osobistego.", "poprawna": false, "uzasadnienie_dystraktora": "dowód potwierdza tożsamość, ale nie prawo głosowania w tym obwodzie — do dopisania potrzebne jest zaświadczenie (pkt 47)"}], "feedback_poprawny": "Tak. Na żądanie wyborcy komisja wydaje zaświadczenie o odmowie wydania kart z podaniem przyczyny (pkt 70); informację o wydaniu umieszcza się w „Uwagach” (pkt 71).", "feedback_niepoprawny": "Wróć do pkt 70: odmowa musi być na żądanie udokumentowana zaświadczeniem z przyczyną.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt70", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział IV, pkt 70", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}], "F": [{"id": "obs-F-q01", "rola": "obserwator", "faza": "zamkniecie_lokalu", "cel_uczenia": "Znać prawo obecności obserwatorki po zamknięciu lokalu.", "poziom_blooma": "zapamietywanie", "typ": "prawda_falsz", "kontekst": "Przewodniczący po 21:00 mówi: „dziękujemy, teraz pracujemy sami”.", "pytanie": "Obserwatorka społeczna może pozostać w lokalu po zamknięciu i obserwować czynności komisji.", "opcje": [{"tekst": "Prawda", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Fałsz", "poprawna": false, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Tak — po zamknięciu lokalu w środku mogą przebywać m.in. obserwatorzy społeczni (pkt 99). Próba wyproszenia to nieprawidłowość do odnotowania.", "feedback_niepoprawny": "Sprawdź pkt 99: obserwatorka ma prawo być obecna po zamknięciu lokalu.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt99", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział V, pkt 99", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-F-q02", "rola": "obserwator", "faza": "zamkniecie_lokalu", "cel_uczenia": "Znać zakaz udziału obserwatorki w liczeniu głosów.", "poziom_blooma": "zapamietywanie", "typ": "prawda_falsz", "kontekst": "Zmęczona komisja proponuje: „pani nam pomoże segregować karty, szybciej pójdzie”.", "pytanie": "Obserwatorka może pomóc komisji w liczeniu głosów, jeśli komisja o to prosi.", "opcje": [{"tekst": "Prawda", "poprawna": false, "uzasadnienie_dystraktora": "mężowie zaufania, obserwatorzy społeczni i międzynarodowi nie mogą uczestniczyć w liczeniu głosów ani pomagać członkom komisji (pkt 99)"}, {"tekst": "Fałsz", "poprawna": true, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Tak — obserwatorzy nie uczestniczą w liczeniu głosów ani nie pomagają komisji w jej zadaniach (pkt 99).", "feedback_niepoprawny": "Sprawdź pkt 99 zdanie ostatnie: zakaz udziału w liczeniu i pomagania komisji.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt99", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział V, pkt 99", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-F-q03", "rola": "obserwator", "faza": "zamkniecie_lokalu", "cel_uczenia": "Znać zasady obecności dziennikarzy po zamknięciu.", "poziom_blooma": "rozumienie", "typ": "wielokrotny_wybor", "kontekst": "Ekipa telewizyjna chce nagrywać całe liczenie głosów.", "pytanie": "Kiedy dziennikarze mogą przebywać w lokalu po zakończeniu głosowania?", "opcje": [{"tekst": "Wyłącznie w czasie otwierania urny i wyjmowania z niej kart.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Przez cały czas ustalania wyników.", "poprawna": false, "uzasadnienie_dystraktora": "obecność dziennikarzy jest ograniczona do otwierania urny i wyjmowania kart (pkt 99)"}, {"tekst": "Wcale — po 21:00 media nie mają wstępu.", "poprawna": false, "uzasadnienie_dystraktora": "wytyczne dopuszczają obecność dziennikarzy w ściśle określonym momencie (pkt 99)"}], "feedback_poprawny": "Tak. Dziennikarze mogą być obecni wyłącznie przy otwieraniu urny i wyjmowaniu kart, na zasadach z pkt 22 (pkt 99).", "feedback_niepoprawny": "Wróć do pkt 99: wąskie okno obecności mediów — otwarcie urny i wyjęcie kart.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt99", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział V, pkt 99", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-F-q04", "rola": "obserwator", "faza": "zamkniecie_lokalu", "cel_uczenia": "Rozpoznać nieprawidłowe zapieczętowanie urny.", "poziom_blooma": "ocena", "typ": "scenariusz", "kontekst": "Przewodniczący zakleja wlot urny paskiem papieru z pieczęcią, ale nikt z członków się na nim nie podpisuje. Komisja przechodzi do dalszych czynności.", "pytanie": "Jak to oceniasz?", "opcje": [{"tekst": "To odstępstwo do odnotowania — pasek papieru opatruje się pieczęcią komisji i podpisami jej członków.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Wszystko w porządku — wystarczy pieczęć komisji.", "poprawna": false, "uzasadnienie_dystraktora": "pkt 101 wymaga pieczęci i podpisów członków na pasku zaklejającym wlot"}, {"tekst": "To problem tylko wtedy, gdy urna zostanie otwarta przed czasem.", "poprawna": false, "uzasadnienie_dystraktora": "wymóg formy zabezpieczenia obowiązuje niezależnie od dalszych zdarzeń — braki odnotowuje się od razu"}], "feedback_poprawny": "Tak. Pasek zaklejający wlot opatruje się pieczęcią komisji i podpisami członków; przy plombie-nalepce numer trafia do protokołu wewnętrznego (pkt 101).", "feedback_niepoprawny": "Sprawdź pkt 101: pieczęć + podpisy — brak któregokolwiek elementu to odstępstwo.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt101", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział V, pkt 101", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-F-q05", "rola": "obserwator", "faza": "zamkniecie_lokalu", "cel_uczenia": "Znać wyłączenia uprawnień obserwatorki względem męża zaufania.", "poziom_blooma": "zapamietywanie", "typ": "wielokrotny_wybor", "kontekst": "Po podpisaniu protokołów zastanawiasz się nad swoimi uprawnieniami.", "pytanie": "Czego obserwatorka społeczna NIE może — w odróżnieniu od męża zaufania?", "opcje": [{"tekst": "Wnosić uwag do protokołów głosowania, rejestrować prac komisji ani być obecna przy przewożeniu i przekazywaniu protokołów.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Być obecna przy pieczętowaniu urny.", "poprawna": false, "uzasadnienie_dystraktora": "obecność przy czynnościach komisji przysługuje obserwatorce tak jak mężowi zaufania (pkt 20)"}, {"tekst": "Notować własnych spostrzeżeń w trakcie obserwacji.", "poprawna": false, "uzasadnienie_dystraktora": "własne notatki obserwatorki nie są objęte żadnym z wyłączeń z pkt 20"}], "feedback_poprawny": "Tak. Trzy wyłączenia z pkt 20: rejestrowanie prac komisji, uwagi do protokołów głosowania, obecność przy przewożeniu i przekazywaniu protokołów.", "feedback_niepoprawny": "Wróć do pkt 20 — katalog trzech wyłączeń odróżnia obserwatorkę od męża zaufania.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt20", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział I, pkt 20", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}], "G": [{"id": "obs-G-q01", "rola": "obserwator", "faza": "rozliczenie_kart", "cel_uczenia": "Znać prawo obecności obserwatorki przy rozliczaniu kart.", "poziom_blooma": "zapamietywanie", "typ": "prawda_falsz", "kontekst": "Komisja rozlicza karty przed otwarciem urny.", "pytanie": "Obserwatorka może być obecna przy rozliczaniu kart do głosowania.", "opcje": [{"tekst": "Prawda", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Fałsz", "poprawna": false, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Tak — po zamknięciu lokalu obserwatorzy społeczni mogą przebywać w lokalu i obserwować wszystkie czynności komisji (pkt 99).", "feedback_niepoprawny": "Sprawdź pkt 99: obecność obserwatorki obejmuje czynności rozliczeniowe.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt99", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział V, pkt 99", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-G-q02", "rola": "obserwator", "faza": "rozliczenie_kart", "cel_uczenia": "Znać wymóg wpisu „brak uwag” przy zgodnym rozliczeniu.", "poziom_blooma": "zapamietywanie", "typ": "wielokrotny_wybor", "kontekst": "Rozliczenie kart wyszło co do sztuki.", "pytanie": "Co komisja wpisuje w punkcie 16 protokołów Sejmu i Senatu (25 w referendum), gdy nie ma uwag?", "opcje": [{"tekst": "Wyrazy „brak uwag”.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Nic — puste pole oznacza brak uwag.", "poprawna": false, "uzasadnienie_dystraktora": "pole nie może zostać puste: przy braku niezgodności wpisuje się „brak uwag” (pkt 111 ppkt 5)"}, {"tekst": "Poziomą kreskę.", "poprawna": false, "uzasadnienie_dystraktora": "wytyczne wskazują konkretne brzmienie: „brak uwag” (pkt 111 ppkt 5)"}], "feedback_poprawny": "Tak. Gdy niezgodność nie występuje, w punkcie przeznaczonym na uwagi wpisuje się „brak uwag” (pkt 111 ppkt 5).", "feedback_niepoprawny": "Wróć do pkt 111 ppkt 5: pole uwag zawsze wypełnione — choćby słowami „brak uwag”.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt111", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 111 ppkt 5", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-G-q03", "rola": "obserwator", "faza": "rozliczenie_kart", "cel_uczenia": "Rozpoznać niedopuszczalny podział komisji na grupy robocze.", "poziom_blooma": "ocena", "typ": "scenariusz", "kontekst": "Dla przyspieszenia komisja dzieli się: trzy osoby liczą podpisy w spisie przy jednym stole, trzy inne — karty niewykorzystane przy drugim.", "pytanie": "Jak to oceniasz?", "opcje": [{"tekst": "To niedopuszczalne — komisja nie może tworzyć grup roboczych wykonujących czynności oddzielnie; wszystko robi wspólnie.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "To dopuszczalna organizacja pracy, skoro wszyscy są w jednym lokalu.", "poprawna": false, "uzasadnienie_dystraktora": "wspólny lokal nie wystarczy — zakaz dotyczy oddzielnego wykonywania czynności przez grupy członków (pkt 105)"}, {"tekst": "To dopuszczalne za zgodą przewodniczącego.", "poprawna": false, "uzasadnienie_dystraktora": "przewodniczący nie może uchylić zakazu z pkt 105"}], "feedback_poprawny": "Tak. Niedopuszczalne jest tworzenie grup roboczych wykonujących oddzielnie czynności po zakończeniu głosowania (pkt 105); czynności wykonuje się wspólnie, w składzie co najmniej 2/3 (pkt 104).", "feedback_niepoprawny": "Sprawdź pkt 105: dwa stoliki liczące równolegle to podręcznikowa nieprawidłowość.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt105", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 105", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-G-q04", "rola": "obserwator", "faza": "rozliczenie_kart", "cel_uczenia": "Znać relację punktu 4 do punktu 2 protokołu.", "poziom_blooma": "rozumienie", "typ": "prawda_falsz", "kontekst": "W projekcie protokołu liczba wydanych kart wyszła większa niż liczba uprawnionych.", "pytanie": "Liczba wyborców, którym wydano karty (punkt 4), może być większa od liczby uprawnionych do głosowania (punkt 2).", "opcje": [{"tekst": "Prawda", "poprawna": false, "uzasadnienie_dystraktora": "liczby wydanych kart nie mogą przekroczyć liczby uprawnionych (pkt 111 ppkt 4) — taki wynik oznacza błąd wymagający przeliczenia"}, {"tekst": "Fałsz", "poprawna": true, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Tak — punkt 4 nie może przewyższać punktu 2; przekroczenie sygnalizuje błąd w podpisach lub adnotacjach (pkt 111 ppkt 4).", "feedback_niepoprawny": "Sprawdź pkt 111 ppkt 4: wydane ≤ uprawnieni, zawsze.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt111", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 111 ppkt 4", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-G-q05", "rola": "obserwator", "faza": "rozliczenie_kart", "cel_uczenia": "Wiedzieć, jak komisja weryfikuje liczbę głosujących przez pełnomocnika.", "poziom_blooma": "rozumienie", "typ": "wielokrotny_wybor", "kontekst": "Obserwujesz wypełnianie punktu 7 protokołów.", "pytanie": "Jak komisja weryfikuje ustaloną liczbę głosujących przez pełnomocnika?", "opcje": [{"tekst": "Porównuje ją z liczbą otrzymanych aktów pełnomocnictwa, pomijając akty cofnięte i wygasłe; rozbieżność wymusza ponowne przeliczenie.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Przyjmuje liczbę podpisów bez dodatkowej weryfikacji.", "poprawna": false, "uzasadnienie_dystraktora": "wytyczne nakazują porównanie z aktami pełnomocnictwa (pkt 111 ppkt 8)"}, {"tekst": "Prosi obserwatorów o potwierdzenie liczby.", "poprawna": false, "uzasadnienie_dystraktora": "obserwatorzy nie uczestniczą w czynnościach komisji — weryfikacja opiera się na dokumentach (pkt 111 ppkt 8)"}], "feedback_poprawny": "Tak. Liczba z adnotacji w spisie powinna równać się liczbie aktów pełnomocnictwa (bez cofniętych i wygasłych); różnica = ponowne przeliczenie (pkt 111 ppkt 8).", "feedback_niepoprawny": "Wróć do pkt 111 ppkt 8: adnotacje kontra akty — obserwatorka patrzy, czy komisja rzeczywiście porównuje.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt111", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 111 ppkt 8", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}], "H": SRC_QUIZ_OBS } };

  if(mat==="quiz")  return (QUIZY[rola] && QUIZY[rola][etap]) ? QUIZY[rola][etap] : null;

}

function dostepnoscEtapu(k){
  const l = LISTY[k] ? "lista \u2713 ("+LISTY[k].items.length+")" : "lista \u2014";
  const q = (state.rola && QUIZY[state.rola] && QUIZY[state.rola][k]) ? "quiz \u2713 ("+QUIZY[state.rola][k].length+")" : "quiz \u2014";
  return l+" \u00b7 "+q;
}
function etapEnabled(k){ return Object.keys(MAT).some(m=>inScope(state.rola,k,m)); }
function matEnabled(m){ return state.etap ? inScope(state.rola,state.etap,m) : ETAPY.some(e=>inScope(state.rola,e.k,m)); }
function etapOf(k){ return ETAPY.find(e=>e.k===k); }
function etapLabel(k){ const e=etapOf(k); return e? e.k+") "+e.t : k; }

/* ================= STAN (tylko w pamięci sesji) ================= */
const state = {
  screen:"start", ekspert:"", rola:null, etap:null, material:null,
  session:null, genPhase:0, fallbackLogged:false,
  bank:[], backlog:[], pubCount:{}, rFilter:"all",
  bankRola:"all", bankStatus:"all"
};

/* ================= NARZĘDZIA ================= */
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function today(){ return new Date().toISOString().slice(0,10); }
function descHtml(s){
  const lines=String(s).split("\n"); let out="", ul=false;
  lines.forEach(l=>{
    const t=l.trim();
    if(t.startsWith("- ")){ if(!ul){out+='<ul class="desc-ul">';ul=true;} out+="<li>"+esc(t.slice(2))+"</li>"; }
    else { if(ul){out+="</ul>";ul=false;} if(t) out+="<p>"+esc(t)+"</p>"; }
  });
  if(ul) out+="</ul>";
  return out;
}
let tt;
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show");
  clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),2100); }

/* ================= NAWIGACJA ================= */
function go(s){ state.screen=s; window.scrollTo({top:0}); render(); }
function setEkspert(v){ state.ekspert=v; const b=document.getElementById("startbtn"); if(b) b.disabled=!v; }
function startFlow(){ if(!state.ekspert){toast("Wybierz osobę ewaluującą materiały");return;} go("odbiorca"); }
function goOdbiorca(){ go("odbiorca"); }
function setRola(r){
  if(state.rola!==r){ state.etap=null; state.material=null; state.session=null; state.genPhase=0; }
  state.rola=r; state.fallbackLogged=false; go("etap");
}
function setEtap(k){ if(!etapEnabled(k)){ toast("Brak zatwierdzonej treści dla tego etapu — element nieaktywny"); return; }
  state.etap=k;
  if(state.material && !inScope(state.rola,k,state.material)) state.material=null;
  state.session=null; state.genPhase=0; state.fallbackLogged=false; render(); }
function setMat(m){ if(!matEnabled(m)){ toast("Brak zatwierdzonej treści tego typu dla wybranego etapu"); return; }
  state.material=m; state.session=null; state.genPhase=0; state.fallbackLogged=false; render(); }
function nextFromEtap(){
  if(!state.etap){toast("Wybierz etap dnia głosowania");return;}
  if(!state.material){toast("Wybierz typ materiału");return;}
  if(inScope(state.rola,state.etap,state.material)){ state.genPhase=0; go("generacja"); }
  else { go("fallback"); }
}
function startGen(){
  state.genPhase=1; render();
  setTimeout(()=>{ state.genPhase=2; buildSession(); render(); }, 1400);
}
function buildSession(){
  const items = contentFor(state.rola, state.etap, state.material);
  if(!items){ state.session=null; go("fallback"); return; }
  const dec={}; items.forEach(it=>dec[it.id]={decyzja:null,uwagi:"",data:""});
  state.session={rola:state.rola,etap:state.etap,material:state.material,items:items,decisions:dec};
  state.rFilter="all";
}
function addBacklog(){
  state.backlog.push({rola:state.rola,etap:state.etap,material:state.material,data:today(),zglosil:state.ekspert,status:"do decyzji ownera"});
  state.fallbackLogged=true; toast("Zgłoszono do backlogu — decyzja o zakresie należy do ownera FOP"); render();
}

/* ================= RECENZJA: settery ================= */
function sess(){ return state.session; }
function setDecision(id,dec){ const d=sess().decisions[id];
  d.decyzja=(d.decyzja===dec)?null:dec; d.data=d.decyzja?today():""; render(); }
function setUwagi(id,v){ sess().decisions[id].uwagi=v;
  const w=document.getElementById("note-"+id); if(w && v.trim()) w.classList.remove("missing"); }
function pdotGo(id){ state.rFilter="all"; render(); const el=document.getElementById("card-"+id); if(el) el.scrollIntoView({behavior:"smooth",block:"center"}); }
function setFilter(f){ state.rFilter=(state.rFilter===f?"all":f); render(); }
function counts(){ const c={TAK:0,POPRAW:0,USUN:0,none:0}; if(!sess())return c;
  sess().items.forEach(it=>{const d=sess().decisions[it.id]; if(d.decyzja)c[d.decyzja]++; else c.none++;}); return c; }

/* ================= PUBLIKACJA ================= */
function bankTags(s,it){
  const t=[ROLE[s.rola], etapLabel(s.etap), MAT[s.material]];
  if(it.typ && TYP[it.typ]) t.push(TYP[it.typ]);
  if(it.poziom_blooma) t.push("Bloom: "+it.poziom_blooma);
  if(it.faza) t.push("faza: "+String(it.faza).replace(/_/g," "));
  return t;
}
function publish(){
  const s=sess(); if(!s) return;
  let bad=null;
  s.items.forEach(it=>{ const d=s.decisions[it.id];
    if(!d.decyzja){ bad=bad||{id:it.id,why:"dec"}; }
    else if((d.decyzja==="POPRAW"||d.decyzja==="USUN") && !(d.uwagi||"").trim()){ bad=bad||{id:it.id,why:"uw"}; }
  });
  if(bad){
    if(bad.why==="uw"){ const w=document.getElementById("note-"+bad.id); if(w) w.classList.add("missing"); }
    toast(bad.why==="dec" ? "Oceń wszystkie pozycje — bramka wymaga decyzji dla każdej" : "Decyzje POPRAW i USUŃ wymagają uzasadnienia");
    const el=document.getElementById("card-"+bad.id); if(el) el.scrollIntoView({behavior:"smooth",block:"center"});
    return;
  }
  const key=s.rola+"|"+s.etap+"|"+s.material;
  const n=(state.pubCount[key]||0); state.pubCount[key]=n+1;
  const wersja="v1."+n; const dt=today();
  state.bank.forEach(b=>{ if(b.rola===s.rola && b.etap===s.etap && b.typ===s.material && b.status!=="archiwalne") b.status="archiwalne"; });
  const stat={TAK:"opublikowane",POPRAW:"do_poprawek",USUN:"wykluczone"};
  const c={TAK:0,POPRAW:0,USUN:0};
  s.items.forEach(it=>{ const d=s.decisions[it.id]; c[d.decyzja]++;
    state.bank.push({uid:key+"|"+wersja+"|"+it.id, id:it.id, rola:s.rola, etap:s.etap, typ:s.material,
      status:stat[d.decyzja], wersja:wersja, data:dt, owner:state.ekspert, uwagi:(d.uwagi||"").trim()||null, tagi:bankTags(s,it), payload:it});
  });
  const pubRecs = state.bank.filter(b=> b.rola===s.rola && b.etap===s.etap && b.typ===s.material && b.wersja===wersja && b.status==="opublikowane");
  const fixRecs = state.bank.filter(b=> b.rola===s.rola && b.etap===s.etap && b.typ===s.material && b.wersja===wersja && b.status==="do_poprawek");
  const delRecs = state.bank.filter(b=> b.rola===s.rola && b.etap===s.etap && b.typ===s.material && b.wersja===wersja && b.status==="wykluczone");
  state.lastPub={c:c,wersja:wersja,dt:dt,rola:s.rola,etap:s.etap,typ:s.material,razem:s.items.length,records:pubRecs,fixes:fixRecs,dels:delRecs};
  state.session=null; state.genPhase=0;
  openPub();
  savePubFiles();
}

  const p=state.lastPub;
  document.getElementById("pubbody").innerHTML =
    '<p class="pub-big">Doszło do zmiany materiałów szkoleniowych.</p>'+

        +(p.dels && p.dels.length? '<br>Pozycje do usunięcia ('+p.dels.length+') z uzasadnieniami zapisano w osobnym arkuszu CSV:<br><span style="font-family:\'Space Mono\',monospace;font-size:11.5px">'+esc(delFileBase())+'.csv</span>':'')

        +(p.fixes && p.fixes.length? ' Pozycje do poprawy ('+p.fixes.length+') z notatkami eksperta zapisano w osobnym arkuszu CSV (do ponownej poprawy w AI).':'')+'</p>');

/* ================= ZAPIS PLIKÓW PO AKCEPTACJI (CSV zaakceptowane + CSV do poprawy + HTML baza banku) ================= */
function fnSafe(s){ return String(s==null?"":s).replace(/[\\\/:*?"<>|]/g,"-").replace(/\s+/g," ").trim(); }
function pubFileBase(){
  const p=state.lastPub; if(!p) return "bank-materialow";
  return [ fnSafe(state.ekspert||"ekspert"), "Bank Materiałów", "zatwierdzone", fnSafe(etapLabel(p.etap)), fnSafe(ROLE[p.rola]), p.dt ].join("_");
}
function fixFileBase(){
  const p=state.lastPub; if(!p) return "do-poprawy";
  return [ fnSafe(state.ekspert||"ekspert"), "Bank Materiałów", "do poprawy", fnSafe(etapLabel(p.etap)), fnSafe(ROLE[p.rola]), p.dt ].join("_");
}
function delFileBase(){
  const p=state.lastPub; if(!p) return "do-usuniecia";
  return [ fnSafe(state.ekspert||"ekspert"), "Bank Materiałów", "do usunięcia", fnSafe(etapLabel(p.etap)), fnSafe(ROLE[p.rola]), p.dt ].join("_");
}
function bankFileBase(){
  return [ fnSafe(state.ekspert||"ekspert"), "Bank Materiałów", "baza zaakceptowanych", today() ].join("_");
}
function csvCell(v){ v=(v==null?"":String(v)); return '"'+v.replace(/"/g,'""')+'"'; }
function pubOptTxt(it){
  if(!it.opcje) return {opcje:"",poprawna:""};
  const all=it.opcje.map(o=>(o.poprawna?"[POPRAWNA] ":"")+o.tekst).join(" | ");
  const ok=it.opcje.filter(o=>o.poprawna).map(o=>o.tekst).join(" | ");
  return {opcje:all,poprawna:ok};
}
function buildPubCSV(){
  const p=state.lastPub; if(!p||!p.records) return "";
  const head=["lp","id","typ_materialu","odbiorca","etap","tytul_lub_pytanie","tresc_lub_kontekst","opcje","odpowiedz_poprawna","zrodlo_prawa","wersja","data_utworzenia","recenzent","status"];
  const rows=[head.map(csvCell).join(",")];
  p.records.forEach((b,i)=>{
    const it=b.payload||{};
    const isQuiz=(b.typ==="quiz");
    const o=pubOptTxt(it);
    const zrodlo=isQuiz ? (it.zrodlo? (it.zrodlo.akt+" · "+it.zrodlo.jednostka+" · stan prawny "+it.zrodlo.stan_prawny) : "") : (it.prawo||"");
    rows.push([ i+1, b.id, MAT[b.typ]||b.typ, ROLE[b.rola]||b.rola, etapLabel(b.etap),
      isQuiz? (it.pytanie||"") : (it.nazwa||""),
      isQuiz? (it.kontekst||"") : (it.opis||""),
      o.opcje, o.poprawna, zrodlo, b.wersja, b.data, b.owner, b.status
    ].map(csvCell).join(","));
  });
  return "\uFEFF"+rows.join("\r\n");
}
function buildFixCSV(){
  const p=state.lastPub; if(!p||!p.fixes) return "";
  const head=["lp","id","typ_materialu","odbiorca","etap","tytul_lub_pytanie","notatka_eksperta","tresc_oryginalna_json","polecenie_dla_AI","wersja","data_recenzji","recenzent","status"];
  const rows=[head.map(csvCell).join(",")];
  p.fixes.forEach((b,i)=>{
    const it=b.payload||{};
    const isQuiz=(b.typ==="quiz");
    const cmd="Popraw materiał "+b.id+" zgodnie z notatką eksperta z kolumny notatka_eksperta. Pracuj wyłącznie na treści z kolumny tresc_oryginalna_json: zachowaj strukturę JSON, rolę, poziom Blooma i cytowane źródło prawa (pkt wytycznych zmieniaj tylko, jeśli notatka tego wymaga). Nie dodawaj nowych faktów prawnych bez oparcia w źródle — braki oznacz [DO UZUPEŁNIENIA]. Zwróć pełny poprawiony JSON do ponownej recenzji eksperta.";
    rows.push([ i+1, b.id, MAT[b.typ]||b.typ, ROLE[b.rola]||b.rola, etapLabel(b.etap),
      isQuiz? (it.pytanie||"") : (it.nazwa||""),
      b.uwagi||"", JSON.stringify(it), cmd, b.wersja, b.data, b.owner, b.status
    ].map(csvCell).join(","));
  });
  return "\uFEFF"+rows.join("\r\n");
}
function buildDelCSV(){
  const p=state.lastPub; if(!p||!p.dels) return "";
  const head=["lp","id","typ_materialu","odbiorca","etap","tytul_lub_pytanie","uzasadnienie_usuniecia","tresc_oryginalna_json","wersja","data_recenzji","recenzent","status"];
  const rows=[head.map(csvCell).join(",")];
  p.dels.forEach((b,i)=>{
    const it=b.payload||{};
    const isQuiz=(b.typ==="quiz");
    rows.push([ i+1, b.id, MAT[b.typ]||b.typ, ROLE[b.rola]||b.rola, etapLabel(b.etap),
      isQuiz? (it.pytanie||"") : (it.nazwa||""),
      b.uwagi||"", JSON.stringify(it), b.wersja, b.data, b.owner, b.status
    ].map(csvCell).join(","));
  });
  return "\uFEFF"+rows.join("\r\n");
}
function bankAccepted(){ return state.bank.filter(b=>b.status==="opublikowane"); }

  const acc=bankAccepted();
  let sections="";
  ETAPY.forEach(e=>{
    ["komisja","obserwator"].forEach(r=>{
      const items=acc.filter(b=>b.etap===e.k && b.rola===r);
      if(!items.length) return;
      const cards=items.map((b,i)=>{

          body += it.kontekst? '<p class="ctx">'+esc(it.kontekst)+'</p>' : "";

          if(it.feedback_poprawny) body += '<p class="fb"><b>Feedback:</b> '+esc(it.feedback_poprawny)+'</p>';
          if(it.zrodlo) body += '<p class="src">'+esc(it.zrodlo.akt+" · "+it.zrodlo.jednostka+" · stan prawny "+it.zrodlo.stan_prawny)+'</p>';
        }else{
          body += '<p class="q">'+esc(it.nazwa||"")+'</p>';
          body += '<p class="ctx">'+esc(it.opis||"").replace(/\n/g,"<br>")+'</p>';

        }
        return '<article class="card"><div class="cid">'+(i+1)+' · '+esc(b.id)+(it.typ? ' · '+esc(TYP[it.typ]||it.typ):'')+' · '+esc(MAT[b.typ])+' · wersja '+esc(b.wersja)+' · obowiązuje od '+esc(b.data)+' · owner: '+esc(b.owner)+'</div>'+body+'</article>';

  '<title>'+esc(bankFileBase())+'</title><style>'+
  'body{font-family:"Libre Franklin",system-ui,sans-serif;color:#0E1B2E;background:#F4F7FC;margin:0;padding:32px}'+
  '.hd{background:linear-gradient(135deg,#3061AD,#143055);color:#fff;border-radius:14px;padding:24px 28px;margin-bottom:24px}'+
  '.hd h1{margin:0 0 6px;font-size:22px}.hd p{margin:2px 0;font-size:13.5px;opacity:.92}'+
  '.sec{font-size:16px;color:#143055;margin:26px 0 10px;border-bottom:2px solid #D7E2F2;padding-bottom:6px}.cnt{font-weight:400;color:#59697F;font-size:13px}'+
  '.card{background:#fff;border:1px solid #D7E2F2;border-radius:12px;padding:16px 20px;margin-bottom:14px}'+
  '.cid{font-family:"Space Mono",monospace;font-size:11.5px;color:#59697F;margin-bottom:8px}'+
  '.q{font-weight:700;margin:0 0 8px}.ctx{color:#3a4a63;font-size:14px;margin:0 0 8px}'+
  'ul{margin:0 0 8px;padding-left:20px}li{margin:3px 0;font-size:14px}li.ok{color:#1c6b3c;font-weight:700}'+
  '.fb{font-size:13px;color:#3a4a63;margin:0 0 6px}.src{font-family:"Space Mono",monospace;font-size:11.5px;color:#59697F;margin:0}'+
  '</style></head><body>'+
  '<div class="hd"><h1>Bank materiałów — baza zaakceptowanych pytań i zadań</h1>'+
  '<p>pozycji zaakceptowanych łącznie: <b>'+acc.length+'</b> · wygenerowano: <b>'+today()+'</b> · zapis wykonał recenzent: <b>'+esc(state.ekspert||"")+'</b></p>'+
  '<p>Wyłącznie materiały z decyzją TAK z recenzji FOP (bramka ludzka), posegregowane po etapach i odbiorcach. Wygenerowano z prototypu silnika treści mikrolearningu.</p></div>'+
  sections+'</body></html>';
}
function triggerDownload(content,mime,fname){
  const blob=new Blob([content],{type:mime});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=fname;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function downloadPub(kind){
  const p=state.lastPub;
  if(kind==="csv"){
    if(!p||!p.records||!p.records.length){ toast("Brak zaakceptowanych pozycji w tej publikacji"); return; }
    triggerDownload(buildPubCSV(),"text/csv;charset=utf-8",pubFileBase()+".csv");
  } else if(kind==="fix"){
    if(!p||!p.fixes||!p.fixes.length){ toast("Ta publikacja nie ma pozycji do poprawy"); return; }
    triggerDownload(buildFixCSV(),"text/csv;charset=utf-8",fixFileBase()+".csv");
  } else if(kind==="del"){
    if(!p||!p.dels||!p.dels.length){ toast("Ta publikacja nie ma pozycji do usunięcia"); return; }
    triggerDownload(buildDelCSV(),"text/csv;charset=utf-8",delFileBase()+".csv");
  } else if(kind==="bank"){
    if(!bankAccepted().length){ toast("Bank nie zawiera jeszcze zaakceptowanych pozycji"); return; }
    triggerDownload(buildBankHTML(),"text/html;charset=utf-8",bankFileBase()+".html");
  }
}
function savePubFiles(){
  const p=state.lastPub; if(!p) return;
  const parts=[];
  if(p.records && p.records.length){ downloadPub("csv"); parts.push("CSV zaakceptowane"); }
  if(p.fixes && p.fixes.length){ setTimeout(()=>downloadPub("fix"),700); parts.push("CSV do poprawy"); }
  if(p.dels && p.dels.length){ setTimeout(()=>downloadPub("del"),1050); parts.push("CSV do usunięcia"); }
  if(bankAccepted().length){ setTimeout(()=>downloadPub("bank"),1400); parts.push("HTML baza banku"); }
  if(parts.length) toast("Zapisano: "+parts.join(" + "));
}


/* ================= TRYB TESTOWY (treść źródłowa + status recenzji) ================= */
function pokrycie(){
  let done=0,total=0;
  ["komisja","obserwator"].forEach(r=>ETAPY.forEach(e=>Object.keys(MAT).forEach(m=>{
    total++;
    if(state.bank.some(b=>b.rola===r&&b.etap===e.k&&b.typ===m&&b.status==="opublikowane")) done++;
  })));
  return {done:done,total:total};
}
function statusPozycji(rola,etap,mat,id){
  let rec=null;
  state.bank.forEach(b=>{ if(b.rola===rola&&b.etap===etap&&b.typ===mat&&b.id===id&&b.status!=="archiwalne") rec=b; });
  return rec;
}
function statusChip(rec){
  if(!rec) return '<span class="schip niezatw">niezatwierdzone — przed recenzją FOP</span>';
  const lab={opublikowane:"zatwierdzone przez FOP",do_poprawek:"do poprawek",wykluczone:"wykluczone przez recenzenta"}[rec.status]||SLAB[rec.status];
  return '<span class="schip '+rec.status+'">'+lab+' · '+esc(rec.wersja)+'</span>';
}
function zatwCount(s){
  let k=0;
  s.items.forEach(it=>{ const r=statusPozycji(s.rola,s.etap,s.typ,it.id); if(r&&r.status==="opublikowane") k++; });
  return k;
}
function zrodloTxt(q){
  if(!q) return "";
  if(q.zrodlo && q.zrodlo.akt) return q.zrodlo.akt+" — "+q.zrodlo.jednostka+" (stan "+q.zrodlo.stan_prawny+")";
  if(q.prawo) return q.prawo;
  return "";
}
function testowySet(rola,etap,mat){
  const items=contentFor(rola,etap,mat);
  return items ? {rola:rola,etap:etap,typ:mat,items:items} : null;
}
function testOpen(){

  go("test");
}
function testFromBank(r,e,m){

function testRola(r){ const t=state.test; t.rola=r; t.etap=null; t.typ=null; t.set=null; render(); }
function testSel(e,m){
  const t=state.test;
  const s=testowySet(t.rola,e,m);

function testStartRun(){ const t=state.test; t.phase="run"; t.idx=0; t.answers={}; t.pick=null; t.checked=false; t.done={}; render(); }
function testPick(i){ if(state.test.checked) return; state.test.pick=i; render(); }
function testCheck(){
  const t=state.test;
  if(t.pick==null){ toast("Wybierz odpowiedź"); return; }
  const q=t.set.items[t.idx];
  const ok=!!(q.opcje && q.opcje[t.pick] && q.opcje[t.pick].poprawna);
  t.answers[q.id]={pick:t.pick, ok:ok};

}
function testNext(){
  const t=state.test;

}
function testToggle(id){ const t=state.test; t.done[id]=!t.done[id]; render(); }
function testFinishLista(){ state.test.phase="wynik"; render(); }
function testRetryWrong(){
  const t=state.test;
  const wrong=t.set.items.filter(q=>t.answers[q.id] && !t.answers[q.id].ok);
  if(!wrong.length){ toast("Brak błędnych odpowiedzi do powtórki"); return; }
  t.set={rola:t.set.rola,etap:t.set.etap,typ:t.set.typ,items:wrong};

function testZglos(qid){

    zglosil:(state.ekspert||"uczestnik testu"),status:"zgłoszenie z testu — do decyzji ownera",
    uwaga:"dotyczy pozycji "+qid+" ("+st+")"});

}
function segBar(t){
  const items=t.set.items; let segs="";
  for(let i=0;i<items.length;i++){
    const a=t.answers[items[i].id];
    let cls=a? (a.ok?" ok":" bad") : "";
    if(t.phase==="run" && i===t.idx) cls+=" cur";
    segs+='<i class="seg'+cls+'"></i>';
  }
  return '<div class="segbar" role="progressbar" aria-valuemin="0" aria-valuemax="'+items.length+'" aria-valuenow="'+Object.keys(t.answers).length+'">'+segs+'</div>';

    '<div class="tst-box">'+
    '<div class="b-meta" style="margin:0 0 10px">'+s.items.length+' pozycji · zatwierdzonych przez FOP: <b>'+k+' / '+s.items.length+'</b>'+(struktura?' · '+esc(struktura):'')+'</div>'+
    '<div class="b-meta" style="margin:0 0 14px">źródła prawa: Wytyczne PKW 211/2023 (stan 2023-09-25) · Kodeks wyborczy (stan 2023-03-31)</div>'+

}

    (q.kontekst?'<div class="tst-ctx"><b>Sytuacja:</b> '+esc(q.kontekst)+'</div>':'')+

  const cards=t.set.items.map(it=>{

function rTestWynik(t){

  const byCel={};

    : '<div class="fbp ok"><b>Wszystkie cele uczenia zaliczone bez błędów.</b></div>';
  const wrongList=wrong.length
    ? '<div class="tst-box"><h3 style="margin:0 0 10px;font-size:15px">Pytania do powtórzenia</h3>'+
      wrong.map(q=>'<div class="b-item"><div class="b-row"><span class="id">'+esc(q.id)+'</span><span class="tag">'+esc(TYP[q.typ]||q.typ)+'</span>'+statusChip(statusPozycji(t.rola,t.etap,t.typ,q.id))+'</div>'+
        '<div class="b-title">'+esc(q.pytanie)+'</div>'+
        '<div class="b-meta">'+esc(zrodloTxt(q))+'</div></div>').join("")+'</div>'
    : "";
  return '<p class="screen-eyebrow">Tryb testowy · wynik testu</p>'+
    '<h2 class="screen-title">Wynik: '+okN+' / '+items.length+' poprawnych</h2>'+
    segBar(t)+
    '<p class="screen-sub">'+esc(etapLabel(t.etap))+' · '+esc(ROLE[t.rola])+' · '+esc(MAT[t.typ])+'</p>'+
    cele+wrongList+
    '<div class="next-row">'+
    (wrong.length?'<button class="btn btn-primary" onclick="testRetryWrong()">Powtórz błędne ('+wrong.length+')</button>':'')+
    '<button class="btn" onclick="testOpen()">Inny zestaw</button>'+
    '<button class="btn" onclick="go(\'bank\')">Wróć do banku</button></div>';
}
function rTest(){
  let t=state.test;
  if(!t){ t=state.test={phase:"wybor", rola:state.rola||null, etap:null, typ:null, set:null, idx:0, answers:{}, pick:null, checked:false, done:{}}; }
  if(t.phase==="wybor") return rTestWybor(t);
  if(t.phase==="karta") return rTestKarta(t);
  if(t.phase==="run") return t.typ==="quiz" ? rTestRunQuiz(t) : rTestRunLista(t);
  return rTestWynik(t);
}

/* ================= RENDER: nagłówek ================= */
const STEPS=[
 {id:"start", lab:"Ekspert"},
 {id:"odbiorca", lab:"Odbiorca"},
 {id:"etap", lab:"Etap i materiał"},
 {id:"gen", lab:"Propozycja i recenzja"},
 {id:"bank", lab:"Bank"},
 {id:"test", lab:"Test"}
];
function stepIdx(){ const s=state.screen;
  if(s==="start")return 0; if(s==="odbiorca")return 1; if(s==="etap")return 2;
  if(s==="generacja"||s==="fallback"||s==="recenzja")return 3;
  if(s==="test")return 5; return 4; }
function stepGo(i){
  if(i===0) go("start");
  else if(i===1) goOdbiorca();
  else if(i===2){ if(state.rola) go("etap"); }
  else if(i===3){ if(state.session) go("recenzja"); else if(state.rola&&state.etap&&state.material) nextFromEtap(); }
  else if(i===4) go("bank");
  else if(i===5) testOpen();
}
function renderTopbar(){
  const tb=document.getElementById("topbar");
  tb.hidden = (state.screen==="start");
  document.getElementById("btnRole").hidden = (state.screen==="odbiorca");
  document.getElementById("who").textContent =
    (state.ekspert? "recenzent: "+state.ekspert : "") + (state.rola? " · odbiorca: "+ROLE[state.rola] : "");
  const cur=stepIdx();
  document.getElementById("stepper").innerHTML = STEPS.map((st,i)=>{
    const cls = i===cur? "cur" : (i<cur? "done":"");
    const clickable = (i===0) || (i===1) || (i===2&&state.rola) || (i===3&&(state.session||(state.rola&&state.etap&&state.material))) || (i===4) || (i===5);
    return '<li class="step '+cls+'"><button '+(clickable&&i!==cur?'':'disabled ')+'onclick="stepGo('+i+')"><span class="dot">'+(i+1)+'</span>'+st.lab+'</button></li>';
  }).join("");
  document.getElementById("actionbar").hidden = (state.screen!=="recenzja");
}

function rStart(){
  const opts=[1,2,3,4,5].map(n=>'<option'+(state.ekspert==="Ekspert "+n?' selected':'')+'>Ekspert '+n+'</option>').join("");

function dz(id){
  const d=sess().decisions[id];
  const b=(val,cls,lab,sub)=>'<button class="dbtn '+cls+(d.decyzja===val?' on':'')+'" onclick="setDecision(\''+id+'\',\''+val+'\')"><span>'+lab+'</span><small>'+sub+'</small></button>';
  let note="";
  if(d.decyzja==="POPRAW") note=noteBox(id,"Jakie poprawki i czego dotyczą?",true,d.uwagi);
  else if(d.decyzja==="USUN") note=noteBox(id,"Dlaczego pozycja się nie nadaje?",true,d.uwagi);
  else if(d.decyzja==="TAK") note=noteBox(id,"Notatka (opcjonalnie)",false,d.uwagi);
  const meta=d.decyzja? '<div class="meta-line">Decyzja: '+DLAB[d.decyzja]+' · owner: '+esc(state.ekspert)+' · '+esc(d.data)+'</div>':'';
  return '<div class="decision"><div class="decision-label">Decyzja recenzenta ('+esc(state.ekspert)+')</div><div class="dbtns">'+
    b("TAK","tak","TAK","może wejść do banku treści")+
    b("POPRAW","popraw","POPRAW","drobne poprawki")+
    b("USUN","usun","USUŃ","nie nadaje się")+
    '</div>'+note+meta+'</div>';
}
function noteBox(id,label,req,val){
  return '<div class="note" id="note-'+id+'"><label class="'+(req?'req':'')+'">'+label+'</label>'+
    '<textarea oninput="setUwagi(\''+id+'\',this.value)" placeholder="'+(req?'Wpisz treść — trafi do eksportu i do zespołu poprawek…':'Opcjonalna notatka do zatwierdzenia…')+'">'+esc(val)+'</textarea>'+
    '<div class="hint">Ta decyzja wymaga uzasadnienia przed publikacją.</div></div>';
}
function cardQuiz(p){
  const d=sess().decisions[p.id];

    return '<li class="opt'+(o.poprawna?' correct':'')+'"><span class="opt-mark">'+(o.poprawna?'&#10004;':'&#9675;')+'</span>'+esc(o.tekst)+why+'</li>';

    '<div class="card-head"><span class="id">'+esc(p.id)+'</span>'+
      '<span class="tag">'+esc(TYP[p.typ]||p.typ)+'</span>'+
      '<span class="tag bloom">Bloom: '+esc(p.poziom_blooma)+'</span>'+

    '<details class="fb"><summary>Feedback dla ucznia</summary>'+
      '<div class="fb-row"><b>Poprawnie</b>'+esc(p.feedback_poprawny)+'</div>'+
      '<div class="fb-row"><b>Błędnie</b>'+esc(p.feedback_niepoprawny)+'</div></details>'+
    src+dz(p.id)+'</div>';

    ? {tytul:qm.tytul, zrodlo:"Źródło prawa: <b>"+esc(qm.akt)+"</b><br>Stan prawny: <b>"+esc(qm.stan_prawny)+"</b> · Wybory: "+esc(qm.wybory)}
    : {tytul:LISTA.meta.tytul, zrodlo:"Źródło: <b>"+esc(LISTA.meta.zrodlo)+"</b><br>Otwarcie etapu: "+esc(LISTA.meta.otwarcie)};
  const chip=(f,lab,n,cls)=>'<button class="chip '+(cls||'')+'" aria-pressed="'+(state.rFilter===f)+'" onclick="setFilter(\''+f+'\')">'+lab+' <span class="n">'+n+'</span></button>';
  const chips='<div class="chips">'+
    chip("all","Wszystkie",s.items.length)+chip("none","Nieocenione",c.none)+

  return '<p class="screen-eyebrow">Krok 4 · Arkusz recenzji — kontrola jakości (bramka ludzka)</p>'+
    '<h2 class="screen-title">'+esc(meta.tytul)+'</h2>'+

    '<div class="progress">Ocenione: <b>'+done+' / '+s.items.length+'</b> &nbsp;·&nbsp; TAK '+c.TAK+' · POPRAW '+c.POPRAW+' · USUŃ '+c.USUN+'</div>'+

function rBank(){
  const pass=b=>(state.bankRola==="all"||b.rola===state.bankRola)&&(state.bankStatus==="all"||b.status===state.bankStatus);
  const chipR=(v,lab)=>'<button class="chip" aria-pressed="'+(state.bankRola===v)+'" onclick="setBankRola(\''+v+'\')">'+lab+'</button>';
  const chipS=(v,lab,cls)=>'<button class="chip '+(cls||'')+'" aria-pressed="'+(state.bankStatus===v)+'" onclick="setBankStatus(\''+v+'\')">'+lab+'</button>';
  const filters='<div class="chips">'+chipR("komisja","Członkowie komisji")+chipR("obserwator","Obserwatorzy")+
    '<span style="width:8px"></span>'+
    chipS("opublikowane","opublikowane","tak")+chipS("do_poprawek","do poprawek","popraw")+chipS("wykluczone","wykluczone","usun")+chipS("archiwalne","archiwalne")+'</div>';
  const secs=ETAPY.map(e=>{
    const items=state.bank.filter(b=>b.etap===e.k && pass(b));
    const blN=state.backlog.filter(x=>x.etap===e.k).length;
    let body="";
    if(items.length){
      ["komisja","obserwator"].forEach(r=>{
        const ri=items.filter(b=>b.rola===r);
        if(ri.length){
          body+='<div class="role-h">'+esc(ROLE[r])+'</div>'+ri.map(b=>
            '<div class="b-item"><div class="b-row"><span class="schip '+b.status+'">'+SLAB[b.status]+'</span>'+
            '<span class="id">'+esc(b.id)+'</span>'+((b.tagi&&b.tagi.length? b.tagi:[MAT[b.typ]]).map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join(''))+'</div>'+
            '<div class="b-title">'+esc(bTitle(b))+'</div>'+
            (b.uwagi?'<div class="b-uwagi">uwagi recenzenta: '+esc(b.uwagi)+'</div>':'')+
            '<div class="b-meta">wersja '+esc(b.wersja)+' · obowiązuje od '+esc(b.data)+' · owner: '+esc(b.owner)+'</div></div>').join("");
          Object.keys(MAT).forEach(mm=>{
            const pub=ri.filter(b=>b.typ===mm && b.status==="opublikowane");
            if(pub.length) body+='<div class="next-row" style="margin:4px 0 12px"><button class="btn" onclick="testFromBank(\''+r+'\',\''+e.k+'\',\''+mm+'\')">Przetestuj ten zestaw — '+esc(MAT[mm])+' ('+pub.length+' poz. opublikowanych)</button></div>';
          });
        }
      });
    } else {
      body='<div class="b-empty">— brak materiałów w banku'+(blN?' · w backlogu: '+blN+' zgłoszenie(a)':'')+' —</div>';
    }
    const total=state.bank.filter(b=>b.etap===e.k).length;
    return '<div class="bank-sec"><div class="bank-head"><span class="bk">'+e.k+')</span><h3>'+esc(e.t)+'</h3><span class="cn">'+total+' pozycji</span></div>'+
      '<div class="bank-body">'+body+'</div></div>';
  }).join("");
  const backlog=state.backlog.length?
    '<div class="backlog-sec"><h3>Backlog — zgłoszenia (do decyzji ownera FOP)</h3>'+
    state.backlog.map(x=>'<div class="b-item"><div class="b-row"><span class="schip do_poprawek">backlog</span>'+
      '<span class="tag">'+esc(etapLabel(x.etap))+'</span><span class="tag">'+esc(ROLE[x.rola])+'</span><span class="tag">'+esc(MAT[x.material])+'</span></div>'+
      (x.uwaga?'<div class="b-uwagi">'+esc(x.uwaga)+'</div>':'')+'<div class="b-meta">zgłoszono '+esc(x.data)+' · '+esc(x.zglosil)+' · status: '+esc(x.status)+'</div></div>').join("")+'</div>' : "";
  const cov=pokrycie();
  const covBar='<div class="cover"><div class="bar"><i style="width:'+Math.round(100*cov.done/cov.total)+'%"></i></div><small>pokrycie zakresu publikacjami: '+cov.done+' / '+cov.total+' kombinacji (rola × etap × typ)</small></div>';
  return '<p class="screen-eyebrow">Bank treści · jedna baza dla obu ról</p>'+
    '<h2 class="screen-title">Bank materiałów — posegregowany po etapach i odbiorcach</h2>'+
    '<p class="screen-sub">Bank uzupełnia się po zatwierdzeniu recenzji. Zakres pilotażu: '+zakresOpis()+'. Nowa publikacja tej samej ścieżki archiwizuje poprzednią wersję. Tryb testowy (krok „Test” lub przycisk u góry) obejmuje całą treść źródłową — pozycje zatwierdzone i niezatwierdzone, z widocznym statusem recenzji.</p>'+
    covBar+'<div class="next-row" style="margin:0 0 14px"><button class="btn" onclick="downloadPub(\'bank\')">Zapisz bazę zaakceptowanych pytań (HTML)</button></div>'+
    filters+secs+backlog;
}

/* ================= EKSPORT ================= */
function buildExport(){
  return {
    prototyp:"Materiały edukacyjne FOP — silnik generacji i aktualizacji treści mikrolearningu (prototyp klikalny)",
    data_eksportu: today(), recenzent: state.ekspert||null,
    zrodla_prawa:{wytyczne:"Uchwała PKW 211/2023 · stan 2023-09-25", kodeks:"Kodeks wyborczy · stan 2023-03-31", wybory:"Sejm/Senat/referendum 15.10.2023 (dane pilotażowe)"},
    regula_bramki:"AI proponuje wsad → recenzja FOP (obowiązkowa) → publikacja z wersją, datą obowiązywania i ownerem. Do banku trafiają wyłącznie pozycje TAK.",
    zakres_pilotazu: zakresOpis(),
    bank: state.bank.map(b=>({id:b.id,rola:b.rola,etap:b.etap,typ:b.typ,tagi:b.tagi||[],status:b.status,wersja:b.wersja,
      data_obowiazywania:b.data,owner:b.owner,uwagi:b.uwagi,tytul:bTitle(b),
      zrodlo:(b.typ==="quiz"? (b.payload.zrodlo? b.payload.zrodlo.akt+" — "+b.payload.zrodlo.jednostka+" (stan "+b.payload.zrodlo.stan_prawny+")" : null) : b.payload.prawo)})),
    backlog: state.backlog
  };
}
function openExport(){ document.getElementById("json-out").value=JSON.stringify(buildExport(),null,2);
  document.getElementById("modal").classList.add("open"); }
function closeExport(){ document.getElementById("modal").classList.remove("open"); }
function downloadJSON(){
  const blob=new Blob([JSON.stringify(buildExport(),null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="materialy-fop-"+today()+".json";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  toast("Pobrano plik audytu");
}
function copyJSON(){ const ta=document.getElementById("json-out"); ta.select();
  try{ navigator.clipboard.writeText(ta.value); }catch(e){ document.execCommand("copy"); } toast("Skopiowano do schowka"); }

/* ================= RENDER ================= */
function render(){
  renderTopbar();
  const app=document.getElementById("app");
  switch(state.screen){
    case "start": app.innerHTML=rStart(); break;
    case "odbiorca": app.innerHTML=rOdbiorca(); break;
    case "etap": app.innerHTML=rEtap(); break;
    case "generacja": app.innerHTML=rGeneracja(); break;
    case "fallback": app.innerHTML=rFallback(); break;
    case "recenzja": app.innerHTML=rRecenzja(); break;
    case "bank": app.innerHTML=rBank(); break;
    case "test": app.innerHTML=rTest(); break;
  }
}
render();
</script>
