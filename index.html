<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototyp - Materiały edukacyjne Fundacji Odpowiedzialna Polityka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Paleta wg FOP Brand guidelines v1.0 */
  --paper:#F3F7FC;            /* Blue 050 — tło sekcji */
  --card:#FFFFFF; --ink:#0E1B2E;               /* Atrament — tekst podstawowy */
  --text-soft:#59697F;                          /* Szary tekst */
  --line:#DCE6F2; --line-strong:#B9CCE5;        /* neutralne pochodne Blue 100/300 */
  --brand:#3061AD;            /* Niebieski FOP — przyciski, linki, akcenty */
  --brand-soft:#E7EFF9;       /* Blue 100 — delikatne tła bloków */
  --brand-ink:#143055;        /* Granat FOP — tła, tekst nagłówkowy */
  --brand-hover:#244C8A;      /* Blue 700 — stany hover */
  --brand-300:#7FA3D4;        /* Blue 300 — elementy pomocnicze */
  --grad:linear-gradient(135deg,#3061AD 0%,#143055 100%); /* gradient firmowy 135° */
  --tak:#2E7D5B; --tak-soft:#E7F1EC; --tak-line:#BEDCCB;
  --popraw:#B0700F; --popraw-soft:#F7EEDD; --popraw-line:#E8D0A3;
  --usun:#B23A3A; --usun-soft:#F6E7E7; --usun-line:#E7BEBE;
  --neutral:#7E8CA0; --neutral-soft:#EDF2F8;
  --focus:#244C8A;
  --serif:"Libre Franklin",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --sans:"Libre Franklin",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --mono:"Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --radius:10px; --shadow:0 1px 2px rgba(20,48,85,.07),0 4px 14px rgba(20,48,85,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono)}
.wrap{max-width:960px;margin:0 auto;padding:0 18px 120px}

/* ---------- topbar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:rgba(244,246,248,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:960px;margin:0 auto;padding:10px 18px 0}
.brandrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:800;font-size:15px;color:var(--brand-ink);display:flex;align-items:center;gap:8px}
.brand-sub{font-family:var(--sans);font-weight:500;font-size:12.5px;color:var(--text-soft)}
.brand-logo{height:26px;width:auto;display:block}
.spacer{flex:1 1 auto}
.who{font-family:var(--mono);font-size:11.5px;color:var(--text-soft)}
.btn{border:1px solid var(--line-strong);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:8px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-hover);color:#fff}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{border-color:transparent;background:transparent;color:var(--brand)}
.btn-big{font-size:15px;padding:12px 22px;border-radius:10px}

/* stepper */
.stepper{display:flex;list-style:none;margin:10px 0 0;padding:0 0 10px;gap:0;overflow-x:auto}
.step{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 0;white-space:nowrap}
.step + .step::before{content:"";width:26px;height:1px;background:var(--line-strong);margin-right:10px;flex:0 0 auto}
.step button{border:none;background:transparent;display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--neutral);padding:2px 4px}
.step .dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-strong);display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;background:var(--card);color:var(--neutral)}
.step.done button{color:var(--brand)}
.step.done .dot{border-color:var(--brand);color:var(--brand)}
.step.cur button{color:var(--brand-ink)}
.step.cur .dot{background:var(--brand);border-color:var(--brand);color:#fff}
.step button:disabled{cursor:default;opacity:.7}

/* ---------- start ---------- */
.start{max-width:700px;margin:6vh auto 0;text-align:center;padding:0 8px}
.start-hero{background:var(--grad);border-radius:16px;padding:46px 30px 42px;color:#fff;box-shadow:0 12px 34px rgba(20,48,85,.28);margin-bottom:26px}
.start-logo{height:56px;width:auto;display:block;margin:0 auto 26px;background:#fff;padding:14px 22px;border-radius:14px;box-sizing:content-box}
.start-title{font-family:var(--serif);font-weight:900;font-size:33px;line-height:1.12;margin:0;color:#fff}
.start-sub{font-weight:700;font-size:16.5px;color:#DAE6F6;margin:10px 0 0}
.start-meta{font-family:var(--mono);font-size:11.5px;color:var(--text-soft);margin:16px auto 30px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;display:inline-block;line-height:1.5}
.start-field{display:flex;flex-direction:column;gap:6px;max-width:360px;margin:0 auto 18px;text-align:left}
.start-field label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-soft);font-weight:700}
.start-field select{font-family:var(--sans);font-size:15px;padding:11px 12px;border:1px solid var(--line-strong);border-radius:9px;background:var(--card)}
.start-note{font-size:12.5px;color:var(--text-soft);max-width:480px;margin:22px auto 0;line-height:1.55}

/* ---------- screens ---------- */
.screen-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);font-weight:500;margin:22px 0 0}
.screen-title{font-family:var(--serif);font-weight:800;font-size:23px;line-height:1.2;margin:4px 0 6px;color:var(--brand-ink)}
.screen-sub{font-size:13.5px;color:var(--text-soft);margin:0 0 18px}
.screen-sub b{color:var(--ink)}

.infobox{display:flex;gap:9px;align-items:flex-start;background:var(--brand-soft);border:1px solid #D8E1EF;border-radius:10px;padding:11px 13px;font-size:13px;color:var(--brand-ink);margin:16px 0}
.infobox svg{flex:0 0 auto;margin-top:2px}

/* choice cards */
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.choice{border:1.5px solid var(--line-strong);background:var(--card);border-radius:12px;padding:20px 18px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.choice:hover{border-color:var(--brand)}
.choice.sel{border-color:var(--brand);background:var(--brand-soft)}
.choice .c-ico{color:var(--brand)}
.choice .c-name{font-family:var(--serif);font-weight:800;font-size:17px;color:var(--brand-ink)}
.choice .c-desc{font-size:13px;color:var(--text-soft);line-height:1.5}
.choice .c-tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}

/* etap tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:6px 0 22px}
.tile{border:1.5px solid var(--line-strong);background:var(--card);border-radius:10px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:96px}
.tile:hover{border-color:var(--brand)}
.tile.sel{border-color:var(--brand);background:var(--brand-soft)}
.tile .t-k{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--brand)}
.tile .t-t{font-size:13.5px;font-weight:700;line-height:1.3}
.tile .t-d{font-size:11.5px;color:var(--text-soft);line-height:1.4}
.h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-soft);margin:18px 0 8px}
.mat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mat{border:1.5px solid var(--line-strong);background:var(--card);border-radius:10px;padding:14px;text-align:left;display:flex;gap:11px;align-items:flex-start}
.mat:hover{border-color:var(--brand)}
.mat.sel{border-color:var(--brand);background:var(--brand-soft)}
.mat .m-name{font-weight:700;font-size:14.5px}
.mat .m-desc{font-size:12.5px;color:var(--text-soft);margin-top:2px}
.radio{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-strong);flex:0 0 auto;margin-top:3px}
.sel .radio{border-color:var(--brand);background:radial-gradient(circle at center,var(--brand) 0 45%,transparent 50%)}

.scope{border-radius:10px;padding:12px 14px;font-size:13px;margin:18px 0;display:flex;gap:9px;align-items:flex-start;line-height:1.5}
.scope svg{flex:0 0 auto;margin-top:2px}
.scope.ok{background:var(--tak-soft);border:1px solid var(--tak-line);color:#1F5A41}
.scope.warn{background:var(--popraw-soft);border:1px solid var(--popraw-line);color:#7A5210}
.next-row{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}

/* generacja */
.inputs3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:8px 0 18px}
.inp{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:var(--shadow)}
.inp .i-n{font-family:var(--mono);font-size:10.5px;color:var(--brand);letter-spacing:.08em;text-transform:uppercase}
.inp .i-t{font-weight:700;font-size:13.5px;margin:3px 0 4px}
.inp .i-d{font-size:12px;color:var(--text-soft);line-height:1.45}
.genbox{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:22px;text-align:center}
.spin{width:26px;height:26px;border:3px solid var(--brand-soft);border-top-color:var(--brand);border-radius:50%;margin:0 auto 12px;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.gen-ready{font-family:var(--serif);font-size:18px;font-weight:800;color:var(--brand-ink)}
.gen-sub{font-size:13px;color:var(--text-soft);margin:6px 0 16px}
.rule-pill{display:inline-block;font-family:var(--mono);font-size:11px;background:var(--brand-soft);color:var(--brand-ink);border-radius:99px;padding:5px 12px;margin-top:14px}

/* fallback */
.fallback{background:var(--popraw-soft);border:1px solid var(--popraw-line);border-radius:12px;padding:20px}
.fallback h3{font-family:var(--serif);font-size:18px;margin:0 0 8px;color:#7A5210}
.fallback p{font-size:13.5px;line-height:1.55;margin:0 0 10px;color:#5C4310}
.fallback ul{margin:0 0 14px;padding-left:18px;font-size:12.5px;color:#5C4310}
.fallback ul li{margin:3px 0}

/* ---------- recenzja (arkusz) ---------- */
.source{font-family:var(--mono);font-size:11.5px;color:var(--text-soft);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;line-height:1.45;margin:10px 0 6px}
.source b{color:var(--brand-ink);font-weight:500}
.progress{font-size:13px;color:var(--text-soft);margin:6px 0 2px}
.progress b{color:var(--ink);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.chip{border:1px solid var(--line-strong);background:var(--card);border-radius:99px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--text-soft);display:inline-flex;gap:7px;align-items:center}
.chip[aria-pressed="true"]{color:#fff;border-color:var(--brand);background:var(--brand)}
.chip .n{font-family:var(--mono);font-size:11px;opacity:.85}
.chip.tak[aria-pressed="true"]{background:var(--tak);border-color:var(--tak)}
.chip.popraw[aria-pressed="true"]{background:var(--popraw);border-color:var(--popraw)}
.chip.usun[aria-pressed="true"]{background:var(--usun);border-color:var(--usun)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin:14px 0;overflow:hidden;position:relative}
.card.d-TAK{border-left:4px solid var(--tak)}
.card.d-POPRAW{border-left:4px solid var(--popraw)}
.card.d-USUN{border-left:4px solid var(--usun)}
.card-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 16px 0}
.id{font-family:var(--mono);font-size:12px;color:var(--brand-ink);font-weight:500}
.tag{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:6px;background:var(--neutral-soft);color:var(--text-soft)}
.tag.bloom{background:var(--brand-soft);color:var(--brand-ink)}
.stamp{margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:5px 12px;border-radius:6px;border:2px solid;transform:rotate(-2.5deg)}
.stamp.TAK{color:var(--tak);border-color:var(--tak-line);background:var(--tak-soft)}
.stamp.POPRAW{color:var(--popraw);border-color:var(--popraw-line);background:var(--popraw-soft)}
.stamp.USUN{color:var(--usun);border-color:var(--usun-line);background:var(--usun-soft)}
.cel{font-size:12.5px;color:var(--text-soft);padding:10px 16px 0;font-style:italic}
.ctx{padding:10px 16px 0}
.ctx span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--neutral);font-weight:700}
.ctx p{margin:2px 0 0;color:var(--ink)}
.q{padding:12px 16px 0;font-family:var(--serif);font-size:17px;line-height:1.35}
.prawo{margin:8px 16px 0;font-family:var(--mono);font-size:11.5px;color:var(--brand-ink);background:var(--brand-soft);display:inline-block;border-radius:7px;padding:5px 10px;margin-left:16px}
.desc{padding:8px 16px 0;font-size:14px}
.desc p{margin:4px 0}
.desc-ul{margin:4px 0;padding-left:20px}
.desc-ul li{margin:2px 0}
.opts{list-style:none;padding:10px 16px 4px;margin:0;display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.opt.correct{border-color:var(--tak-line);background:var(--tak-soft)}
.opt-mark{font-weight:700;margin-right:6px}
.opt.correct .opt-mark{color:var(--tak)}
.opt .why{display:block;margin-top:5px;font-size:12px;color:var(--text-soft)}
.opt .why b{color:var(--usun);font-weight:600}
details.fb{margin:6px 16px 0;border-top:1px dashed var(--line);padding-top:8px}
details.fb>summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--brand);list-style:none}
details.fb>summary::-webkit-details-marker{display:none}
details.fb>summary::before{content:"\25B8 "}
details.fb[open]>summary::before{content:"\25BE "}
.fb-row{font-size:13px;margin:8px 0}
.fb-row b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--neutral);margin-bottom:2px}
.src{margin:10px 16px 0;font-family:var(--mono);font-size:11.5px;color:var(--text-soft);background:var(--brand-soft);border-radius:8px;padding:8px 10px;line-height:1.45}
.src .ver{color:var(--brand-ink);font-weight:500}
.decision{border-top:1px solid var(--line);margin-top:12px;padding:12px 16px;background:#FBFCFD}
.decision-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-soft);font-weight:700;margin-bottom:8px}
.dbtns{display:flex;gap:8px;flex-wrap:wrap}
.dbtn{flex:1 1 auto;min-width:120px;border:1.5px solid var(--line-strong);background:var(--card);border-radius:9px;padding:11px 10px;font-size:14px;font-weight:700;color:var(--text-soft);display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;line-height:1.25}
.dbtn small{font-weight:500;font-size:11px;opacity:.85}
.dbtn:hover{border-color:currentColor}
.dbtn.tak:hover,.dbtn.tak.on{color:var(--tak);border-color:var(--tak);background:var(--tak-soft)}
.dbtn.popraw:hover,.dbtn.popraw.on{color:var(--popraw);border-color:var(--popraw);background:var(--popraw-soft)}
.dbtn.usun:hover,.dbtn.usun.on{color:var(--usun);border-color:var(--usun);background:var(--usun-soft)}
.note{margin-top:10px}
.note label{display:block;font-size:12px;font-weight:600;margin-bottom:4px}
.note label.req::after{content:" *";color:var(--usun)}
.note textarea{width:100%;font-family:var(--sans);font-size:13.5px;padding:9px 11px;border:1px solid var(--line-strong);border-radius:8px;resize:vertical;min-height:64px}
.note .hint{font-size:11.5px;color:var(--usun);margin-top:4px;display:none}
.note.missing .hint{display:block}
.note.missing textarea{border-color:var(--usun-line)}
.meta-line{font-size:11.5px;color:var(--neutral);margin-top:8px;font-family:var(--mono)}

.actionbar{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.actionbar-inner{max-width:960px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.actionbar .rule{font-size:12.5px;color:var(--text-soft)}
.actionbar .rule b{color:var(--ink)}

/* ---------- bank ---------- */
.bank-sec{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin:14px 0;overflow:hidden}
.bank-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bank-head h3{margin:0;font-family:var(--serif);font-size:16px;font-weight:800;color:var(--brand-ink)}
.bank-head .bk{font-family:var(--mono);font-size:12px;color:var(--brand);font-weight:600}
.bank-head .cn{font-family:var(--mono);font-size:12px;color:var(--text-soft);margin-left:auto}
.bank-body{padding:6px 16px 12px}
.role-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--neutral);margin:12px 0 4px}
.b-item{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin:7px 0;display:flex;flex-direction:column;gap:5px}
.b-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.b-title{font-size:13.5px;line-height:1.4}
.b-meta{font-family:var(--mono);font-size:11px;color:var(--neutral)}
.b-uwagi{font-size:12px;color:var(--text-soft);border-left:2px solid var(--popraw-line);padding-left:8px}
.schip{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:5px;border:1.5px solid}
.schip.opublikowane{color:var(--tak);border-color:var(--tak-line);background:var(--tak-soft)}
.schip.do_poprawek{color:var(--popraw);border-color:var(--popraw-line);background:var(--popraw-soft)}
.schip.wykluczone{color:var(--usun);border-color:var(--usun-line);background:var(--usun-soft)}
.schip.archiwalne{color:var(--neutral);border-color:var(--line-strong);background:var(--neutral-soft)}
.b-empty{font-size:12.5px;color:var(--neutral);font-style:italic;padding:10px 2px}
.backlog-sec{border:1px dashed var(--popraw-line);background:var(--popraw-soft);border-radius:var(--radius);margin:18px 0;padding:14px 16px}
.backlog-sec h3{margin:0 0 6px;font-size:14px;color:#7A5210}
.backlog-sec .b-item{background:var(--card)}

/* modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(21,32,48,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:18px}
.modal-bg.open{display:flex}
.modal{background:var(--card);border-radius:12px;max-width:640px;width:100%;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(21,32,48,.35)}
.modal h2{font-family:var(--serif);font-size:18px;margin:0;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal .mbody{padding:14px 18px;overflow:auto;font-size:14px;line-height:1.55}
.modal textarea{width:100%;height:280px;font-family:var(--mono);font-size:11.5px;border:1px solid var(--line-strong);border-radius:8px;padding:10px;resize:vertical}
.modal .mfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.pub-big{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--brand-ink);margin:0 0 8px}
.pub-meta{font-family:var(--mono);font-size:12px;background:var(--brand-soft);border-radius:8px;padding:9px 11px;color:var(--brand-ink);line-height:1.6}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--brand-ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:600;opacity:0;transition:.25s;z-index:120;box-shadow:var(--shadow);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:760px){
  .tiles{grid-template-columns:repeat(2,1fr)}
  .inputs3{grid-template-columns:1fr}
  .choice-grid,.mat-grid{grid-template-columns:1fr}
  .start-title{font-size:26px}
  .stamp{transform:none}
}
.oos{opacity:.8;pointer-events:none;cursor:not-allowed}
.oos .t-t,.oos .m-name{color:var(--text-soft)}
.pdots{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.pdot{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--line-strong);background:var(--card);cursor:pointer;padding:0;transition:transform .12s}
.pdot:hover{transform:scale(1.3)}
.pdot.TAK{background:var(--tak);border-color:var(--tak)}
.pdot.POPRAW{background:var(--popraw);border-color:var(--popraw)}
.pdot.USUN{background:var(--usun);border-color:var(--usun)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ===== Moduł testowy ===== */
.segbar{display:flex;gap:3px;height:10px;margin:2px 0 12px}
.segbar .seg{flex:1;background:var(--line);border-radius:4px;min-width:4px}
.segbar .seg.ok{background:var(--tak)}
.segbar .seg.bad{background:var(--popraw)}
.segbar .seg.cur{outline:2px solid var(--brand);outline-offset:1px}
.tst-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:0 0 14px}
.tst-ctx{background:var(--brand-soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;margin:0 0 12px}
.tst-opt{display:flex;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line-strong);border-radius:10px;padding:12px 14px;margin:0 0 8px;cursor:pointer;font:inherit;font-size:14px;align-items:flex-start}
.tst-opt .radio{margin-top:2px}
.tst-opt.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.tst-opt.sel .radio{border-color:var(--brand);background:var(--brand)}
.tst-opt.ok{border-color:var(--tak-line);background:var(--tak-soft)}
.tst-opt.bad{border-color:var(--popraw-line);background:var(--popraw-soft)}
.tst-opt:disabled{cursor:default;opacity:1}
.fbp{border-radius:10px;padding:12px 14px;margin:10px 0 0;font-size:13.5px}
.fbp.ok{background:var(--tak-soft);border:1px solid var(--tak-line)}
.fbp.bad{background:var(--popraw-soft);border:1px solid var(--popraw-line)}
.fbp .src{display:block;margin-top:8px;color:var(--text-soft);font-size:12.5px}
.qchip{display:inline-block;background:var(--brand-soft);color:var(--brand-ink);border-radius:999px;padding:2px 10px;font-size:12px;margin:0 0 10px}
.cover{margin:0 0 14px}
.cover .bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.cover .bar i{display:block;height:100%;background:var(--grad);border-radius:6px;transition:width .3s}
.cover small{color:var(--text-soft);font-size:12.5px}
.chk{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 10px;width:100%;text-align:left;font:inherit;font-size:14px;cursor:pointer}
.chk .box{width:22px;height:22px;border:2px solid var(--line-strong);border-radius:6px;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:14px}
.chk.on{border-color:var(--tak-line);background:var(--tak-soft)}
.chk.on .box{background:var(--tak);border-color:var(--tak)}

.schip.niezatw{background:#EEF1F6;color:#59697F;border:1px solid var(--line-strong)}
</style>
</head>

const SRC_QUIZ_OBS = [{"id": "obs-ustalenie-001", "rola": "obserwator", "faza": "ustalenie_wynikow", "cel_uczenia": "Rozpoznać, że obserwatorka ma prawo być obecna przy wszystkich czynnościach ustalania wyniku (kompetencja: znajomość prawa).", "poziom_blooma": "rozumienie", "typ": "wielokrotny_wybor", "kontekst": "Komisja przystępuje do liczenia po zamknięciu lokalu.", "pytanie": "Wskaż, przy których czynnościach komisji podczas ustalania wyniku obserwatorka społeczna ma prawo być obecna.", "opcje": [{"tekst": "Przy wszystkich czynnościach komisji — od zamknięcia lokalu po sporządzenie protokołu.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Tylko do momentu zamknięcia lokalu; przy liczeniu głosów już nie.", "poprawna": false, "uzasadnienie_dystraktora": "myli fazę — obserwator ma prawo obecności także przy liczeniu i sporządzaniu protokołu (art. 103b § 1 pkt 2)"}, {"tekst": "Przy każdej czynności, ale za każdorazową zgodą przewodniczącego.", "poprawna": false, "uzasadnienie_dystraktora": "zaniża uprawnienie — prawo obecności nie zależy od zgody komisji przy poszczególnych czynnościach"}], "feedback_poprawny": "Tak. Obserwatorka społeczna, na mocy art. 103c stosującego odpowiednio przepisy o mężu zaufania, ma prawo być obecna przy wszystkich czynnościach komisji, w tym przy liczeniu i sporządzaniu protokołu (art. 103b § 1 pkt 1–2). To prawo obserwacji jest podstawą całej jej roli.", "feedback_niepoprawny": "Sprawdź zakres prawa obecności: nie kończy się ono na zamknięciu lokalu i nie wymaga zgody komisji przy każdej czynności. Obejmuje wszystkie czynności ustalania wyniku.", "zrodlo": {"chunk_id": "kodeks-wyborczy:art103c", "akt": "Ustawa z dnia 5 stycznia 2011 r. — Kodeks wyborczy", "jednostka": "art. 103c", "stan_prawny": "2023-03-31", "wybory": null}}, {"id": "obs-ustalenie-002", "rola": "obserwator", "faza": "ustalenie_wynikow", "cel_uczenia": "Odróżnić uprawnienia obserwatora społecznego od męża zaufania — brak prawa wnoszenia uwag do protokołu (kompetencja: granica roli).", "poziom_blooma": "rozumienie", "typ": "prawda_falsz", "kontekst": null, "pytanie": "Obserwatorka społeczna może wnieść do protokołu głosowania uwagi z wymienieniem konkretnych zarzutów.", "opcje": [{"tekst": "Prawda", "poprawna": false, "uzasadnienie_dystraktora": "myli obserwatora społecznego z mężem zaufania — wnoszenie uwag do protokołu (art. 103b § 1 pkt 3) jest dla obserwatora społecznego wyłączone przez art. 103c § 2"}, {"tekst": "Fałsz", "poprawna": true, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Fałsz — zgadza się. Prawo wnoszenia uwag do protokołu przysługuje mężowi zaufania (art. 103b § 1 pkt 3), ale wobec obserwatora społecznego jest wyłączone (art. 103c § 2). Anna dokumentuje odstępstwa we własnych notatkach i przekazuje je swoją ścieżką (koordynator, raport akcji) — to jej właściwy tryb.", "feedback_niepoprawny": "To rozpowszechniona pomyłka. Uwagi do protokołu wnosi mąż zaufania, nie obserwator społeczny. Anna zapisuje spostrzeżenia u siebie i zgłasza je koordynatorowi — nie do protokołu komisji.", "zrodlo": {"chunk_id": "kodeks-wyborczy:art103c", "akt": "Ustawa z dnia 5 stycznia 2011 r. — Kodeks wyborczy", "jednostka": "art. 103c", "stan_prawny": "2023-03-31", "wybory": null}}, {"id": "obs-ustalenie-003", "rola": "obserwator", "faza": "ustalenie_wynikow", "cel_uczenia": "Rozpoznać zakazany podział komisji na podgrupy liczące równolegle (kompetencja: rozpoznanie odstępstwa).", "poziom_blooma": "rozumienie", "typ": "prawda_falsz", "kontekst": null, "pytanie": "Aby liczyć szybciej, komisja może podzielić się na podgrupy, z których każda liczy równolegle inny stos kart.", "opcje": [{"tekst": "Prawda", "poprawna": false, "uzasadnienie_dystraktora": "mit „będzie szybciej” — kuszący przy zmęczeniu, ale niedopuszczalny: liczenie prowadzi cała komisja wspólnie"}, {"tekst": "Fałsz", "poprawna": true, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Fałsz — dobrze. Czynności liczenia komisja wykonuje wspólnie, bez dzielenia się na równolegle pracujące podgrupy (art. 69). Chodzi o to, by każdy członek widział karty. Podział na podgrupy Anna zanotuje jako odstępstwo.", "feedback_niepoprawny": "To częsta pułapka „będzie szybciej”. Mimo presji czasu komisja nie może liczyć w rozdzielnych podgrupach — to czynność wspólna całego składu. Taki podział jest odstępstwem do zanotowania.", "zrodlo": {"chunk_id": "kodeks-wyborczy:art69", "akt": "Ustawa z dnia 5 stycznia 2011 r. — Kodeks wyborczy", "jednostka": "art. 69", "stan_prawny": "2023-03-31", "wybory": null}}, {"id": "obs-ustalenie-004", "rola": "obserwator", "faza": "ustalenie_wynikow", "cel_uczenia": "Zastosować granicę roli, gdy w liczeniu uczestniczy osoba spoza komisji (kompetencja: znajomość prawa + brak ingerencji).", "poziom_blooma": "analiza", "typ": "scenariusz", "kontekst": "Podczas liczenia Anna widzi, że mąż zaufania sortuje i przelicza karty razem z członkami komisji.", "pytanie": "Wskaż, jak powinna zareagować Anna.", "opcje": [{"tekst": "Odnotować odstępstwo — karty liczy sam skład komisji, a mąż zaufania nie ma do tego uprawnienia.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Uznać udział za dozwolony, bo mąż zaufania ma przecież prawo być obecny przy liczeniu głosów.", "poprawna": false, "uzasadnienie_dystraktora": "myli prawo obecności z prawem udziału w czynności — obecność nie uprawnia do liczenia kart"}, {"tekst": "Samej włączyć się do liczenia kart, skoro również jest obecna w lokalu podczas prac komisji.", "poprawna": false, "uzasadnienie_dystraktora": "rażące wyjście z roli — obserwator patrzy i notuje, nie wykonuje czynności komisji"}], "feedback_poprawny": "Tak. Liczenia dokonuje sama komisja (art. 69 § 1). Udział osoby spoza składu to odstępstwo — Anna opisuje je faktograficznie (kto, kiedy, przy którym kroku), nie ingerując w pracę komisji.", "feedback_niepoprawny": "Rozdziel dwie rzeczy: prawo obecności to nie prawo udziału w liczeniu. Karty liczy tylko komisja. Anna tego nie robi ani nie sankcjonuje — odnotowuje.", "zrodlo": {"chunk_id": "kodeks-wyborczy:art69", "akt": "Ustawa z dnia 5 stycznia 2011 r. — Kodeks wyborczy", "jednostka": "art. 69", "stan_prawny": "2023-03-31", "wybory": null}}, {"id": "obs-ustalenie-005", "rola": "obserwator", "faza": "ustalenie_wynikow", "cel_uczenia": "Ocenić reakcję komisji na niezgodność sumy — ponowne przeliczenie, nie „domykanie” (kompetencja: rzetelność procesu).", "poziom_blooma": "ocena", "typ": "scenariusz", "kontekst": "Suma się nie zgadza; komisja poprawia liczbę „na oko”, żeby wynik się zgodził, i idzie dalej.", "pytanie": "Zdecyduj, co Anna powinna zrobić.", "opcje": [{"tekst": "Odnotować brak reakcji na rozbieżność, ze wskazaniem protokołu.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Uznać, że drobne korekty wyniku „na oko” są dopuszczalne, więc nie ma tu czego odnotowywać.", "poprawna": false, "uzasadnienie_dystraktora": "sankcjonowanie nieprawidłowości — przy rozbieżności prawo wymaga ponownego przeliczenia (art. 71 § 1)"}, {"tekst": "Podać komisji poprawny wynik, który sama wyliczyła, żeby szybko naprawić dostrzeżony błąd.", "poprawna": false, "uzasadnienie_dystraktora": "wyjście z roli — obserwator nie ustala wyniku za komisję ani nie koryguje jej pracy"}], "feedback_poprawny": "Tak. Przy niezgodności komisja ma przeliczyć ponownie to, czego dotyczy rozbieżność (art. 71 § 1), a nie „domknąć” wynik. Brak takiej reakcji to odstępstwo — Anna opisuje je faktograficznie, nie zastępując decyzji komisji.", "feedback_niepoprawny": "„Domknięcie” wyniku bez ponownego przeliczenia jest nieprawidłowe. Anna tego nie akceptuje jako normy, ale też nie liczy za komisję — notuje brak reakcji na rozbieżność.", "zrodlo": {"chunk_id": "kodeks-wyborczy:art71", "akt": "Ustawa z dnia 5 stycznia 2011 r. — Kodeks wyborczy", "jednostka": "art. 71", "stan_prawny": "2023-03-31", "wybory": null}}, {"id": "obs-ustalenie-006", "rola": "obserwator", "faza": "ustalenie_wynikow", "cel_uczenia": "Zastosować katalog osób uprawnionych do obecności i granicę roli (kompetencja: znajomość prawa + brak ingerencji).", "poziom_blooma": "analiza", "typ": "scenariusz", "kontekst": "Podczas liczenia w lokalu pojawia się osoba, która nie należy do komisji ani do katalogu osób uprawnionych do obecności.", "pytanie": "Wskaż właściwe działanie Anny.", "opcje": [{"tekst": "Odnotować obecność osoby nieuprawnionej — godzina i opis.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Samodzielnie i stanowczo wyprosić tę osobę z lokalu wyborczego.", "poprawna": false, "uzasadnienie_dystraktora": "nadgorliwość i wyjście z roli — porządku w lokalu pilnuje komisja, nie obserwator"}, {"tekst": "Założyć, że skoro osoba tam jest, to ktoś ją wpuścił zgodnie z zasadami, i nic nie notować.", "poprawna": false, "uzasadnienie_dystraktora": "bierność — obecność osoby spoza katalogu uprawnionych to odstępstwo, które należy udokumentować"}], "feedback_poprawny": "Tak. Po zamknięciu lokalu mogą w nim przebywać m.in. mężowie zaufania, obserwatorzy społeczni i międzynarodowi oraz obsługa informatyczna (pkt 100). Obecność osoby spoza tego katalogu Anna dokumentuje faktograficznie; usunięcie osoby należy do komisji.", "feedback_niepoprawny": "Dwa wychylenia są tu błędne: samodzielne wypraszanie (to zadanie komisji) oraz zignorowanie sytuacji. Właściwa reakcja to rzetelne odnotowanie z godziną i opisem.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt100", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział V, pkt 100", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-zakonczenie-007", "rola": "obserwator", "faza": "zakonczenie_glosowania", "cel_uczenia": "Rozpoznać, czy liczenie rozpoczęto przy wymaganym kworum 2/3 (kompetencja: znajomość prawa).", "poziom_blooma": "analiza", "typ": "scenariusz", "kontekst": "Anna liczy obecnych członków — jest ich mniej niż 2/3 składu, a komisja zaczyna liczyć głosy.", "pytanie": "Zdecyduj, co robi Anna.", "opcje": [{"tekst": "Odnotować, że liczenie rozpoczęto bez wymaganego kworum, z godziną i liczbą obecnych członków.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Samodzielnie wstrzymać liczenie do czasu uzupełnienia składu.", "poprawna": false, "uzasadnienie_dystraktora": "wyjście z roli — obserwator nie wstrzymuje czynności komisji"}, {"tekst": "Uznać, że liczebność składu to wewnętrzna sprawa komisji, i nie notować.", "poprawna": false, "uzasadnienie_dystraktora": "bierność — rozpoczęcie liczenia bez kworum to odstępstwo, które należy udokumentować"}], "feedback_poprawny": "Tak. Do liczenia komisja przystępuje przy obecności co najmniej 2/3 pełnego składu, w tym przewodniczącego lub zastępcy (pkt 99). Rozpoczęcie bez kworum to odstępstwo — Anna je opisuje; jeśli chce zwrócić komisji uwagę, robi to w formie pytania, nie polecenia.", "feedback_niepoprawny": "Kworum 2/3 to warunek rozpoczęcia liczenia, więc jego brak jest istotny i podlega odnotowaniu. Anna nie wstrzymuje jednak czynności sama — dokumentuje i ewentualnie pyta.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt99", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział V, pkt 99", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-zakonczenie-008", "rola": "obserwator", "faza": "zakonczenie_glosowania", "cel_uczenia": "Zastosować zasadę „pytanie zamiast polecenia” wobec braku zabezpieczenia urny (kompetencja: interakcje z administracją + bezzwłoczny przekaz).", "poziom_blooma": "stosowanie", "typ": "scenariusz", "kontekst": "Przed rozpoczęciem liczenia Anna widzi, że otwór urny nie został prawidłowo zapieczętowany.", "pytanie": "Wskaż reakcję zgodną z rolą obserwatora.", "opcje": [{"tekst": "Odnotować brak prawidłowego zapieczętowania i niezwłocznie przekazać koordynatorowi; komisji można zwrócić uwagę w formie pytania.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Poinformować komisję poleceniem: „Ta urna jest źle zaplombowana, poprawcie to natychmiast”.", "poprawna": false, "uzasadnienie_dystraktora": "forma polecenia — Kodeks postępowania dopuszcza zwrócenie uwagi tylko w formie pytania, nie nakazu"}, {"tekst": "Samodzielnie dokleić pasek i przyłożyć zabezpieczenie, żeby usprawnić pracę.", "poprawna": false, "uzasadnienie_dystraktora": "nadgorliwość i dotykanie sprzętu komisji — obserwator nie wykonuje czynności zabezpieczających"}], "feedback_poprawny": "Tak. Otwór urny pieczętuje przewodniczący (pkt 101). Niezabezpieczona urna to sytuacja poważna — wymaga bezzwłocznego przekazania koordynatorowi (reguła rzetelnego/bezzwłocznego przekazu). Komisji Anna może zwrócić uwagę wyłącznie w formie pytania (reguła interakcji z administracją).", "feedback_niepoprawny": "Kierunek jest dobry, ale nie przez polecenie ani samodzielną naprawę. Właściwie: odnotuj, przekaż koordynatorowi bez zwłoki, a komisji — jeśli już — zadaj pytanie.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt101", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział V, pkt 101", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-rozliczenie-009", "rola": "obserwator", "faza": "rozliczenie_kart", "cel_uczenia": "Rozpoznać naruszenie rozdzielności trzech protokołów przy liczbie otrzymanych kart (kompetencja: rzetelny przekaz faktograficzny).", "poziom_blooma": "analiza", "typ": "scenariusz", "kontekst": "Komisja wpisuje jedną, łączną liczbę otrzymanych kart zamiast trzech odrębnych.", "pytanie": "Zdecyduj, co odnotowuje Anna.", "opcje": [{"tekst": "Odnotować brak odrębnego wpisu dla Sejmu, Senatu i referendum.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Uznać jeden wpis łączny za wystarczający, bo „sumy i tak się na koniec zgodzą”.", "poprawna": false, "uzasadnienie_dystraktora": "myli rozdzielność protokołów — w wyborach łączonych każdą liczbę ustala się osobno dla trzech głosowań (pkt 111)"}, {"tekst": "Samodzielnie przepisać brakujące liczby do właściwych protokołów, żeby pomóc komisji.", "poprawna": false, "uzasadnienie_dystraktora": "wyjście z roli — wypełnianie protokołów należy do komisji, nie do obserwatora"}], "feedback_poprawny": "Tak. W wyborach łączonych liczbę otrzymanych kart przenosi się z protokołu wewnętrznego odrębnie do każdego z trzech protokołów (pkt 111). Wpis łączny to odstępstwo — Anna opisuje je, wskazując konkretny protokół; nie uzupełnia protokołów za komisję.", "feedback_niepoprawny": "Rozdzielność trzech protokołów jest tu istotą: liczba łączna nie zastępuje trzech odrębnych wpisów. Anna to odnotowuje, ale protokołów nie wypełnia.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt111", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 111", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-rozliczenie-010", "rola": "obserwator", "faza": "rozliczenie_kart", "cel_uczenia": "Zastosować kontrolę spójności: liczba uprawnionych równa w trzech protokołach (kompetencja: kontrola sum).", "poziom_blooma": "rozumienie", "typ": "prawda_falsz", "kontekst": null, "pytanie": "Liczba osób uprawnionych do głosowania może się różnić między protokołem dla Sejmu, dla Senatu i dla referendum.", "opcje": [{"tekst": "Prawda", "poprawna": false, "uzasadnienie_dystraktora": "myli liczbę uprawnionych (ta sama grupa wyborców) z liczbą kart danego głosowania — liczby uprawnionych mają być równe we wszystkich trzech protokołach"}, {"tekst": "Fałsz", "poprawna": true, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Fałsz — dobrze. To ta sama grupa uprawnionych wyborców, więc liczba uprawnionych powinna być równa w protokole Sejmu, Senatu i referendum (pkt 111). Rozbieżność bez wyjaśnienia Anna zanotuje jako sygnał do sprawdzenia.", "feedback_niepoprawny": "Uważaj na pojęcia: liczba uprawnionych to ta sama grupa dla wszystkich trzech głosowań, więc powinna być równa. Różne bywają liczby kart, nie liczba uprawnionych.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt111", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 111", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-rozliczenie-011", "rola": "obserwator", "faza": "rozliczenie_kart", "cel_uczenia": "Rozpoznać nieprawidłowe pakowanie kart niewykorzystanych (kompetencja: rozpoznanie odstępstwa).", "poziom_blooma": "analiza", "typ": "scenariusz", "kontekst": "Komisja wrzuca karty niewykorzystane z trzech głosowań do jednego pudełka, bez pieczęci.", "pytanie": "Wskaż, co odnotowuje Anna.", "opcje": [{"tekst": "Odnotować, że kart niewykorzystanych nie spakowano odrębnie dla trzech głosowań ani nie opieczętowano.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Uznać wspólne, niezapieczętowane pakowanie za dopuszczalne, bo oszczędza czas.", "poprawna": false, "uzasadnienie_dystraktora": "mit oszczędności — karty niewykorzystane pakuje się odrębnie dla każdych wyborów, pieczętuje i podpisuje (pkt 111)"}, {"tekst": "Samej rozdzielić i opieczętować pakiety, by pomóc komisji.", "poprawna": false, "uzasadnienie_dystraktora": "wyjście z roli i dotykanie kart — pakowanie i pieczętowanie wykonuje komisja"}], "feedback_poprawny": "Tak. Karty niewykorzystane liczy się i pakuje odrębnie dla Sejmu, Senatu i referendum, a pakiety pieczętuje i podpisuje (pkt 111). Wspólne lub niezabezpieczone pakowanie to odstępstwo — Anna je opisuje, nie wykonując tych czynności sama.", "feedback_niepoprawny": "Odrębność i zabezpieczenie pakietów to nie formalność — to warunek rozliczalności kart. Anna to odnotowuje, ale pakietów nie pakuje ani nie pieczętuje.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt111", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 111", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-rozliczenie-012", "rola": "obserwator", "faza": "rozliczenie_kart", "cel_uczenia": "Rozpoznać niewłaściwe potraktowanie karty znalezionej/zwróconej (kompetencja: znajomość prawa).", "poziom_blooma": "analiza", "typ": "scenariusz", "kontekst": "Komisja znajduje kartę poza urną i wrzuca ją do urny, żeby „głos się nie zmarnował”.", "pytanie": "Zdecyduj, co robi Anna.", "opcje": [{"tekst": "Odnotować odstępstwo — taka karta idzie do odrębnego pakietu, nie do urny.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Uznać wrzucenie karty do urny za właściwe rozwiązanie, „żeby głos się nie zmarnował”.", "poprawna": false, "uzasadnienie_dystraktora": "sankcjonowanie nieprawidłowości — takich kart nie uwzględnia się w obliczeniach (pkt 102)"}, {"tekst": "Samodzielnie sięgnąć do urny i wyjąć z niej tę kartę.", "poprawna": false, "uzasadnienie_dystraktora": "rażące wyjście z roli i dotykanie kart — obserwator nie ingeruje w zawartość urny"}], "feedback_poprawny": "Tak. Kart znalezionych lub zwróconych przez wyborcę nie wrzuca się do urny ani nie uwzględnia w obliczeniach — pakuje się je odrębnie (pkt 102). Wrzucenie takiej karty do urny to odstępstwo, które Anna opisuje; sama kart nie wyjmuje.", "feedback_niepoprawny": "„Żeby się nie zmarnował” to pułapka — takiej karty nie liczy się i nie wrzuca do urny. Anna to notuje, ale nie sięga do urny.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt102", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział V, pkt 102", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-ustalenie-013", "rola": "obserwator", "faza": "ustalenie_wynikow", "cel_uczenia": "Ocenić krytyczne odstępstwo: otwarcie urny bez kontroli plomb (kompetencja: bezzwłoczny przekaz + znajomość prawa).", "poziom_blooma": "ocena", "typ": "scenariusz", "kontekst": "Komisja od razu otwiera urnę i wyjmuje karty, nie sprawdzając wcześniej, czy plomby są nienaruszone.", "pytanie": "Wskaż właściwą reakcję Anny.", "opcje": [{"tekst": "Odnotować jako krytyczne odstępstwo brak kontroli plomb i zgłosić to koordynatorowi bez zwłoki.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Uznać, że skoro plomby z daleka wyglądają w porządku, osobna kontrola przed otwarciem nie jest konieczna.", "poprawna": false, "uzasadnienie_dystraktora": "bierność — sprawdzenie nienaruszenia plomb przed otwarciem urny jest wymaganym krokiem (pkt 112–113)"}, {"tekst": "Samodzielnie podejść do urny i obejrzeć z bliska stan plomb przed otwarciem.", "poprawna": false, "uzasadnienie_dystraktora": "wyjście z roli i dotykanie sprzętu — kontrolę plomb wykonuje komisja, nie obserwator"}], "feedback_poprawny": "Tak. Przed otwarciem urny komisja sprawdza nienaruszenie plomb i zaklejenia (pkt 112–113). Pominięcie tej kontroli to poważne, krytyczne odstępstwo — wymaga bezzwłocznego przekazania koordynatorowi. Anna nie sprawdza plomb sama.", "feedback_niepoprawny": "Kontrola plomb przed otwarciem urny jest warunkiem wiarygodności liczenia, więc jej pominięcie jest krytyczne — notuj i zgłoś od razu. Ale plomb nie sprawdzasz osobiście.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt112", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 112", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-ustalenie-014", "rola": "obserwator", "faza": "ustalenie_wynikow", "cel_uczenia": "Zastosować rozdzielność liczenia kart z kopert (głosowanie korespondencyjne) (kompetencja: kontrola rozdzielności).", "poziom_blooma": "rozumienie", "typ": "prawda_falsz", "kontekst": null, "pytanie": "Karty wyjęte z kopert na kartę do głosowania (głosowanie korespondencyjne) można policzyć łącznie dla wszystkich trzech głosowań.", "opcje": [{"tekst": "Prawda", "poprawna": false, "uzasadnienie_dystraktora": "myli rozdzielność protokołów — karty z kopert ustala się odrębnie dla Sejmu, Senatu i referendum (pkt 115)"}, {"tekst": "Fałsz", "poprawna": true, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Fałsz — zgadza się. Karty z kopert ustala się i liczy odrębnie dla każdego z trzech głosowań (pkt 115). Połączenie liczb Anna zanotuje jako odstępstwo.", "feedback_niepoprawny": "Także karty korespondencyjne podlegają rozdzielności trzech protokołów — liczy się je osobno, nie łącznie.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt115", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 115", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-ustalenie-015", "rola": "obserwator", "faza": "ustalenie_wynikow", "cel_uczenia": "Rozpoznać błędną kwalifikację karty całkowicie przedartej (kompetencja: rozpoznanie odstępstwa).", "poziom_blooma": "analiza", "typ": "scenariusz", "kontekst": "Komisja wlicza do obliczeń kartę, która jest całkowicie przedarta na dwie części.", "pytanie": "Zdecyduj, co odnotowuje Anna.", "opcje": [{"tekst": "Odnotować, że karta całkowicie przedarta została wliczona do obliczeń, mimo że należy ją pominąć.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Uznać, że skoro na karcie widać znak przy nazwisku, głos i tak się liczy.", "poprawna": false, "uzasadnienie_dystraktora": "błędna kwalifikacja — kartę całkowicie przedartą pomija się w obliczeniach niezależnie od jej treści (pkt 116)"}, {"tekst": "Samodzielnie zdecydować, że karta jest nieważna, i tak ją zakwalifikować.", "poprawna": false, "uzasadnienie_dystraktora": "wyjście z roli sędziego — o kwalifikacji kart decyduje komisja, nie obserwator"}], "feedback_poprawny": "Tak. Kartę całkowicie przedartą pomija się przy ustalaniu liczby kart (pkt 116). Wliczenie jej to odstępstwo — Anna je opisuje. O kwalifikacji kart decyduje komisja; Anna jej nie zastępuje.", "feedback_niepoprawny": "Rozdziel dwie rzeczy: rozpoznanie błędu (to robisz) od rozstrzygania o ważności karty (to robi komisja). Karta całkowicie przedarta jest pomijana.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt116", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 116", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-ustalenie-016", "rola": "obserwator", "faza": "ustalenie_wynikow", "cel_uczenia": "Ocenić, czy o kartach spornych komisja decyduje wspólnie (kompetencja: granica „świadek, nie sędzia”).", "poziom_blooma": "ocena", "typ": "scenariusz", "kontekst": "Członek komisji samodzielnie uznaje sporną kartę za ważną i odkłada ją na stos, bez decyzji całego składu.", "pytanie": "Wskaż właściwą reakcję Anny.", "opcje": [{"tekst": "Odnotować jednoosobowe rozstrzygnięcie spornej karty, z przykładem.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Uznać za normalne, że to najbardziej doświadczony członek komisji sam rozstrzyga sporne karty.", "poprawna": false, "uzasadnienie_dystraktora": "sankcjonowanie nieprawidłowości — o kartach/głosach spornych komisja decyduje wspólnie (pkt 118)"}, {"tekst": "Przedstawić komisji własną ocenę tego, czy sporna karta jest ważna.", "poprawna": false, "uzasadnienie_dystraktora": "wyjście z roli sędziego — obserwator nie rozstrzyga o ważności kart"}], "feedback_poprawny": "Tak. O kartach i głosach spornych komisja decyduje wspólnie (pkt 118). Rozstrzygnięcie jednoosobowe to odstępstwo — Anna opisuje je na konkretnym przykładzie. Sama nie przedstawia oceny ważności; jest świadkiem, nie sędzią.", "feedback_niepoprawny": "Istota roli: dokumentujesz, że decyzja zapadła niewłaściwym trybem (jednoosobowo), ale nie proponujesz własnego rozstrzygnięcia. O ważności decyduje komisja wspólnie.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt118", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 118", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-ustalenie-017", "rola": "obserwator", "faza": "ustalenie_wynikow", "cel_uczenia": "Zastosować kontrolę sumy kart (nieważne + ważne = wyjęte z urny) (kompetencja: kontrola sum).", "poziom_blooma": "rozumienie", "typ": "prawda_falsz", "kontekst": null, "pytanie": "Jeśli suma kart ważnych i nieważnych nie zgadza się z liczbą kart wyjętych z urny, komisja może przejść dalej, o ile różnica jest niewielka.", "opcje": [{"tekst": "Prawda", "poprawna": false, "uzasadnienie_dystraktora": "mit „drobnej różnicy” — kontrola sumy musi się zgadzać; przy rozbieżności właściwą reakcją jest ponowne przeliczenie, nie akceptacja różnicy"}, {"tekst": "Fałsz", "poprawna": true, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Fałsz — dobrze. W każdym protokole suma kart nieważnych i ważnych ma równać się liczbie kart wyjętych z urny (pkt 118). Niezgodności nie „przepuszcza się” z powodu małej różnicy — Anna zanotuje brak reakcji na rozbieżność.", "feedback_niepoprawny": "„Niewielka różnica” nie jest dopuszczalna — suma musi się zgadzać. Rozbieżność to sygnał do ponownego przeliczenia, a jej zignorowanie jest odstępstwem.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt118", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 118", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-ustalenie-018", "rola": "obserwator", "faza": "ustalenie_wynikow", "cel_uczenia": "Rozpoznać niezachowanie kolejności/zabezpieczenia kart Senatu i referendum (kompetencja: rozpoznanie odstępstwa).", "poziom_blooma": "analiza", "typ": "scenariusz", "kontekst": "Komisja jednocześnie liczy głosy do Sejmu, Senatu i referendum, a stosy kart się mieszają.", "pytanie": "Wskaż, co odnotowuje Anna.", "opcje": [{"tekst": "Odnotować równoległe ustalanie wyników trzech głosowań z mieszaniem stosów kart.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Uznać równoległe ustalanie wyników za dopuszczalne, ponieważ wyraźnie przyspiesza pracę komisji.", "poprawna": false, "uzasadnienie_dystraktora": "przeniesienie mitu podgrup na porządek prac — wyniki ustala się pojedynczo, a karty pozostałych głosowań zabezpiecza w pakietach tymczasowych (pkt 118)"}, {"tekst": "Zaproponować komisji właściwą, pojedynczą kolejność ustalania wyników trzech głosowań.", "poprawna": false, "uzasadnienie_dystraktora": "forma polecenia/organizowania pracy — obserwator nie kieruje przebiegiem czynności komisji"}], "feedback_poprawny": "Tak. Karty ważne do Senatu i referendum zabezpiecza się w opisanych, opieczętowanych pakietach tymczasowych, a wynik ustala pojedynczo (pkt 118). Równoległe mieszanie stosów to odstępstwo — Anna je opisuje, nie organizując pracy komisji.", "feedback_niepoprawny": "Porządek prac też podlega obserwacji: równoległe ustalanie z mieszaniem stosów jest nieprawidłowe. Anna to notuje, ale nie narzuca komisji kolejności.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt118", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 118", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "obs-ustalenie-019", "rola": "obserwator", "faza": "ustalenie_wynikow", "cel_uczenia": "Rozpoznać wymóg podania wyników do publicznej wiadomości i rolę obserwatora (kompetencja: obrona jawności).", "poziom_blooma": "analiza", "typ": "wielokrotny_wybor", "kontekst": "Komisja podpisała protokół i przygotowuje się do przekazania go wyżej.", "pytanie": "Wskaż, co komisja ma zrobić dla jawności wyniku i co weryfikuje Anna.", "opcje": [{"tekst": "Wywiesić kopię protokołu w lokalu, w miejscu łatwo dostępnym dla wyborców; Anna sprawdza, czy to zrobiono.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Przekazać wynik tylko komisji wyższego stopnia; wywieszenie w lokalu nie jest wymagane.", "poprawna": false, "uzasadnienie_dystraktora": "błędna wiedza — komisja podaje wyniki do publicznej wiadomości przez wywieszenie kopii protokołu (art. 77 § 1)"}, {"tekst": "Anna sama wywiesza kopię protokołu, jeśli komisja zwleka.", "poprawna": false, "uzasadnienie_dystraktora": "wyjście z roli — czynność podania wyniku do wiadomości wykonuje komisja, nie obserwator"}], "feedback_poprawny": "Tak. Niezwłocznie po sporządzeniu protokołu komisja podaje wyniki do publicznej wiadomości, wywieszając kopię protokołu w łatwo dostępnym miejscu (art. 77 § 1). Anna weryfikuje, czy to zrobiono; nie wykonuje tej czynności za komisję.", "feedback_niepoprawny": "Jawność wyniku to nie tylko przekazanie „w górę” — wymagane jest publiczne wywieszenie kopii protokołu. Anna to sprawdza, ale sama kopii nie wywiesza.", "zrodlo": {"chunk_id": "kodeks-wyborczy:art77", "akt": "Ustawa z dnia 5 stycznia 2011 r. — Kodeks wyborczy", "jednostka": "art. 77", "stan_prawny": "2023-03-31", "wybory": null}}, {"id": "obs-ustalenie-020", "rola": "obserwator", "faza": "ustalenie_wynikow", "cel_uczenia": "Zastosować zasadę rzetelnego przekazu — tylko własne, naoczne obserwacje (kompetencja: rzetelny przekaz).", "poziom_blooma": "ocena", "typ": "scenariusz", "kontekst": "Inny obserwator mówi Annie, że „ktoś podmienił karty” — Anna sama tego nie widziała.", "pytanie": "Zdecyduj, jak Anna powinna postąpić z tą informacją.", "opcje": [{"tekst": "Zgłosić szczegółowo własne, naoczne spostrzeżenia; cudzą relację co najwyżej jako niepotwierdzoną.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Zgłosić usłyszaną od innej osoby relację jako fakt, ponieważ sam zarzut brzmi bardzo poważnie.", "poprawna": false, "uzasadnienie_dystraktora": "sankcjonowanie cudzej obserwacji — relacja z drugiej ręki może być manipulacją; przekazuje się własne, naoczne spostrzeżenia"}, {"tekst": "Nie zgłaszać w tej sprawie niczego, żeby nie ryzykować jakiejkolwiek pomyłki w raporcie.", "poprawna": false, "uzasadnienie_dystraktora": "bierność — własne, pewne spostrzeżenia należy przekazać; milczenie osłabia obronę praw wyborców"}], "feedback_poprawny": "Tak. Rzetelny przekaz opiera się na naoczności: Anna opisuje szczegółowo (kto, co, kiedy, jak) to, czego sama jest pewna, a relacji z drugiej ręki nie podaje jako własnej obserwacji. To chroni wiarygodność całej akcji obserwacyjnej.", "feedback_niepoprawny": "Znajdź środek między dwoma błędami: nie podawaj cudzej relacji jako faktu, ale też nie milcz o tym, co sama pewnie zaobserwowałaś. Podstawą jest własna naoczność.", "zrodlo": {"chunk_id": "kodeks-wyborczy:art103c", "akt": "Ustawa z dnia 5 stycznia 2011 r. — Kodeks wyborczy", "jednostka": "art. 103c", "stan_prawny": "2023-03-31", "wybory": null}}];
const SRC_QUIZ_KOM = [{"id": "kom-ustalenie-001", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Zastosować próg 2/3 pełnego składu (z zaokrągleniem w górę) przed rozpoczęciem ustalania wyników (kompetencja: kworum czynności).", "poziom_blooma": "stosowanie", "typ": "scenariusz", "kontekst": "Komisja liczy 9 osób. O 21:30 obecnych jest 5 członków, w tym przewodniczący. Część osób chce zaczynać liczenie.", "pytanie": "Zdecyduj, czy komisja może przystąpić do ustalania wyników głosowania.", "opcje": [{"tekst": "Nie — przy 9-osobowym składzie potrzeba co najmniej 6 obecnych; czekacie na kolejnego członka.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Tak — 5 osób to ponad połowa składu, a przewodniczący jest na miejscu.", "poprawna": false, "uzasadnienie_dystraktora": "myli próg połowy z progiem 2/3 pełnego składu, zaokrąglanym w górę (przy 9 osobach → 6)"}, {"tekst": "Tak — o gotowości do liczenia rozstrzyga przewodniczący, niezależnie od liczby obecnych.", "poprawna": false, "uzasadnienie_dystraktora": "przenosi wymóg kworum na decyzję jednej osoby — próg 2/3 wiąże także przewodniczącego"}], "feedback_poprawny": "Tak. Czynności ustalania wyników komisja wykonuje w składzie co najmniej 2/3 pełnego składu, w tym przewodniczący lub zastępca; ułamek zaokrągla się w górę, więc przy 9 osobach minimum to 6 (pkt 104). Kwadrans czekania jest tańszy niż podważona procedura.", "feedback_niepoprawny": "Sprawdź próg: 2/3 pełnego składu z zaokrągleniem w górę — przy 9 osobach to 6 członków, a decyzja przewodniczącego tego progu nie zastępuje (pkt 104).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt104", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 104", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-ustalenie-002", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Rozpoznać i zablokować pomysł podziału komisji na grupy robocze po zakończeniu głosowania (kompetencja: wspólność czynności).", "poziom_blooma": "stosowanie", "typ": "scenariusz", "kontekst": "Jest po północy. Doświadczony członek proponuje: „Podzielmy się — jedna grupa liczy Sejm, druga Senat, skończymy dwa razy szybciej”.", "pytanie": "Wskaż, jak reagujesz jako członek komisji.", "opcje": [{"tekst": "Zgłaszasz sprzeciw — czynności po zakończeniu głosowania komisja wykonuje wspólnie, bez grup roboczych.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Zgadzasz się, jeśli podział przegłosuje większość członków komisji.", "poprawna": false, "uzasadnienie_dystraktora": "uchwała większości nie uchyla zakazu z wytycznych — tworzenie grup roboczych jest niedopuszczalne"}, {"tekst": "Zgadzasz się, o ile obie grupy pracują przy sąsiednich stołach i widzą się nawzajem.", "poprawna": false, "uzasadnienie_dystraktora": "wspólna sala nie zmienia istoty: część kart ocenia wtedy część składu, a nie cała komisja"}], "feedback_poprawny": "Tak. Tworzenie z członków komisji grup roboczych, które wykonywałyby oddzielnie czynności po zakończeniu głosowania, jest niedopuszczalne (pkt 105). Twój spokojny sprzeciw chroni wynik przed podważeniem — to nie jest „utrudnianie pracy”.", "feedback_niepoprawny": "Ani głosowanie, ani sąsiednie stoły nie legalizują podgrup: każdy członek ma widzieć każdą kartę, a zakaz grup roboczych jest zapisany wprost (pkt 105).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt105", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 105", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-ustalenie-003", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Rozpoznać, że każdą kartę przed oceną okazuje się wszystkim obecnym członkom (kompetencja: wspólny ogląd kart).", "poziom_blooma": "rozumienie", "typ": "prawda_falsz", "kontekst": null, "pytanie": "Członek komisji może samodzielnie przejrzeć część kart, jeśli po skończeniu pokaże pozostałym wyniki swojego liczenia.", "opcje": [{"tekst": "Prawda", "poprawna": false, "uzasadnienie_dystraktora": "myli okazanie wyników z okazaniem kart — przed oceną każdą kartę okazuje się wszystkim obecnym członkom, a przeglądanie pojedynczo lub w grupach jest zakazane (pkt 106)"}, {"tekst": "Fałsz", "poprawna": true, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Fałsz — dobrze. Przed ustaleniem ważności karty i głosu każda karta jest okazywana wszystkim obecnym członkom komisji; przeglądanie kart pojedynczo przez część członków albo w odrębnych grupach jest zakazane (pkt 106).", "feedback_niepoprawny": "Pokazanie kolegom gotowego wyniku to za mało: wszyscy obecni członkowie mają widzieć każdą kartę przed jej oceną (pkt 106).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt106", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 106", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-ustalenie-004", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Wskazać właściwą organizację przeglądania kart: wspólny ogląd bez paraliżowania pracy (kompetencja: organizacja czynności).", "poziom_blooma": "rozumienie", "typ": "wielokrotny_wybor", "kontekst": null, "pytanie": "Wskaż, jak komisja organizuje przeglądanie kart podczas ustalania wyników.", "opcje": [{"tekst": "Tak, aby każdy członek widział karty i mógł dokonać ich oceny, bez opóźniania pracy komisji.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Tak, aby karty oceniał przewodniczący, a pozostali członkowie zapisywali podawane wyniki.", "poprawna": false, "uzasadnienie_dystraktora": "przenosi ocenę kart na jedną osobę — ocena to czynność wspólna całego składu"}, {"tekst": "Tak, aby każdy członek dokładnie przejrzał swój przydzielony stos kart.", "poprawna": false, "uzasadnienie_dystraktora": "to praca w podgrupach: część kart widzi wtedy część składu, wbrew zasadzie wspólnego oglądu"}], "feedback_poprawny": "Tak. Pracę organizuje się tak, by każdy członek widział karty i mógł je ocenić, a jednocześnie by nie prowadziło to do utrudniania, opóźniania ani paraliżowania pracy komisji (pkt 107). Wspólny ogląd i płynność idą w parze.", "feedback_niepoprawny": "Ocena kart nie należy do jednej osoby ani do „przydzielonych stosów” — każdy członek ma widzieć karty, a organizacja ma nie paraliżować pracy (pkt 107).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt107", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 107", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-ustalenie-005", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Wykonać kontrolę nienaruszenia pieczęci i plomb bezpośrednio przed otwarciem urny (kompetencja: zabezpieczenie materiałów).", "poziom_blooma": "stosowanie", "typ": "scenariusz", "kontekst": "Lokal zamknięty, kworum jest. Członek komisji sięga do urny: „Otwieramy i wyjmujemy?”.", "pytanie": "Zdecyduj, co komisja robi w pierwszej kolejności.", "opcje": [{"tekst": "Sprawdza, czy pieczęcie na urnie i wlocie lub jednorazowe plomby–nalepki pozostały nienaruszone, i dopiero potem otwiera urnę.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Otwiera urnę od razu — plomby były zakładane przy zamykaniu lokalu, więc kolejna kontrola dubluje pracę.", "poprawna": false, "uzasadnienie_dystraktora": "pomija wymaganą kontrolę nienaruszenia pieczęci i plomb wykonywaną bezpośrednio przed otwarciem urny (pkt 112)"}, {"tekst": "Prosi obserwatora społecznego, aby obejrzał plomby i potwierdził, że są w porządku.", "poprawna": false, "uzasadnienie_dystraktora": "przenosi czynność komisji na obserwatora — kontrola plomb to zadanie komisji, obserwator jedynie patrzy"}], "feedback_poprawny": "Tak. Komisja sprawdza, czy pieczęcie na urnie i na wlocie (lub plomby–nalepki) pozostały nienaruszone, po czym otwiera urnę i wyjmuje karty (pkt 112). Ta minuta kontroli to dowód, że nikt nie ingerował w karty.", "feedback_niepoprawny": "Kontrola plomb bezpośrednio przed otwarciem urny to osobny, wymagany krok — i wykonuje go komisja, nie obserwator (pkt 112).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt112", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 112", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-ustalenie-006", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Rozpoznać niedopuszczalność przewracania wypełnionej urny przy wyjmowaniu kart (kompetencja: staranność z materiałami).", "poziom_blooma": "rozumienie", "typ": "prawda_falsz", "kontekst": null, "pytanie": "Gdy urna jest mocno zapełniona, komisja może ją przewrócić i wysypać karty na stół, żeby przyspieszyć pracę.", "opcje": [{"tekst": "Prawda", "poprawna": false, "uzasadnienie_dystraktora": "mit „będzie szybciej” — przewracanie wypełnionej urny jest niedopuszczalne; przy pełnej urnie najpierw wyjmuje się część kart (pkt 113)"}, {"tekst": "Fałsz", "poprawna": true, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Fałsz — dobrze. Karty wyjmuje się starannie, tak by nie uszkodzić ani kart, ani urny; przewracanie wypełnionej urny jest niedopuszczalne, a przy mocno zapełnionej urnie najpierw wyjmuje się część kart (pkt 113).", "feedback_niepoprawny": "To pułapka pośpiechu: wysypanie kart grozi ich uszkodzeniem, a karty całkowicie przedarte wypadają z obliczeń. Wyjmuj karty partiami (pkt 113).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt113", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 113", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-ustalenie-007", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Wykonać właściwe postępowanie z przedmiotami innymi niż karty znalezionymi w urnie (kompetencja: rozdzielenie i odnotowanie).", "poziom_blooma": "stosowanie", "typ": "scenariusz", "kontekst": "Po otwarciu urny między kartami znajdujecie czystą kartkę papieru i ulotkę reklamową.", "pytanie": "Wskaż, co komisja robi z takim znaleziskiem.", "opcje": [{"tekst": "Oddziela je od kart do głosowania i odnotowuje ich odnalezienie we właściwych punktach protokołów.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Dolicza je do kart nieważnych, bo nie są urzędowymi kartami do głosowania.", "poprawna": false, "uzasadnienie_dystraktora": "myli przedmiot z kartą nieważną — kartka czy ulotka nie wchodzi do obliczeń w punkcie 11, tylko podlega odnotowaniu"}, {"tekst": "Usuwa je od razu z lokalu, żeby nie mieszały się z kartami podczas liczenia.", "poprawna": false, "uzasadnienie_dystraktora": "pomija obowiązek odnotowania — informację o odnalezieniu przedmiotów wpisuje się do protokołów"}], "feedback_poprawny": "Tak. Inne przedmioty (np. czyste kartki, nakładki brajlowskie) komisja oddziela od kart, a informację o ich odnalezieniu odnotowuje w punkcie 24 protokołów Sejmu i Senatu oraz w punkcie 32 protokołu referendum (pkt 114).", "feedback_niepoprawny": "Rozdziel pojęcia: kartka to przedmiot, nie karta nieważna — nie wchodzi do obliczeń, ale jej odnalezienie odnotowuje się w protokołach; usunięcie bez śladu też jest błędem (pkt 114).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt114", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 114", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}, "punkt_protokolu": "pkt 24 (Sejm/Senat) · pkt 32 (referendum)"}, {"id": "kom-ustalenie-008", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Wykonać pierwszą czynność wobec kopert na kartę do głosowania: odrębne ustalenie liczby kart z kopert (kompetencja: głosowanie korespondencyjne).", "poziom_blooma": "rozumienie", "typ": "wielokrotny_wybor", "kontekst": null, "pytanie": "Wskaż, co komisja robi w pierwszej kolejności z kopertami na kartę do głosowania znalezionymi w urnie.", "opcje": [{"tekst": "Wyjmuje z nich karty i ustala ich liczbę odrębnie dla Sejmu, Senatu i referendum, wpisując ją w punkcie 10a protokołów.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Dokłada karty z kopert do wspólnego stosu i liczy je razem ze wszystkimi kartami wyjętymi z urny.", "poprawna": false, "uzasadnienie_dystraktora": "gubi odrębne ustalenie liczby kart z kopert — punkt 10a wymaga osobnych liczb dla trzech głosowań"}, {"tekst": "Odkłada zaklejone koperty do pakietu i przekazuje je do komisji wyższego stopnia.", "poprawna": false, "uzasadnienie_dystraktora": "to karty do policzenia w obwodzie, nie depozyt do przekazania — liczby porównuje się z liczbą kopert"}], "feedback_poprawny": "Tak. W pierwszej kolejności wyjmuje się karty z kopert na kartę do głosowania i ustala ich liczbę — odrębnie w wyborach do Sejmu, do Senatu oraz w referendum — wpisując ją w punkcie 10a właściwego protokołu (pkt 115).", "feedback_niepoprawny": "Karty z głosowania korespondencyjnego liczy się w obwodzie, odrębnie dla każdego głosowania (punkt 10a), zanim trafią do dalszych obliczeń (pkt 115).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt115", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 115", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}, "punkt_protokolu": "pkt 10a"}, {"id": "kom-ustalenie-009", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Zdecydować o właściwym postępowaniu z kartą całkowicie przedartą (kompetencja: kwalifikacja kart).", "poziom_blooma": "analiza", "typ": "scenariusz", "kontekst": "Wśród kart z urny jest karta przedarta całkowicie na dwie części; obie części leżą obok siebie i widać znak „x”.", "pytanie": "Zdecyduj, co komisja robi z tą kartą.", "opcje": [{"tekst": "Wydziela ją, nie bierze pod uwagę przy obliczeniach i pakuje w opieczętowany, opisany pakiet.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Skleja obie części i liczy kartę normalnie, skoro znak „x” jest czytelny.", "poprawna": false, "uzasadnienie_dystraktora": "„ratowanie” karty — kartę całkowicie przedartą pomija się w obliczeniach niezależnie od czytelności znaku (pkt 116)"}, {"tekst": "Liczy ją jako kartę nieważną i wpisuje do punktu 11 protokołu.", "poprawna": false, "uzasadnienie_dystraktora": "myli kategorie — karta nieważna to karta nieurzędowa lub bez pieczęci; przedartej całkowicie w ogóle nie bierze się pod uwagę"}], "feedback_poprawny": "Tak. Karty całkowicie przedarte na dwie lub więcej części wydziela się i nie bierze pod uwagę przy obliczeniach, a następnie pakuje w opieczętowany i opisany pakiet (pkt 116). Nie wchodzą one ani do kart ważnych, ani do nieważnych.", "feedback_niepoprawny": "Nie sklejamy kart: całkowicie przedarta karta wypada z obliczeń — i nie jest tym samym co karta nieważna z punktu 11 (pkt 116).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt116", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 116", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-ustalenie-010", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Odróżnić kartę nieważną (pkt 11 protokołu) od głosu nieważnego (kompetencja: pojęcia protokołu).", "poziom_blooma": "analiza", "typ": "wielokrotny_wybor", "kontekst": null, "pytanie": "Wskaż kartę, którą komisja policzy jako kartę nieważną w punkcie 11 protokołu.", "opcje": [{"tekst": "Kartę nieopatrzoną pieczęcią obwodowej komisji.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Kartę ze znakiem „x” przy kandydatach z dwóch różnych list.", "poprawna": false, "uzasadnienie_dystraktora": "to głos nieważny na karcie ważnej — wytyczne wprost przestrzegają, by nie pomylić tych liczb w protokole"}, {"tekst": "Kartę z dopiskiem wyborcy na marginesie, poza kratkami.", "poprawna": false, "uzasadnienie_dystraktora": "dopiski poza kratką nie wpływają na ważność — karta i głos pozostają ważne"}], "feedback_poprawny": "Tak. Karta nieważna to karta inna niż ustalona urzędowo lub nieopatrzona pieczęcią komisji (pkt 118). Wytyczne wprost przestrzegają, by w punkcie 11 nie wpisać omyłkowo liczby głosów nieważnych — to dwie różne rzeczy.", "feedback_niepoprawny": "Rozdziel dwa poziomy: ważność karty (urzędowa karta z pieczęcią) i ważność głosu (co zaznaczono w kratkach). „X” przy dwóch listach to głos nieważny, a dopisek nie zmienia niczego (pkt 118).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt118", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 118", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}, "punkt_protokolu": "pkt 11"}, {"id": "kom-ustalenie-011", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Wpisać liczbę zero do protokołu we właściwy sposób (kompetencja: wypełnianie protokołu).", "poziom_blooma": "zapamietywanie", "typ": "prawda_falsz", "kontekst": null, "pytanie": "Jeżeli ustalona przez komisję liczba wynosi zero, właściwe kratki w protokole zostawia się puste.", "opcje": [{"tekst": "Prawda", "poprawna": false, "uzasadnienie_dystraktora": "puste pole wygląda jak przeoczenie i pozwala dopisać cyfrę — przy zerze wpisuje się „0” w ostatniej kratce z prawej strony (pkt 110)"}, {"tekst": "Fałsz", "poprawna": true, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Fałsz — dobrze. Liczby wpisuje się od prawej strony, a jeżeli ustalona liczba wynosi zero, w ostatniej kratce z prawej strony wpisuje się cyfrę „0” (pkt 110). Wypełniona kratka odróżnia „ustaliliśmy zero” od „zapomnieliśmy wpisać”.", "feedback_niepoprawny": "Puste pole to nie zero — to luka, którą ktoś może zakwestionować. Wpisz „0” w ostatniej kratce z prawej strony (pkt 110).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt110", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 110", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-ustalenie-012", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Zastosować obowiązek przejrzenia całej karty przed kwalifikacją głosu (kompetencja: metoda oceny kart).", "poziom_blooma": "stosowanie", "typ": "scenariusz", "kontekst": "Kolega z komisji przegląda karty szybko: widzi pierwszy znak „x” na liście nr 2 i od razu odkłada kartę na stos głosów ważnych.", "pytanie": "Rozpoznaj, co jest nie tak w tym sposobie pracy.", "opcje": [{"tekst": "Kartę trzeba przejrzeć w całości — dalej może być znak „x” na innej liście, a to czyni głos nieważnym.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Nic — pierwszy znak „x” przesądza, na kogo oddano głos, więc dalsze przeglądanie to strata czasu.", "poprawna": false, "uzasadnienie_dystraktora": "mit „pierwszego x” — o ważności decyduje cała karta, nie pierwszy znaleziony znak (pkt 119)"}, {"tekst": "Karty powinien przeglądać w ten sposób przewodniczący, a nie szeregowy członek komisji.", "poprawna": false, "uzasadnienie_dystraktora": "przenosi problem na hierarchię — ocena kart jest czynnością wspólną, a błąd dotyczy metody, nie stanowiska"}], "feedback_poprawny": "Tak. Komisja jest obowiązana przejrzeć całą kartę, a nie poprzestać na miejscu pierwszego znaku „x” — znak przy kandydatach na więcej niż jednej liście powoduje nieważność głosu (pkt 119). Pełne przejrzenie każdej karty to najtańsza ochrona przed błędnym wynikiem.", "feedback_niepoprawny": "Pierwszy znak „x” niczego nie przesądza: dopiero cała karta pokazuje, czy głos jest ważny. To kwestia metody, nie stanowiska w komisji (pkt 119).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt119", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 119", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-ustalenie-013", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Rozpoznać definicję znaku „x” i to, że wątpliwości rozstrzyga komisja (kompetencja: ocena znaku).", "poziom_blooma": "rozumienie", "typ": "wielokrotny_wybor", "kontekst": null, "pytanie": "Wskaż, jak wytyczne definiują znak „x” w kratce i kto rozstrzyga przypadki wątpliwe.", "opcje": [{"tekst": "Co najmniej dwie linie przecinające się w obrębie kratki; wątpliwości rozstrzyga komisja.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Dwie proste linie tworzące symetryczny krzyżyk; wątpliwości rozstrzyga przewodniczący.", "poprawna": false, "uzasadnienie_dystraktora": "zawęża definicję do „idealnego krzyżyka” i oddaje rozstrzygnięcie jednej osobie zamiast komisji"}, {"tekst": "Dowolny znak wyrażający wolę wyborcy; wątpliwości rozstrzyga mąż zaufania.", "poprawna": false, "uzasadnienie_dystraktora": "rozszerza definicję poza znak „x” i oddaje decyzję osobie, która nie ocenia kart"}], "feedback_poprawny": "Tak. Znakiem „x” są co najmniej dwie linie, które przecinają się w obrębie kratki; ustalenie, czy znak jest znakiem „x” i czy stoi w kratce, należy do komisji (pkt 119). Znak nie musi być „ładny” — musi się przecinać w kratce.", "feedback_niepoprawny": "Definicja jest szeroka (co najmniej dwie przecinające się linie), a rozstrzyganie wątpliwości należy do komisji jako całości — nie do przewodniczącego ani męża zaufania (pkt 119).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt119", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 119", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-ustalenie-014", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Rozpoznać, że znaki poza kratką traktuje się jako dopiski bez wpływu na ważność głosu (kompetencja: ocena znaku).", "poziom_blooma": "rozumienie", "typ": "prawda_falsz", "kontekst": null, "pytanie": "Znak „x” postawiony przez wyborcę poza kratką unieważnia głos na tej karcie.", "opcje": [{"tekst": "Prawda", "poprawna": false, "uzasadnienie_dystraktora": "myli dopisek z głosem — znaki poza kratką, w tym znak „x”, traktuje się jako dopiski, które nie wpływają na ważność głosu (pkt 119)"}, {"tekst": "Fałsz", "poprawna": true, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Fałsz — dobrze. Wszelkie znaki, wykreślenia i przekreślenia poza kratką — także znak „x” — traktuje się jako dopiski, które nie wpływają na ważność głosu (pkt 119). Liczy się to, co w kratkach.", "feedback_niepoprawny": "W wyborach o ważności głosu decydują znaki w kratkach; to, co poza nimi, jest dopiskiem. Uwaga: w referendum reguły dla znaków w obrębie kratki są surowsze (pkt 119, por. pkt 143).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt119", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 119", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-ustalenie-015", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Zakwalifikować głos ze znakiem „x” przy dwóch kandydatach z tej samej listy (kompetencja: kwalifikacja głosu, Sejm).", "poziom_blooma": "analiza", "typ": "scenariusz", "kontekst": "Na karcie do Sejmu wyborca postawił znak „x” przy dwóch kandydatach z tej samej listy: przy pozycji 3 i przy pozycji 7.", "pytanie": "Zdecyduj, jak komisja kwalifikuje ten głos.", "opcje": [{"tekst": "Głos ważny, oddany na kandydata z pozycji 3 — tego, którego nazwisko jest wyżej na liście.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Głos nieważny, bo znak „x” postawiono przy więcej niż jednym kandydacie.", "poprawna": false, "uzasadnienie_dystraktora": "przenosi regułę różnych list na jedną listę — w obrębie jednej listy głos pozostaje ważny (pkt 120)"}, {"tekst": "Głos ważny na listę, ale bez wskazania pierwszeństwa któregokolwiek kandydata.", "poprawna": false, "uzasadnienie_dystraktora": "myli z przypadkiem „x” wyłącznie przy sk
