/* ================= RECENZJA ================= */
function dz(id){
  const d=sess().decisions[id];
  const b=(val,cls,lab,sub)=>'<button class="dbtn '+cls+(d.decyzja===val?' on':'')+'" onclick="setDecision(\''+id+'\',\''+val+'\')"><span>'+lab+'</span><small>'+sub+'</small></button>';
  let note="";
  if(d.decyzja==="POPRAW") note=noteBox(id,"Jakie poprawki i czego dotyczą?",true,d.uwagi);
  else if(d.decyzja==="USUN") note=noteBox(id,"Dlaczego pozycja się nie nadaje?",true,d.uwagi);
  else if(d.decyzja==="TAK") note=noteBox(id,"Notatka (opcjonalnie)",false,d.uwagi);
  const meta=d.decyzja? '<div class="meta-line">Decyzja: '+DLAB[d.decyzja]+' · owner: '+esc(state.ekspert)+' · '+esc(d.data)+'</div>':'';
  return '<div class="decision"><div class="decision-label">Decyzja recenzenta ('+esc(state.ekspert)+')</div><div class="dbtns">'+
    b("TAK","tak","TAK","może wejść do banku treści")+
    b("POPRAW","popraw","POPRAW","drobne poprawki")+
    b("USUN","usun","USUŃ","nie nadaje się")+
    '</div>'+note+meta+'</div>';
}
function noteBox(id,label,req,val){
  return '<div class="note" id="note-'+id+'"><label class="'+(req?'req':'')+'">'+label+'</label>'+
    '<textarea oninput="setUwagi(\''+id+'\',this.value)" placeholder="'+(req?'Wpisz treść — trafi do eksportu i do zespołu poprawek…':'Opcjonalna notatka do zatwierdzenia…')+'">'+esc(val)+'</textarea>'+
    '<div class="hint">Ta decyzja wymaga uzasadnienia przed publikacją.</div></div>';
}
function cardQuiz(p){
  const d=sess().decisions[p.id];
  const decClass=d.decyzja?" d-"+d.decyzja:"";
  const stamp=d.decyzja?'<span class="stamp '+d.decyzja+'">'+DLAB[d.decyzja]+'</span>':'';
  const ctx=p.kontekst?'<div class="ctx"><span>Kontekst</span><p>'+esc(p.kontekst)+'</p></div>':'';
  const opts=p.opcje.map(o=>{
    const why=(!o.poprawna && o.uzasadnienie_dystraktora)?'<span class="why"><b>dystraktor celuje:</b> '+esc(o.uzasadnienie_dystraktora)+'</span>':'';
    return '<li class="opt'+(o.poprawna?' correct':'')+'"><span class="opt-mark">'+(o.poprawna?'&#10004;':'&#9675;')+'</span>'+esc(o.tekst)+why+'</li>';
  }).join("");
  const z=p.zrodlo;
  const src='<div class="src">Źródło: '+esc(z.akt)+' — '+esc(z.jednostka)+' <span class="ver">(stan prawny '+esc(z.stan_prawny)+' · '+esc(z.chunk_id)+')</span></div>';
  return '<div class="card'+decClass+'" id="card-'+p.id+'">'+
    '<div class="card-head"><span class="id">'+esc(p.id)+'</span>'+
      '<span class="tag">'+esc(TYP[p.typ]||p.typ)+'</span>'+
      '<span class="tag bloom">Bloom: '+esc(p.poziom_blooma)+'</span>'+
      '<span class="tag">rola: '+esc(p.rola)+'</span>'+stamp+'</div>'+
    '<div class="cel">Cel: '+esc(p.cel_uczenia)+'</div>'+ctx+
    '<div class="q">'+esc(p.pytanie)+'</div>'+
    '<ul class="opts">'+opts+'</ul>'+
    '<details class="fb"><summary>Feedback dla ucznia</summary>'+
      '<div class="fb-row"><b>Poprawnie</b>'+esc(p.feedback_poprawny)+'</div>'+
      '<div class="fb-row"><b>Błędnie</b>'+esc(p.feedback_niepoprawny)+'</div></details>'+
    src+dz(p.id)+'</div>';
}
function cardLista(p){
  const d=sess().decisions[p.id];
  const decClass=d.decyzja?" d-"+d.decyzja:"";
  const stamp=d.decyzja?'<span class="stamp '+d.decyzja+'">'+DLAB[d.decyzja]+'</span>':'';
  return '<div class="card'+decClass+'" id="card-'+p.id+'">'+
    '<div class="card-head"><span class="id">'+esc(p.id)+'</span>'+
      '<span class="tag">zadanie listy kontrolnej</span>'+

      '<span class="tag">lista wspólna dla obu ról</span>'+stamp+'</div>'+
    '<div class="q">&#9744; '+esc(p.nazwa)+'</div>'+
    '<div class="prawo">Prawo: '+esc(p.prawo)+'</div>'+
    '<div class="desc">'+descHtml(p.opis)+'</div>'+
    '<div class="src">Źródło: '+esc((LISTA_BY[sess().etap]||LISTA).meta.zrodlo)+'</div>'+
    dz(p.id)+'</div>';

function rRecenzja(){
  if(!sess()) return '<p class="screen-sub" style="margin-top:30px">Brak aktywnej propozycji do recenzji. Wróć do kroku 3 i wygeneruj wsad.</p>';
  const s=sess(); const c=counts();
  const qm = QMETA[s.rola];
  const meta = s.material==="quiz"
    ? {tytul:qm.tytul, zrodlo:"Źródło prawa: <b>"+esc(qm.akt)+"</b><br>Stan prawny: <b>"+esc(qm.stan_prawny)+"</b> · Wybory: "+esc(qm.wybory)}
    : {tytul:(LISTA_BY[s.etap]||LISTA).meta.tytul, zrodlo:"Źródło: <b>"+esc((LISTA_BY[s.etap]||LISTA).meta.zrodlo)+"</b><br>Otwarcie etapu: "+esc((LISTA_BY[s.etap]||LISTA).meta.otwarcie)};
  const chip=(f,lab,n,cls)=>'<button class="chip '+(cls||'')+'" aria-pressed="'+(state.rFilter===f)+'" onclick="setFilter(\''+f+'\')">'+lab+' <span class="n">'+n+'</span></button>';
  const chips='<div class="chips">'+
    chip("all","Wszystkie",s.items.length)+chip("none","Nieocenione",c.none)+
    chip("TAK","TAK",c.TAK,"tak")+chip("POPRAW","POPRAW",c.POPRAW,"popraw")+chip("USUN","USUŃ",c.USUN,"usun")+'</div>';
  const list=s.items.filter(p=>{const d=s.decisions[p.id].decyzja;
    if(state.rFilter==="all")return true; if(state.rFilter==="none")return !d; return d===state.rFilter;});
  const body=list.length? list.map(p=>s.material==="quiz"?cardQuiz(p):cardLista(p)).join("")
    : '<div class="b-empty" style="text-align:center;padding:34px">Brak pozycji w tym filtrze.</div>';
  const done=s.items.length-c.none;
  return '<p class="screen-eyebrow">Krok 4 · Arkusz recenzji — kontrola jakości (bramka ludzka)</p>'+
    '<h2 class="screen-title">'+esc(meta.tytul)+'</h2>'+
    '<div class="source">'+meta.zrodlo+'</div>'+
    '<div class="infobox"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>'+
    '<span><b>Dowodem wykonania recenzji nie jest ten arkusz, lecz zapis do akceptacji eksperta:</b> po zatwierdzeniu materiały zapisują się jako pliki CSV o nazwie <i>{ekspert}_Bank Materiałów_{zatwierdzone / do poprawy / do usunięcia}_{etap}_{odbiorca}_{data}</i> — osobno lista zatwierdzonych, osobno do poprawy (z notatkami, do ponownej poprawy w AI) i osobno do usunięcia.</span></div>'+
    '<div class="progress">Ocenione: <b>'+done+' / '+s.items.length+'</b> &nbsp;·&nbsp; TAK '+c.TAK+' · POPRAW '+c.POPRAW+' · USUŃ '+c.USUN+'</div>'+
    '<div class="pdots">'+s.items.map(function(p){const d=s.decisions[p.id].decyzja; return '<button class="pdot '+(d||'')+'" title="'+esc(p.id)+(d?' · '+DLAB[d]:' · nieocenione')+'" onclick="pdotGo(\''+p.id+'\')"></button>';}).join('')+'</div>'+
    chips+body;
}

function bTitle(b){ return b.typ==="quiz"? b.payload.pytanie : b.payload.nazwa; }
function setBankRola(v){ state.bankRola=(state.bankRola===v?"all":v); render(); }
function setBankStatus(v){ state.bankStatus=(state.bankStatus===v?"all":v); render(); }
function rBank(){
  const pass=b=>(state.bankRola==="all"||b.rola===state.bankRola)&&(state.bankStatus==="all"||b.status===state.bankStatus);
  const chipR=(v,lab)=>'<button class="chip" aria-pressed="'+(state.bankRola===v)+'" onclick="setBankRola(\''+v+'\')">'+lab+'</button>';
  const chipS=(v,lab,cls)=>'<button class="chip '+(cls||'')+'" aria-pressed="'+(state.bankStatus===v)+'" onclick="setBankStatus(\''+v+'\')">'+lab+'</button>';
  const filters='<div class="chips">'+chipR("komisja","Członkowie komisji")+chipR("obserwator","Obserwatorzy")+
    '<span style="width:8px"></span>'+
    chipS("opublikowane","opublikowane","tak")+chipS("do_poprawek","do poprawek","popraw")+chipS("wykluczone","wykluczone","usun")+chipS("archiwalne","archiwalne")+'</div>';
  const secs=ETAPY.map(e=>{
    const items=state.bank.filter(b=>b.etap===e.k && pass(b));
    const blN=state.backlog.filter(x=>x.etap===e.k).length;
    let body="";
    if(items.length){
      ["komisja","obserwator"].forEach(r=>{
        const ri=items.filter(b=>b.rola===r);
        if(ri.length){
          body+='<div class="role-h">'+esc(ROLE[r])+'</div>'+ri.map(b=>
            '<div class="b-item"><div class="b-row"><span class="schip '+b.status+'">'+SLAB[b.status]+'</span>'+
            '<span class="id">'+esc(b.id)+'</span>'+((b.tagi&&b.tagi.length? b.tagi:[MAT[b.typ]]).map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join(''))+'</div>'+
            '<div class="b-title">'+esc(bTitle(b))+'</div>'+
            (b.uwagi?'<div class="b-uwagi">uwagi recenzenta: '+esc(b.uwagi)+'</div>':'')+
            '<div class="b-meta">wersja '+esc(b.wersja)+' · obowiązuje od '+esc(b.data)+' · owner: '+esc(b.owner)+'</div></div>').join("");
        }
      });
    } else {
      body='<div class="b-empty">— brak materiałów w banku'+(blN?' · w backlogu: '+blN+' zgłoszenie(a)':'')+' —</div>';
    }
    const total=state.bank.filter(b=>b.etap===e.k).length;
    return '<div class="bank-sec"><div class="bank-head"><span class="bk">'+e.k+')</span><h3>'+esc(e.t)+'</h3><span class="cn">'+total+' pozycji</span></div>'+
      '<div class="bank-body">'+body+'</div></div>';
  }).join("");
  const backlog=state.backlog.length?
    '<div class="backlog-sec"><h3>Backlog — zgłoszenia poza pilotażem (do decyzji ownera FOP)</h3>'+
    state.backlog.map(x=>'<div class="b-item"><div class="b-row"><span class="schip do_poprawek">backlog</span>'+
      '<span class="tag">'+esc(etapLabel(x.etap))+'</span><span class="tag">'+esc(ROLE[x.rola])+'</span><span class="tag">'+esc(MAT[x.material])+'</span></div>'+
      '<div class="b-meta">zgłoszono '+esc(x.data)+' · '+esc(x.zglosil)+' · status: '+esc(x.status)+'</div></div>').join("")+'</div>' : "";
  return '<p class="screen-eyebrow">Bank treści · jedna baza dla obu ról</p>'+
    '<h2 class="screen-title">Bank materiałów — posegregowany po etapach i odbiorcach</h2>'+
    '<p class="screen-sub">Bank uzupełnia się po zatwierdzeniu recenzji. W pilotażu treści istnieją dla obu ról: etapy A, B i F — listy kontrolne (wspólne) oraz etap H — pytania do quizów (20 pozycji na rolę). Nowa publikacja tej samej ścieżki archiwizuje poprzednią wersję.</p>'+
    '<div class="next-row" style="margin:0 0 14px"><button class="btn" onclick="downloadPub(\'bank\')">Zapisz bazę zaakceptowanych pytań (HTML)</button></div>'+
    filters+secs+backlog;
}

/* ================= EKSPORT ================= */
function buildExport(){
  return {
    prototyp:"Materiały edukacyjne FOP — silnik generacji i aktualizacji treści mikrolearningu (prototyp klikalny)",
    data_eksportu: today(), recenzent: state.ekspert||null,
    zrodla_prawa:{wytyczne:"Uchwała PKW 211/2023 · stan 2023-09-25", kodeks:"Kodeks wyborczy · stan 2023-03-31", wybory:"Sejm/Senat/referendum 15.10.2023 (dane pilotażowe)"},
    regula_bramki:"AI proponuje wsad → recenzja FOP (obowiązkowa) → publikacja z wersją, datą obowiązywania i ownerem. Do banku trafiają wyłącznie pozycje TAK.",
    zakres_pilotazu:"obie role × etapy A, B, F × lista kontrolna (wspólne listy) · obie role × etap H × pytania do quizów (po 20)",
    bank: state.bank.map(b=>({id:b.id,rola:b.rola,etap:b.etap,typ:b.typ,tagi:b.tagi||[],status:b.status,wersja:b.wersja,
      data_obowiazywania:b.data,owner:b.owner,uwagi:b.uwagi,tytul:bTitle(b),
      zrodlo:(b.typ==="quiz"? (b.payload.zrodlo? b.payload.zrodlo.akt+" — "+b.payload.zrodlo.jednostka+" (stan "+b.payload.zrodlo.stan_prawny+")" : null) : b.payload.prawo)})),
    backlog: state.backlog
  };
}
function openExport(){ document.getElementById("json-out").value=JSON.stringify(buildExport(),null,2);
  document.getElementById("modal").classList.add("open"); }
function closeExport(){ document.getElementById("modal").classList.remove("open"); }
function downloadJSON(){
  const blob=new Blob([JSON.stringify(buildExport(),null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="materialy-fop-"+today()+".json";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  toast("Pobrano plik audytu");
}
function copyJSON(){ const ta=document.getElementById("json-out"); ta.select();
  try{ navigator.clipboard.writeText(ta.value); }catch(e){ document.execCommand("copy"); } toast("Skopiowano do schowka"); }

/* ================= RENDER ================= */
function render(){
  renderTopbar();
  const app=document.getElementById("app");
  switch(state.screen){
    case "start": app.innerHTML=rStart(); break;
    case "odbiorca": app.innerHTML=rOdbiorca(); break;
    case "etap": app.innerHTML=rEtap(); break;
    case "generacja": app.innerHTML=rGeneracja(); break;
    case "fallback": app.innerHTML=rFallback(); break;
    case "recenzja": app.innerHTML=rRecenzja(); break;
    case "bank": app.innerHTML=rBank(); break;
  }
}
render();
</script>
