reślonym kandydacie — tu pierwszeństwo ma kandydat wyżej umieszczony"}], "feedback_poprawny": "Tak. Znak „x” przy dwóch lub więcej kandydatach z jednej listy daje głos ważny, oddany na tego z nich, którego nazwisko jest umieszczone wyżej na liście (pkt 120). Nieważność powstaje dopiero przy znakach na różnych listach.", "feedback_niepoprawny": "Kluczowe rozróżnienie: dwa „x” na jednej liście → głos ważny (liczy się kandydat wyżej); „x” na dwóch różnych listach → głos nieważny (pkt 120–121).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt120", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 120", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-ustalenie-016", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Wskazać przypadek głosu nieważnego w wyborach do Sejmu (kompetencja: kwalifikacja głosu, Sejm).", "poziom_blooma": "analiza", "typ": "wielokrotny_wybor", "kontekst": null, "pytanie": "Wskaż kartę, na której głos w wyborach do Sejmu jest nieważny.", "opcje": [{"tekst": "Znak „x” przy nazwiskach kandydatów z dwóch różnych list.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Znak „x” przy dwóch kandydatach z tej samej listy.", "poprawna": false, "uzasadnienie_dystraktora": "w obrębie jednej listy głos jest ważny — liczy się kandydat umieszczony wyżej (pkt 120)"}, {"tekst": "Znak „x” w kratce oraz hasło dopisane obok, poza kratkami.", "poprawna": false, "uzasadnienie_dystraktora": "dopiski poza kratką nie wpływają na ważność głosu (pkt 119)"}], "feedback_poprawny": "Tak. Głos jest nieważny, gdy znak „x” postawiono przy kandydatach z dwóch lub większej liczby różnych list, gdy nie postawiono go przy nikim albo gdy stoi wyłącznie przy liście, której rejestrację unieważniono (pkt 121).", "feedback_niepoprawny": "Dwa „x” w obrębie jednej listy i dopiski nie unieważniają głosu. Nieważność powstaje przy znakach na różnych listach, przy pustej karcie lub przy liście unieważnionej (pkt 120–121).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt121", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 121", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-ustalenie-017", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Ocenić właściwą reakcję na niezgodność sumy głosów z liczbą kart ważnych (kompetencja: kontrola sum protokołu).", "poziom_blooma": "ocena", "typ": "scenariusz", "kontekst": "Suma głosów nieważnych (pkt 13) i ważnych (pkt 14) jest o 2 mniejsza niż liczba kart ważnych (pkt 12). Jest 2:40 w nocy i część komisji chce po prostu wpisać liczby.", "pytanie": "Zdecyduj, co komisja powinna zrobić.", "opcje": [{"tekst": "Poszukać przyczyny błędu, sprostować obliczenia i dopiero właściwe liczby wpisać do protokołu.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Wpisać liczby mimo rozbieżności i opisać różnicę w uwagach protokołu.", "poprawna": false, "uzasadnienie_dystraktora": "uwagi nie zastępują zgodności — te liczby muszą być równe, a rozbieżność wymaga sprostowania obliczeń (pkt 123)"}, {"tekst": "Powiększyć liczbę głosów ważnych o 2, tak aby suma zgodziła się z liczbą kart.", "poprawna": false, "uzasadnienie_dystraktora": "„domykanie” wyniku — dopisanie liczby bez przeliczenia fałszuje obliczenia zamiast je prostować"}], "feedback_poprawny": "Tak. Suma punktów 13 i 14 musi równać się liczbie z punktu 12; przy rozbieżności komisja szuka przyczyny błędu i po sprostowaniu obliczeń wpisuje właściwe liczby (pkt 123). Zmęczenie o 2:40 jest realne — ale protokół z niezgodną sumą i tak wróci do poprawy.", "feedback_niepoprawny": "Ani uwagi, ani „dopisanie dwóch głosów” nie rozwiązują problemu: liczby muszą być równe, a droga prowadzi przez znalezienie błędu i ponowne obliczenie (pkt 123).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt123", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 123", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}, "punkt_protokolu": "pkt 12–14"}, {"id": "kom-ustalenie-018", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Wykonać właściwą kolejność: kontrola pakietu Senatu po zakończeniu obliczeń dla Sejmu (kompetencja: porządek trzech głosowań).", "poziom_blooma": "rozumienie", "typ": "wielokrotny_wybor", "kontekst": null, "pytanie": "Komisja zakończyła obliczenia dla wyborów do Sejmu. Wskaż następny krok.", "opcje": [{"tekst": "Sprawdza, czy pakiet z kartami ważnymi do Senatu nie został naruszony, i przystępuje do ustalania wyników do Senatu.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Ustala równolegle wyniki do Senatu i referendum, żeby nadrobić czas.", "poprawna": false, "uzasadnienie_dystraktora": "równoległe liczenie to praca w podgrupach — wyniki trzech głosowań ustala się po kolei (pkt 125)"}, {"tekst": "Wprowadza dane sejmowe do systemu informatycznego, zanim zajmie się kolejnymi głosowaniami.", "poprawna": false, "uzasadnienie_dystraktora": "myli kolejność — dane wprowadza się po sporządzeniu protokołu, nie między głosowaniami"}], "feedback_poprawny": "Tak. Po wykonaniu czynności dla Sejmu komisja sprawdza, czy pakiet z kartami ważnymi do Senatu nie został naruszony, i przystępuje do ustalania wyników głosowania na kandydatów na senatora; analogicznie potem dla referendum (pkt 125).", "feedback_niepoprawny": "Wyniki trzech głosowań ustala się po kolei, nie równolegle, a dane do systemu to etap po sporządzeniu protokołu. Najpierw kontrola pakietu Senatu (pkt 125).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt125", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 125", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-ustalenie-019", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Zakwalifikować głos do Senatu ze znakiem przy kandydacie skreślonym i innym kandydacie (kompetencja: kwalifikacja głosu, Senat).", "poziom_blooma": "rozumienie", "typ": "prawda_falsz", "kontekst": null, "pytanie": "Na karcie do Senatu wyborca postawił znak „x” przy kandydacie skreślonym i przy innym kandydacie. Taki głos jest nieważny.", "opcje": [{"tekst": "Prawda", "poprawna": false, "uzasadnienie_dystraktora": "zbyt pochopna nieważność — taki głos jest ważny i zalicza się go kandydatowi, którego nazwisko nie zostało skreślone (pkt 128)"}, {"tekst": "Fałsz", "poprawna": true, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Fałsz — dobrze. Jeżeli wyborca postawił znak „x” przy nazwisku kandydata skreślonego oraz przy nazwisku innego kandydata, głos jest ważny i zaliczany kandydatowi nieskreślonemu (pkt 128).", "feedback_niepoprawny": "Zanim uznasz głos za nieważny, sprawdź reguły ratujące jego ważność: przy skreślonym i innym kandydacie głos liczy się nieskreślonemu (pkt 128).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt128", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 128", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-ustalenie-020", "rola": "czlonek_komisji", "faza": "ustalenie_wynikow", "cel_uczenia": "Ocenić głos referendalny z zamazaną kratką — reguła surowsza niż w wyborach (kompetencja: kwalifikacja głosu, referendum).", "poziom_blooma": "ocena", "typ": "scenariusz", "kontekst": "Na karcie referendalnej przy pierwszym pytaniu wyborca zamazał długopisem kratkę „TAK”, a następnie postawił wyraźny znak „x” w kratce „NIE”.", "pytanie": "Oceń, jak komisja kwalifikuje głos w zakresie tego pytania.", "opcje": [{"tekst": "Głos nieważny przy tym pytaniu — w referendum zamazanie kratki powoduje nieważność głosu.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Głos ważny na „NIE” — intencja wyborcy jest czytelna, a zamazanie traktuje się jak dopisek.", "poprawna": false, "uzasadnienie_dystraktora": "przenosi łagodniejszą regułę wyborów na referendum — w referendum znaki graficzne w obrębie kratki, w tym zamazania, powodują nieważność głosu przy danym pytaniu (pkt 143)"}, {"tekst": "Kartę pomija się w obliczeniach dla tego pytania, jak kartę uszkodzoną.", "poprawna": false, "uzasadnienie_dystraktora": "myli głos nieważny z kartą pomijaną — pomija się karty całkowicie przedarte; karta z nieważnym głosem zostaje w obliczeniach"}], "feedback_poprawny": "Tak. W referendum znaki graficzne naniesione w obrębie kratki — w szczególności zamazanie kratki czy przekreślenie znaku — powodują nieważność głosu w zakresie danego pytania; wytyczne podkreślają, że ta reguła różni się od reguł w wyborach (pkt 143). Nieważność dotyczy tego pytania, nie całej karty.", "feedback_niepoprawny": "To najczęstsza pułapka referendalna: reguła „dopisków” z wyborów nie działa wewnątrz kratki referendalnej. Zamazana kratka unieważnia głos przy tym pytaniu, ale karta zostaje w obliczeniach (pkt 143).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt143", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 143", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}];
const LISTA = {"meta": {"tytul": "Zamknięcie lokalu wyborczego — lista kontrolna zadań komisji (wspólna dla obu ról)", "otwarcie": "Gdy na zegarze wybije godzina 21:00 lub ostatni wyborcy z kolejki oddadzą swój głos, kończy się głosowanie.", "zrodlo": "„Lista głównych zadań komisji w celu ustalenia wyniku głosowania”, FOP, wersja 1.0, październik 2023 · Wytyczne PKW 211/2023 (stan 2023-09-25)"}, "items": [{"id": "kom-F-001", "nazwa": "Zamyka drzwi wejściowe", "prawo": "Wytyczne, Rozdział V, pkt 97", "opis": "Kiedy przewodniczący zarządzi zakończenie głosowania, komisja zamyka drzwi wejściowe."}, {"id": "kom-F-002", "nazwa": "Sprawdza kworum", "prawo": "Wytyczne, Rozdział V, pkt 99, pkt 104", "opis": "Po zakończeniu głosowania komisja sprawdza, czy liczba obecnych członków to co najmniej 2/3 jej pełnego składu, w tym przewodniczący lub jego zastępca."}, {"id": "kom-F-003", "nazwa": "Sprawdza, czy w lokalu nie znajdują się osoby nieuprawnione", "prawo": "Wytyczne, Rozdział V, pkt 99, pkt 100", "opis": "Komisja sprawdza, czy oprócz członków komisji w lokalu nie przebywają inne osoby niż:\n- mężowie zaufania,\n- obserwatorzy społeczni,\n- obserwatorzy międzynarodowi,\n- obsługa informatyczna (jeśli jest zapewniona).\nJedynie w czasie otwierania urny i wyjmowania z niej kart dopuszczalna jest obecność w lokalu dziennikarzy."}, {"id": "kom-F-004", "nazwa": "Zapieczętowuje wlot urny", "prawo": "Wytyczne, Rozdział V, pkt 101", "opis": "Przewodniczący komisji zapieczętowuje otwór urny wyborczej:\n- zaklejając go paskiem papieru, na którym stawia się pieczęć komisji oraz na którym podpisują się obecni członkowie komisji,\n- naklejając jednorazowe plomby — nalepki foliowe opatrzone unikatowym numerem; nalepkę stempluje się pieczęcią komisji, a jej numer wpisuje się do protokołu wewnętrznego."}]};

/* ===== Rejestr treści pilotażu — jedyne źródło prawdy o zakresie ===== */
const LISTY = {
  "A": {"meta": {"tytul": "Otwarcie lokalu wyborczego — lista kontrolna zadań komisji (wspólna dla obu ról)", "otwarcie": "Komisja zbiera się w lokalu wyborczym na tyle wcześnie, aby wykonać wszystkie czynności przygotowania głosowania, lecz nie później niż o godzinie 6:00.", "zrodlo": "Propozycja silnika wg szablonu FOP · Wytyczne PKW 211/2023 (stan 2023-09-25), Rozdział III–IV — do recenzji FOP"}, "items": [{"id": "kom-A-001", "nazwa": "Zbiera się w lokalu nie później niż o 6:00", "prawo": "Wytyczne, Rozdział III, pkt 38", "opis": "Komisja zbiera się na tyle wcześnie, aby wykonać wszystkie czynności związane z przygotowaniem głosowania, lecz nie później niż o godzinie 6:00."}, {"id": "kom-A-002", "nazwa": "Sprawdza dostarczone dokumenty i swoją pieczęć", "prawo": "Wytyczne, Rozdział III, pkt 39 ppkt 1", "opis": "Komisja sprawdza dostarczone jej dokumenty oraz swoją pieczęć."}, {"id": "kom-A-003", "nazwa": "Ponownie przelicza karty do głosowania", "prawo": "Wytyczne, Rozdział III, pkt 39 ppkt 2", "opis": "Komisja przelicza karty odrębnie:\n- w wyborach do Sejmu,\n- w wyborach do Senatu,\n- w referendum.\nUstalone liczby wpisuje w punkcie 1 każdego z trzech protokołów głosowania. Tylko staranne wykonanie tej czynności umożliwi rozliczenie kart po zakończeniu głosowania."}, {"id": "kom-A-004", "nazwa": "Ostemplowuje karty do głosowania pieczęcią komisji", "prawo": "Wytyczne, Rozdział III, pkt 39 ppkt 3", "opis": "Zaleca się ostemplowanie wszystkich kart przed otwarciem lokalu (przed 7:00). Jeśli to niemożliwe — komisja kontynuuje stemplowanie po 7:00, wydając przybyłym wyborcom karty już ostemplowane. Przed stemplowaniem ponownie sprawdza, czy pieczęć jest właściwa; po zakończeniu zabezpiecza karty i pieczęć."}, {"id": "kom-A-005", "nazwa": "Rozkłada spis wyborców z osłoną oraz karty", "prawo": "Wytyczne, Rozdział III, pkt 39 ppkt 4", "opis": "Komisja rozkłada spis wyborców wraz z osłoną oraz karty do głosowania w sposób ułatwiający prowadzenie głosowania."}, {"id": "kom-A-006", "nazwa": "Sprawdza obwieszczenia i brak materiałów agitacyjnych", "prawo": "Wytyczne, Rozdział III, pkt 39 ppkt 5, ppkt 6", "opis": "Komisja sprawdza, czy:\n- urzędowe obwieszczenia i informacje są wywieszone w widocznym miejscu, także na wysokości umożliwiającej odczytanie z wózka inwalidzkiego,\n- w lokalu oraz wewnątrz i na zewnątrz budynku nie ma materiałów agitacyjnych (plakaty, ulotki, napisy) — jeśli są, usuwa je, a w razie potrzeby prosi o pomoc wójta i informuje urzędnika wyborczego.\nKontrolę materiałów agitacyjnych prowadzi także w toku głosowania."}, {"id": "kom-A-007", "nazwa": "Sprawdza, czy urna jest pusta, zamyka ją i opieczętowuje", "prawo": "Wytyczne, Rozdział III, pkt 39 ppkt 7", "opis": "Jeżeli komisja otrzymała jednorazowe plomby — nalepki foliowe z unikatowym numerem — zabezpiecza nimi urnę, a numery nalepek niezwłocznie wpisuje do protokołu wewnętrznego. Nalepki opatruje się pieczęcią komisji. Urna ma stać tak, by przez cały czas głosowania była widoczna dla członków komisji, mężów zaufania oraz obserwatorów społecznych i międzynarodowych."}, {"id": "kom-A-008", "nazwa": "Wyznacza członka komisji czuwającego przy urnie", "prawo": "Wytyczne, Rozdział III, pkt 40", "opis": "Przewodniczący obowiązkowo wyznacza członka komisji, który — przebywając w bezpośredniej bliskości urny — zapewnia jej nienaruszalność oraz tajność głosowania (wyborcy wrzucają karty tak, aby strona zadrukowana była niewidoczna)."}, {"id": "kom-A-009", "nazwa": "O godzinie 7:00 otwiera lokal", "prawo": "Wytyczne, Rozdział IV, pkt 42", "opis": "Od rozpoczęcia do zakończenia głosowania komisja pracuje w składzie nie mniejszym niż 1/2 pełnego składu, w tym przewodniczący lub jego zastępca. Wymóg oznacza stałe przebywanie takiej liczby członków w pomieszczeniu, w którym znajduje się urna."}]},
  "B": {"meta": {"tytul": "Obsługa wyborcy w lokalu — lista kontrolna zadań komisji (wspólna dla obu ról)", "otwarcie": "Wyborca wchodzi do lokalu i podchodzi do stołu komisji. Zanim otrzyma karty, komisja wykonuje czynności sprawdzające.", "zrodlo": "Propozycja silnika wg szablonu FOP · Wytyczne PKW 211/2023 (stan 2023-09-25), Rozdział IV — do recenzji FOP"}, "items": [{"id": "kom-B-001", "nazwa": "Sprawdza tożsamość wyborcy", "prawo": "Wytyczne, Rozdział IV, pkt 45 ppkt 1", "opis": "Na podstawie dowodu osobistego lub każdego innego dokumentu ze zdjęciem (np. paszport, prawo jazdy, legitymacja studencka) — także takiego, który utracił ważność — pod warunkiem że ustalenie tożsamości nie budzi wątpliwości. Komisja może potwierdzić tożsamość również w aplikacji mObywatel."}, {"id": "kom-B-002", "nazwa": "Korzysta z osłony na spis wyborców", "prawo": "Wytyczne, Rozdział IV, pkt 46, pkt 55", "opis": "Osłona jest obowiązkowa i chroni dane osobowe innych osób ujętych w spisie. Dotyczy to również dodatkowego formularza spisu podczas składania na nim podpisów."}, {"id": "kom-B-003", "nazwa": "Sprawdza ostemplowanie wydawanych kart", "prawo": "Wytyczne, Rozdział IV, pkt 53", "opis": "Przy wydawaniu kart komisja sprawdza, czy są ostemplowane jej pieczęcią."}, {"id": "kom-B-004", "nazwa": "Wydaje po jednej karcie do każdego głosowania", "prawo": "Wytyczne, Rozdział IV, pkt 49", "opis": "Wyborcy wydaje się po jednej karcie:\n- w wyborach do Sejmu,\n- w wyborach do Senatu,\n- w referendum."}, {"id": "kom-B-005", "nazwa": "Odbiera podpis wyborcy we właściwej linii spisu", "prawo": "Wytyczne, Rozdział IV, pkt 53, pkt 54", "opis": "Dopóki wyborca nie potwierdzi odbioru kart własnoręcznym podpisem, komisja ich nie wydaje. Podpis złożony przy nazwisku innego wyborcy komisja skreśla z adnotacją „podpis w nieprawidłowym miejscu” i parafami. Wyjątek: wyborca ze znacznym lub umiarkowanym stopniem niepełnosprawności, który nie może się podpisać — komisja wydaje karty i odnotowuje w rubryce „Uwagi” fakt wydania oraz przyczynę braku podpisu."}, {"id": "kom-B-006", "nazwa": "Odnotowuje odmowę przyjęcia karty", "prawo": "Wytyczne, Rozdział IV, pkt 50, pkt 51", "opis": "Gdy wyborca odmawia przyjęcia jednej lub dwóch kart, członek komisji wpisuje w rubryce „Uwagi” właściwą adnotację (np. „bez Sejmu”, „bez referendum”). Jeżeli wyborca wróci po kartę, której wcześniej odmówił, komisja ją wydaje, a przewodniczący skreśla adnotację i opatruje skreślenie parafą."}, {"id": "kom-B-007", "nazwa": "Nie przyjmuje zwrotu kart", "prawo": "Wytyczne, Rozdział IV, pkt 52", "opis": "Gdy wyborca odebrał karty, oddalił się od komisji i wrócił, by je zwrócić — komisja bezwzględnie odmawia przyjęcia. Pozostawionej karty nie wrzuca do urny i nie uwzględnia jej w obliczeniach; pakuje ją w odrębny pakiet, opieczętowuje i opisuje, a informację odnotowuje we właściwym protokole głosowania."}, {"id": "kom-B-008", "nazwa": "Czuwa nad osobistym i tajnym głosowaniem", "prawo": "Wytyczne, Rozdział IV, pkt 63, pkt 64", "opis": "Wyborcy głosują osobiście; niedopuszczalne jest głosowanie za członka rodziny lub inną osobę (zakaz nie dotyczy pełnomocnika). Karty wrzuca się do urny stroną zadrukowaną niewidoczną; głosowanie nie może służyć agitacji."}, {"id": "kom-B-009", "nazwa": "Na wniosek wyjaśnia sposób głosowania", "prawo": "Wytyczne, Rozdział IV, pkt 57", "opis": "Komisja jest obowiązana wyjaśnić wyborcy sposób głosowania i warunki ważności głosu zgodnie z informacjami na kartach. Wyjaśnienie nie może zawierać elementów agitacyjnych."}]},
  "C": {"meta": {"tytul": "Głosowanie przez pełnomocnika — lista kontrolna zadań komisji (wspólna dla obu ról)", "otwarcie": "Do komisji zgłasza się pełnomocnik z aktem pełnomocnictwa do głosowania w imieniu wyborcy ujętego w spisie.", "zrodlo": "Propozycja silnika wg szablonu FOP · Wytyczne PKW 211/2023 (stan 2023-09-25), Rozdział IV — do recenzji FOP"}, "items": [{"id": "kom-C-001", "nazwa": "Dopuszcza pełnomocnika na podstawie aktu pełnomocnictwa", "prawo": "Wytyczne, Rozdział IV, pkt 59", "opis": "Komisja dopuszcza do głosowania osoby posiadające pełnomocnictwo do głosowania w imieniu wyborcy ujętego w spisie. Akt pełnomocnictwa sporządzony dla wyborów do Sejmu i do Senatu uprawnia również do głosowania w referendum."}, {"id": "kom-C-002", "nazwa": "Przyjmuje oświadczenie o cofnięciu pełnomocnictwa", "prawo": "Wytyczne, Rozdział IV, pkt 59", "opis": "Wyborca może w dniu głosowania doręczyć komisji pisemne oświadczenie o cofnięciu pełnomocnictwa; wola wyborcy musi być potwierdzona podpisem złożonym w obecności komisji."}, {"id": "kom-C-003", "nazwa": "Dopuszcza głosowanie osobiste mocodawcy", "prawo": "Wytyczne, Rozdział IV, pkt 59", "opis": "Wyborca, który udzielił pełnomocnictwa, może głosować osobiście, jeżeli jego pełnomocnik jeszcze nie zagłosował. Głosowanie osobiste powoduje wygaśnięcie pełnomocnictwa."}, {"id": "kom-C-004", "nazwa": "Odmawia głosowania, gdy pełnomocnik już zagłosował", "prawo": "Wytyczne, Rozdział IV, pkt 59", "opis": "Komisja nie dopuszcza do głosowania wyborcy, w którego imieniu pełnomocnik wziął już udział w głosowaniu. Złożenie oświadczenia o cofnięciu pełnomocnictwa jest wtedy bezskuteczne."}, {"id": "kom-C-005", "nazwa": "Odnotowuje cofnięcie lub wygaśnięcie pełnomocnictwa", "prawo": "Wytyczne, Rozdział IV, pkt 59", "opis": "Fakt cofnięcia lub wygaśnięcia pełnomocnictwa do głosowania komisja obowiązana jest odnotować w spisie wyborców."}, {"id": "kom-C-006", "nazwa": "Stosuje zasady odmowy i zwrotu kart jak przy wyborcy", "prawo": "Wytyczne, Rozdział IV, pkt 60", "opis": "Zasady dotyczące odmowy przyjęcia lub zwrotu którejkolwiek z kart (pkt 50–52) stosuje się również do głosowania przez pełnomocnika."}]},
  "D": {"meta": {"tytul": "Wyborca prosi o pomoc — lista kontrolna zadań komisji (wspólna dla obu ról)", "otwarcie": "Wyborca — najczęściej osoba z niepełnosprawnością lub starsza — prosi o pomoc przy głosowaniu lub o ułatwienia w lokalu.", "zrodlo": "Propozycja silnika wg szablonu FOP · Wytyczne PKW 211/2023 (stan 2023-09-25), Rozdział IV — do recenzji FOP"}, "items": [{"id": "kom-D-001", "nazwa": "Dopuszcza pomoc techniczną innej osoby", "prawo": "Wytyczne, Rozdział IV, pkt 65", "opis": "Osobie niepełnosprawnej, na jej prośbę, może pomagać w głosowaniu inna osoba, także niepełnoletnia. Pomoc może mieć wyłącznie techniczny charakter. Na życzenie wyborcy osoba pomagająca może przebywać z nim w miejscu zapewniającym tajność głosowania."}, {"id": "kom-D-002", "nazwa": "Pilnuje granicy dopuszczalnej pomocy", "prawo": "Wytyczne, Rozdział IV, pkt 65", "opis": "Pomoc nie może polegać na sugerowaniu wyborcy sposobu głosowania ani na głosowaniu w zastępstwie wyborcy."}, {"id": "kom-D-003", "nazwa": "Sama nie udziela pomocy w głosowaniu", "prawo": "Wytyczne, Rozdział IV, pkt 65", "opis": "Pomocy w głosowaniu nie może udzielać:\n- członek komisji,\n- mąż zaufania,\n- obserwator społeczny,\n- obserwator międzynarodowy\n(art. 53 i art. 103c § 2 Kodeksu wyborczego)."}, {"id": "kom-D-004", "nazwa": "Wydaje nakładki na karty w alfabecie Braille’a", "prawo": "Wytyczne, Rozdział IV, pkt 61", "opis": "Komisja wraz z kartami wydaje wyborcy niepełnosprawnemu, na jego prośbę, nakładki na karty do głosowania sporządzone w alfabecie Braille’a."}, {"id": "kom-D-005", "nazwa": "Zapewnia miejsce do użycia nakładki i odbiera ją po głosowaniu", "prawo": "Wytyczne, Rozdział IV, pkt 62", "opis": "Komisja informuje wyborcę o obowiązku zwrotu nakładek, zapewnia właściwe miejsce (np. stolik) gwarantujące tajność i czuwa, aby nakładka nie została wrzucona do urny. Utratę lub zniszczenie nakładek niezwłocznie zgłasza do urzędu gminy."}, {"id": "kom-D-006", "nazwa": "Na prośbę przekazuje ustnie treść obwieszczeń", "prawo": "Wytyczne, Rozdział IV, pkt 58", "opis": "Na prośbę wyborcy niepełnosprawnego oraz wyborcy, który najpóźniej w dniu głosowania ukończył 60 lat, komisja przekazuje ustnie treść obwieszczeń wyborczych — w zakresie informacji o zarejestrowanych listach i kandydatach oraz o pytaniach referendalnych."}, {"id": "kom-D-007", "nazwa": "Wydaje karty bez podpisu przy udokumentowanej niepełnosprawności", "prawo": "Wytyczne, Rozdział IV, pkt 53", "opis": "Gdy wyborca okaże dokument potwierdzający znaczny lub umiarkowany stopień niepełnosprawności i nie może potwierdzić odbioru kart podpisem, członek komisji wydaje karty, a w rubryce „Uwagi” stwierdza fakt wydania oraz przyczynę braku podpisu."}]},
  "E": {"meta": {"tytul": "Głosowanie z zaświadczeniem — lista kontrolna zadań komisji (wspólna dla obu ról)", "otwarcie": "Wyborca spoza spisu okazuje zaświadczenie o prawie do głosowania poza miejscem zamieszkania.", "zrodlo": "Propozycja silnika wg szablonu FOP · Wytyczne PKW 211/2023 (stan 2023-09-25), Rozdział IV — do recenzji FOP"}, "items": [{"id": "kom-E-001", "nazwa": "Sprawdza, czy przedłożono oryginał zaświadczenia", "prawo": "Wytyczne, Rozdział IV, pkt 47 ppkt 1", "opis": "Komisja zwraca szczególną uwagę, czy przedkładany jest oryginał zaświadczenia o prawie do głosowania."}, {"id": "kom-E-002", "nazwa": "Dopisuje wyborcę do spisu na dodatkowym formularzu", "prawo": "Wytyczne, Rozdział IV, pkt 47", "opis": "Zgodnie z art. 51 § 2 i 4 Kodeksu wyborczego komisja dopisuje wyborcę do spisu na dodatkowym formularzu i umożliwia głosowanie. Zaświadczenie upoważnia do udziału w wyborach do Sejmu i do Senatu oraz w referendum."}, {"id": "kom-E-003", "nazwa": "Odbiera zaświadczenie i dołącza je do spisu", "prawo": "Wytyczne, Rozdział IV, pkt 47 ppkt 1", "opis": "Zaświadczenie należy odebrać od wyborcy i dołączyć do spisu, a w rubryce „Uwagi” wpisać „wyborca zagłosował na podstawie zaświadczenia” albo „Zaświadczenie”."}, {"id": "kom-E-004", "nazwa": "Karty wydaje dopiero po odebraniu zaświadczenia", "prawo": "Wytyczne, Rozdział IV, pkt 47 ppkt 1", "opis": "Dopiero po odebraniu zaświadczenia i dokonaniu adnotacji komisja wydaje wyborcy karty do głosowania."}, {"id": "kom-E-005", "nazwa": "Tak samo postępuje z wyborcą głosującym „w swoim” obwodzie", "prawo": "Wytyczne, Rozdział IV, pkt 47 ppkt 1", "opis": "Analogicznie komisja postępuje wobec osób, które pobrały zaświadczenie z zamiarem głosowania gdzie indziej, a ostatecznie chcą głosować w „swoim” obwodzie."}, {"id": "kom-E-006", "nazwa": "Osłania dodatkowy formularz spisu przy podpisach", "prawo": "Wytyczne, Rozdział IV, pkt 55", "opis": "Dodatkowy formularz spisu powinien być osłaniany podczas składania podpisów, aby chronić dane osobowe innych wyborców."}]},
  "F": LISTA,
  "G": {"meta": {"tytul": "Rozliczenie kart do głosowania — lista kontrolna zadań komisji (wspólna dla obu ról)", "otwarcie": "Po zamknięciu lokalu i zapieczętowaniu wlotu urny komisja rozlicza karty do głosowania — odrębnie dla Sejmu, Senatu i referendum — zanim otworzy urnę.", "zrodlo": "Propozycja silnika wg szablonu FOP · Wytyczne PKW 211/2023 (stan 2023-09-25), Rozdział VI — do recenzji FOP"}, "items": [{"id": "kom-G-001", "nazwa": "Pracuje wspólnie w składzie co najmniej 2/3", "prawo": "Wytyczne, Rozdział VI, pkt 104", "opis": "Czynności ustalenia wyników komisja wykonuje wspólnie, w składzie nie mniejszym niż 2/3 pełnego składu, w tym przewodniczący lub jego zastępca. Ułamkową liczbę 2/3 zaokrągla się w górę."}, {"id": "kom-G-002", "nazwa": "Nie tworzy grup roboczych", "prawo": "Wytyczne, Rozdział VI, pkt 105", "opis": "Niedopuszczalne jest tworzenie z członków komisji grup roboczych, które wykonywałyby oddzielnie czynności po zakończeniu głosowania."}, {"id": "kom-G-003", "nazwa": "Wpisuje liczbę otrzymanych kart (punkt 1 protokołów)", "prawo": "Wytyczne, Rozdział VI, pkt 111 ppkt 1", "opis": "Liczby ustalone po przeliczeniu przed rozpoczęciem głosowania, powiększone o ewentualne karty z rezerwy — odrębnie w każdym z trzech protokołów. Liczby w poszczególnych protokołach mogą być różne."}, {"id": "kom-G-004", "nazwa": "Ustala liczbę uprawnionych ze spisu (punkt 2 protokołów)", "prawo": "Wytyczne, Rozdział VI, pkt 111 ppkt 2", "opis": "Na podstawie liczby osób w spisie w chwili zakończenia głosowania, łącznie z dopisanymi na dodatkowym formularzu. Liczby uprawnionych w trzech protokołach muszą być równe."}, {"id": "kom-G-005", "nazwa": "Przelicza karty niewykorzystane i pakuje je (punkt 3 protokołów)", "prawo": "Wytyczne, Rozdział VI, pkt 111 ppkt 3", "opis": "Odrębnie dla Sejmu, Senatu i referendum. Karty niewykorzystane pakuje się w odrębne pakiety, opieczętowuje i opisuje. Liczby mogą być różne między protokołami."}, {"id": "kom-G-006", "nazwa": "Ustala liczbę wyborców, którym wydano karty (punkt 4 protokołów)", "prawo": "Wytyczne, Rozdział VI, pkt 111 ppkt 4", "opis": "Na podstawie liczby podpisów w spisie (łącznie z adnotacjami o braku możliwości podpisu). Uwzględnia adnotacje o odmowie przyjęcia kart („bez Sejmu” itp.); nie uwzględnia adnotacji o wysłaniu pakietu wyborczego. Liczba nie może być większa od liczby uprawnionych (punkt 2)."}, {"id": "kom-G-007", "nazwa": "Wykonuje rozliczenie kontrolne kart (punkt 16 / 25 protokołów)", "prawo": "Wytyczne, Rozdział VI, pkt 111 ppkt 5", "opis": "Sprawdza, czy karty niewykorzystane (punkt 3) i wydane (punkt 4) sumują się do kart otrzymanych (punkt 1) — oddzielnie w trzech protokołach. Przy niezgodności:\n- ponownie przelicza podpisy w spisie,\n- następnie ponownie przelicza karty niewykorzystane.\nJeśli rozbieżność się utrzymuje, opisuje jej przypuszczalną przyczynę (a nie tylko fakt jej wystąpienia) w punkcie 16 protokołów Sejm/Senat i punkcie 25 protokołu referendum; bez uwag wpisuje „brak uwag”."}, {"id": "kom-G-008", "nazwa": "Ustala liczby dla pełnomocników i zaświadczeń (punkty 7 i 8 protokołów)", "prawo": "Wytyczne, Rozdział VI, pkt 111 ppkt 8, ppkt 9", "opis": "Liczbę głosujących przez pełnomocnika ustala z podpisów przy adnotacji „Udzielono pełnomocnictwa do głosowania – art. 56 Kw” i porównuje z liczbą otrzymanych aktów pełnomocnictwa. Liczbę głosujących na podstawie zaświadczenia porównuje z liczbą odebranych zaświadczeń. Rozbieżność oznacza ponowne przeliczenie."}]},
  "H": {"meta": {"tytul": "Ustalenie wyników głosowania — lista kontrolna zadań komisji (wspólna dla obu ról)", "otwarcie": "Po rozliczeniu kart komisja otwiera urnę i przystępuje do ustalenia wyników głosowania — wspólnie, prowadząc odrębnie trzy projekty protokołów.", "zrodlo": "Propozycja silnika wg szablonu FOP · Wytyczne PKW 211/2023 (stan 2023-09-25), Rozdział VI — do recenzji FOP"}, "items": [{"id": "kom-H-001", "nazwa": "Sprawdza nienaruszalność pieczęci i plomb urny", "prawo": "Wytyczne, Rozdział VI, pkt 112", "opis": "Komisja sprawdza, czy pieczęcie na urnie i na wlocie do urny lub jednorazowe plomby-nalepki pozostały nienaruszone, po czym otwiera urnę i wyjmuje z niej karty."}, {"id": "kom-H-002", "nazwa": "Ostrożnie wyjmuje karty z urny", "prawo": "Wytyczne, Rozdział VI, pkt 113", "opis": "Niedopuszczalne jest przewracanie wypełnionej urny. Gdy urna jest znacznie zapełniona, najpierw wyjmuje się część kart, a dopiero potem ewentualnie przechyla urnę z zachowaniem ostrożności."}, {"id": "kom-H-003", "nazwa": "Oddziela przedmioty niebędące kartami", "prawo": "Wytyczne, Rozdział VI, pkt 114", "opis": "Inne przedmioty (np. czyste kartki, nakładki w alfabecie Braille’a) komisja oddziela od kart, a informację o ich odnalezieniu odnotowuje w punkcie 24 protokołów Sejm/Senat i punkcie 32 protokołu referendum."}, {"id": "kom-H-004", "nazwa": "Wyjmuje karty z kopert korespondencyjnych i ustala ich liczbę (punkt 10a)", "prawo": "Wytyczne, Rozdział VI, pkt 115", "opis": "W pierwszej kolejności wyjmuje karty z kopert na kartę do głosowania w głosowaniu korespondencyjnym — odrębnie dla trzech głosowań. Liczby powinny odpowiadać liczbie kopert wrzuconych do urny; dopuszczalne różnice (np. pusta koperta, więcej niż jedna karta) komisja opisuje w protokole."}, {"id": "kom-H-005", "nazwa": "Wydziela karty całkowicie przedarte", "prawo": "Wytyczne, Rozdział VI, pkt 116", "opis": "Kart całkowicie przedartych na dwie lub więcej części nie bierze się pod uwagę przy obliczeniach. Karty takie pakuje się w pakiet, opieczętowuje i opisuje."}, {"id": "kom-H-006", "nazwa": "Okazuje każdą kartę wszystkim obecnym członkom", "prawo": "Wytyczne, Rozdział VI, pkt 106, pkt 107", "opis": "Zakazane jest przeglądanie kart i ustalanie wyników pojedynczo lub w odrębnych grupach. Pracę organizuje się tak, aby każdy członek komisji widział karty i mógł dokonać ich oceny — bez utrudniania i paraliżowania pracy."}, {"id": "kom-H-007", "nazwa": "Sporządza projekty trzech protokołów głosowania", "prawo": "Wytyczne, Rozdział VI, pkt 108, pkt 109, pkt 110", "opis": "Odrębnie: protokół głosowania na listy kandydatów na posłów, na kandydatów na senatora oraz w referendum. Czynności wykonuje się na formularzach protokołów; liczby wpisuje się od prawej strony, a zero jako cyfrę „0”."}]},

const QUIZY = { komisja:{ "A": [{"id": "kom-A-q01", "rola": "czlonek_komisji", "faza": "otwarcie_lokalu", "cel_uczenia": "Znać godzinę zbiórki komisji i odróżniać ją od godziny otwarcia lokalu.", "poziom_blooma": "zapamietywanie", "typ": "wielokrotny_wybor", "kontekst": "Sobota wieczorem ustalacie logistykę na dzień głosowania.", "pytanie": "O której najpóźniej komisja musi zebrać się w lokalu wyborczym?", "opcje": [{"tekst": "O 6:00 — tak, aby zdążyć ze wszystkimi czynnościami przygotowawczymi.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "O 7:00 — wtedy zaczyna się głosowanie, wcześniej nie ma obowiązku.", "poprawna": false, "uzasadnienie_dystraktora": "myli godzinę otwarcia lokalu (7:00, pkt 42) z godziną zbiórki komisji (najpóźniej 6:00)"}, {"tekst": "Pół godziny przed przyjściem pierwszego wyborcy.", "poprawna": false, "uzasadnienie_dystraktora": "brak takiej reguły — wytyczne wskazują sztywny najpóźniejszy moment: 6:00"}], "feedback_poprawny": "Tak. Komisja zbiera się na tyle wcześnie, by wykonać przygotowania, lecz nie później niż o 6:00 (pkt 38).", "feedback_niepoprawny": "Sprawdź pkt 38: zbiórka najpóźniej o 6:00 — otwarcie lokalu o 7:00 to inna czynność (pkt 42).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt38", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział III, pkt 38", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-A-q02", "rola": "czlonek_komisji", "faza": "otwarcie_lokalu", "cel_uczenia": "Zastosować zasadę kontynuacji stemplowania kart po godzinie 7:00.", "poziom_blooma": "stosowanie", "typ": "prawda_falsz", "kontekst": "Jest 6:55, ostemplowaliście dopiero połowę kart.", "pytanie": "Jeśli komisja nie zdąży ostemplować wszystkich kart przed 7:00, wstrzymuje wydawanie kart do czasu ostemplowania całości.", "opcje": [{"tekst": "Prawda", "poprawna": false, "uzasadnienie_dystraktora": "wstrzymanie wydawania kart blokowałoby głosowanie — wytyczne każą kontynuować stemplowanie i równolegle wydawać przybyłym karty już ostemplowane"}, {"tekst": "Fałsz", "poprawna": true, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Tak — komisja kontynuuje stemplowanie po 7:00 i wydaje przybyłym wyborcom karty już ostemplowane (pkt 39 ppkt 3).", "feedback_niepoprawny": "Wytyczne nie pozwalają wstrzymać głosowania: stemplowanie kontynuuje się po 7:00, wydając wyborcom karty ostemplowane (pkt 39 ppkt 3).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt39", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział III, pkt 39 ppkt 3", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-A-q03", "rola": "czlonek_komisji", "faza": "otwarcie_lokalu", "cel_uczenia": "Wiedzieć, gdzie trafiają liczby kart ustalone przy porannym przeliczeniu.", "poziom_blooma": "rozumienie", "typ": "wielokrotny_wybor", "kontekst": "Przeliczyliście karty odrębnie dla Sejmu, Senatu i referendum.", "pytanie": "Gdzie komisja wpisuje ustalone liczby otrzymanych kart?", "opcje": [{"tekst": "W punkcie 1 każdego z trzech protokołów głosowania.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "W protokole wewnętrznym komisji.", "poprawna": false, "uzasadnienie_dystraktora": "protokół wewnętrzny służy m.in. numerom plomb — liczby kart z porannego przeliczenia trafiają do punktu 1 protokołów głosowania"}, {"tekst": "Tylko w protokole głosowania na listy kandydatów na posłów.", "poprawna": false, "uzasadnienie_dystraktora": "przeliczenie i wpis wykonuje się odrębnie dla Sejmu, Senatu i referendum"}], "feedback_poprawny": "Tak. Liczby wpisuje się w punkcie 1 protokołu Sejmu, Senatu i referendum — to podstawa rozliczenia kart wieczorem (pkt 39 ppkt 2).", "feedback_niepoprawny": "Wróć do pkt 39 ppkt 2: liczby z porannego przeliczenia trafiają do punktu 1 wszystkich trzech protokołów głosowania.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt39", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział III, pkt 39 ppkt 2", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-A-q04", "rola": "czlonek_komisji", "faza": "otwarcie_lokalu", "cel_uczenia": "Zdecydować, co zrobić z materiałem agitacyjnym, którego komisja nie może sama usunąć.", "poziom_blooma": "stosowanie", "typ": "scenariusz", "kontekst": "O 6:20 zauważacie duży baner komitetu wyborczego na ścianie budynku, w którym mieści się lokal. Jest za wysoko, by go zdjąć.", "pytanie": "Co robi komisja?", "opcje": [{"tekst": "Zwraca się o pomoc do wójta i informuje urzędnika wyborczego.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Zostawia baner — wisi na budynku, a nie w samym lokalu.", "poprawna": false, "uzasadnienie_dystraktora": "kontrola obejmuje lokal oraz wnętrze i zewnętrze budynku, w którym mieści się lokal (pkt 39 ppkt 6)"}, {"tekst": "Opóźnia otwarcie lokalu do czasu usunięcia banera.", "poprawna": false, "uzasadnienie_dystraktora": "wytyczne nie przewidują opóźnienia otwarcia — komisja uruchamia pomoc wójta i informuje urzędnika wyborczego"}], "feedback_poprawny": "Tak. Gdy komisja nie może usunąć materiałów sama, prosi o pomoc wójta i informuje urzędnika wyborczego (pkt 39 ppkt 6).", "feedback_niepoprawny": "Zerknij do pkt 39 ppkt 6: obowiązek dotyczy także zewnętrza budynku, a ścieżka to pomoc wójta + informacja do urzędnika wyborczego.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt39", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział III, pkt 39 ppkt 6", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-A-q05", "rola": "czlonek_komisji", "faza": "otwarcie_lokalu", "cel_uczenia": "Znać obowiązek ewidencji numerów plomb-nalepek w protokole wewnętrznym.", "poziom_blooma": "zapamietywanie", "typ": "prawda_falsz", "kontekst": "Zaplombowaliście urnę jednorazowymi nalepkami foliowymi.", "pytanie": "Numery plomb-nalepek komisja wpisuje do protokołu wewnętrznego niezwłocznie po ich założeniu.", "opcje": [{"tekst": "Prawda", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Fałsz", "poprawna": false, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Tak. Numery nalepek trafiają niezwłocznie do protokołu wewnętrznego, a nalepki opatruje się pieczęcią komisji (pkt 39 ppkt 7).", "feedback_niepoprawny": "Sprawdź pkt 39 ppkt 7: numery plomb wpisuje się niezwłocznie do protokołu wewnętrznego.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt39", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział III, pkt 39 ppkt 7", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}], "B": [{"id": "kom-B-q01", "rola": "czlonek_komisji", "faza": "obsluga_wyborcy", "cel_uczenia": "Zastosować zasady weryfikacji tożsamości wyborcy.", "poziom_blooma": "stosowanie", "typ": "wielokrotny_wybor", "kontekst": "Wyborca podaje prawo jazdy, które straciło ważność miesiąc temu. Zdjęcie i dane nie budzą wątpliwości.", "pytanie": "Czy komisja może wydać karty?", "opcje": [{"tekst": "Tak — tożsamość można ustalić na podstawie każdego dokumentu ze zdjęciem, także nieważnego, jeśli nie budzi wątpliwości.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Nie — dokument musi być ważny w dniu głosowania.", "poprawna": false, "uzasadnienie_dystraktora": "wytyczne wprost dopuszczają dokument, który utracił ważność, o ile ustalenie tożsamości nie budzi wątpliwości (pkt 45 ppkt 1)"}, {"tekst": "Tak, ale tylko po dodatkowym potwierdzeniu w aplikacji mObywatel.", "poprawna": false, "uzasadnienie_dystraktora": "mObywatel to alternatywna, a nie obowiązkowa dodatkowa ścieżka potwierdzenia tożsamości"}], "feedback_poprawny": "Tak. Wystarczy dowolny dokument ze zdjęciem — nawet nieważny — jeśli tożsamość nie budzi wątpliwości; można też użyć mObywatel (pkt 45 ppkt 1).", "feedback_niepoprawny": "Sprawdź pkt 45 ppkt 1: liczy się pewność tożsamości, nie ważność dokumentu.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt45", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział IV, pkt 45 ppkt 1", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-B-q02", "rola": "czlonek_komisji", "faza": "obsluga_wyborcy", "cel_uczenia": "Znać bezwzględny warunek podpisu przed wydaniem kart.", "poziom_blooma": "zapamietywanie", "typ": "prawda_falsz", "kontekst": "Kolejka rośnie, wyborca się spieszy.", "pytanie": "Komisja może wydać karty, a podpis w spisie wyborca uzupełni przy wyjściu z lokalu.", "opcje": [{"tekst": "Prawda", "poprawna": false, "uzasadnienie_dystraktora": "dopóki wyborca nie potwierdzi odbioru kart własnoręcznym podpisem, komisja ich nie wydaje (pkt 53) — pośpiech tego nie zmienia"}, {"tekst": "Fałsz", "poprawna": true, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Tak — najpierw podpis w przeznaczonej rubryce spisu, potem karty (pkt 53). Wyjątek dotyczy tylko udokumentowanej niepełnosprawności uniemożliwiającej podpis.", "feedback_niepoprawny": "Wróć do pkt 53: bez podpisu komisja kart nie wydaje.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt53", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział IV, pkt 53", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-B-q03", "rola": "czlonek_komisji", "faza": "obsluga_wyborcy", "cel_uczenia": "Zdecydować, co zrobić z kartą, którą wyborca próbuje zwrócić.", "poziom_blooma": "stosowanie", "typ": "scenariusz", "kontekst": "Wyborca odebrał trzy karty, podpisał się i odszedł od stołu. Po chwili wraca: „źle skreśliłem, oddaję kartę do Senatu, poproszę nową”.", "pytanie": "Co robi komisja?", "opcje": [{"tekst": "Odmawia przyjęcia karty i nie wydaje nowej; jeśli wyborca kartę zostawi, pakuje ją w odrębny, opieczętowany i opisany pakiet — nie wrzuca do urny.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Przyjmuje kartę i wrzuca ją do urny, żeby zgadzało się rozliczenie.", "poprawna": false, "uzasadnienie_dystraktora": "komisja nie jest uprawniona do wrzucenia karty do urny; pozostawionej karty nie uwzględnia się w obliczeniach (pkt 52)"}, {"tekst": "Wymienia kartę na nową za adnotacją w spisie.", "poprawna": false, "uzasadnienie_dystraktora": "komisja odmawia ponownego wydania kart niezależnie od przyczyny (pkt 56); wyjątkiem jest tylko sytuacja z pkt 51"}], "feedback_poprawny": "Tak. Po oddaleniu się od komisji zwrot kart jest niemożliwy; pozostawioną kartę pakuje się odrębnie i odnotowuje w protokole (pkt 52).", "feedback_niepoprawny": "Sprawdź pkt 52 i 56: bezwzględna odmowa przyjęcia, odrębny pakiet, żadnego wrzucania do urny i żadnej nowej karty.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt52", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział IV, pkt 52", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-B-q04", "rola": "czlonek_komisji", "faza": "obsluga_wyborcy", "cel_uczenia": "Znać adnotacje przy odmowie przyjęcia części kart.", "poziom_blooma": "rozumienie", "typ": "wielokrotny_wybor", "kontekst": "Wyborca mówi: „referendum mnie nie interesuje, biorę tylko karty wyborcze”.", "pytanie": "Co robi członek komisji wydający karty?", "opcje": [{"tekst": "Wydaje karty do Sejmu i Senatu, a w rubryce „Uwagi” wpisuje adnotację „bez referendum”.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Odmawia wydania jakichkolwiek kart — wyborca bierze wszystkie albo żadną.", "poprawna": false, "uzasadnienie_dystraktora": "wyborca może odmówić przyjęcia części kart; komisja odnotowuje to adnotacją (pkt 50)"}, {"tekst": "Żąda od wyborcy pisemnego oświadczenia o rezygnacji z referendum.", "poprawna": false, "uzasadnienie_dystraktora": "wystarczy adnotacja członka komisji w rubryce „Uwagi” — pisemne oświadczenie nie jest wymagane"}], "feedback_poprawny": "Tak. Odmowę przyjęcia karty odnotowuje się adnotacją w „Uwagach” (np. „bez referendum”); jeśli wyborca się rozmyśli przed opuszczeniem lokalu, kartę można wydać, a adnotację skreśla przewodniczący z parafą (pkt 50–51).", "feedback_niepoprawny": "Wróć do pkt 50: właściwa reakcja to adnotacja „bez referendum” w rubryce „Uwagi”.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt50", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział IV, pkt 50", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-B-q05", "rola": "czlonek_komisji", "faza": "obsluga_wyborcy", "cel_uczenia": "Znać obowiązek wyjaśnienia sposobu głosowania bez agitacji.", "poziom_blooma": "zapamietywanie", "typ": "prawda_falsz", "kontekst": "Wyborca pyta, jak oddać ważny głos w wyborach do Senatu.", "pytanie": "Na wniosek wyborcy komisja jest obowiązana wyjaśnić sposób głosowania i warunki ważności głosu, zgodnie z informacjami na kartach.", "opcje": [{"tekst": "Prawda", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Fałsz", "poprawna": false, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Tak — to obowiązek komisji; wyjaśnienie nie może jednak zawierać elementów agitacyjnych (pkt 57).", "feedback_niepoprawny": "Sprawdź pkt 57: komisja wyjaśnia sposób głosowania i warunki ważności głosu, bez agitacji.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt57", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział IV, pkt 57", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}], "C": [{"id": "kom-C-q01", "rola": "czlonek_komisji", "faza": "pelnomocnik", "cel_uczenia": "Znać zakres aktu pełnomocnictwa względem referendum.", "poziom_blooma": "zapamietywanie", "typ": "wielokrotny_wybor", "kontekst": "Pełnomocnik okazuje akt pełnomocnictwa sporządzony w związku z wyborami do Sejmu i Senatu.", "pytanie": "Czy na tej podstawie może głosować także w referendum?", "opcje": [{"tekst": "Tak — akt sporządzony dla wyborów do Sejmu i Senatu uprawnia również do głosowania w referendum.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Nie — referendum wymaga odrębnego aktu pełnomocnictwa.", "poprawna": false, "uzasadnienie_dystraktora": "wytyczne rozstrzygają wprost: jeden akt obejmuje także referendum (pkt 59)"}, {"tekst": "Tylko jeśli mocodawca dopisał referendum w treści aktu.", "poprawna": false, "uzasadnienie_dystraktora": "nie jest wymagany dopisek — uprawnienie do referendum wynika z samego aktu (pkt 59)"}], "feedback_poprawny": "Tak. Akt pełnomocnictwa dla wyborów do Sejmu i Senatu uprawnia również do głosowania w referendum (pkt 59).", "feedback_niepoprawny": "Sprawdź pkt 59: jeden akt, trzy głosowania.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt59", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział IV, pkt 59", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-C-q02", "rola": "czlonek_komisji", "faza": "pelnomocnik", "cel_uczenia": "Zdecydować o dopuszczeniu mocodawcy do głosowania osobistego.", "poziom_blooma": "stosowanie", "typ": "scenariusz", "kontekst": "Do komisji przychodzi wyborca, który udzielił pełnomocnictwa. Jego pełnomocnik nie głosował jeszcze w jego imieniu. Wyborca chce zagłosować osobiście.", "pytanie": "Co robi komisja?", "opcje": [{"tekst": "Dopuszcza wyborcę do głosowania — głosowanie osobiste powoduje wygaśnięcie pełnomocnictwa; fakt ten odnotowuje w spisie.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Odmawia — skoro istnieje pełnomocnictwo, głosuje wyłącznie pełnomocnik.", "poprawna": false, "uzasadnienie_dystraktora": "mocodawca może głosować osobiście, dopóki pełnomocnik nie zagłosował; skutkiem jest wygaśnięcie pełnomocnictwa (pkt 59)"}, {"tekst": "Każe wyborcy najpierw cofnąć pełnomocnictwo u wójta i wrócić z potwierdzeniem.", "poprawna": false, "uzasadnienie_dystraktora": "nie ma takiego wymogu — wystarczy głosowanie osobiste, które samo wygasza pełnomocnictwo (pkt 59)"}], "feedback_poprawny": "Tak. Mocodawca głosuje osobiście, jeżeli pełnomocnik jeszcze nie głosował; pełnomocnictwo wygasa, co komisja odnotowuje w spisie (pkt 59).", "feedback_niepoprawny": "Wróć do pkt 59: głosowanie osobiste przed pełnomocnikiem = wygaśnięcie pełnomocnictwa.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt59", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział IV, pkt 59", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-C-q03", "rola": "czlonek_komisji", "faza": "pelnomocnik", "cel_uczenia": "Znać skutek wcześniejszego głosowania pełnomocnika.", "poziom_blooma": "rozumienie", "typ": "prawda_falsz", "kontekst": "Pełnomocnik zagłosował rano. Po południu przychodzi mocodawca z pisemnym cofnięciem pełnomocnictwa.", "pytanie": "Komisja dopuszcza mocodawcę do głosowania, bo cofnięcie unieważnia głos pełnomocnika.", "opcje": [{"tekst": "Prawda", "poprawna": false, "uzasadnienie_dystraktora": "gdy pełnomocnik już zagłosował, mocodawca nie zostanie dopuszczony, a cofnięcie jest bezskuteczne (pkt 59)"}, {"tekst": "Fałsz", "poprawna": true, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Tak — po głosowaniu pełnomocnika komisja nie dopuszcza mocodawcy, a złożone wtedy cofnięcie jest bezskuteczne (pkt 59).", "feedback_niepoprawny": "Sprawdź pkt 59: głos pełnomocnika zamyka sprawę; cofnięcie działa tylko zanim pełnomocnik zagłosuje.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt59", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział IV, pkt 59", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-C-q04", "rola": "czlonek_komisji", "faza": "pelnomocnik", "cel_uczenia": "Znać formę skutecznego cofnięcia pełnomocnictwa w dniu głosowania.", "poziom_blooma": "zapamietywanie", "typ": "prawda_falsz", "kontekst": "Wyborca chce cofnąć pełnomocnictwo przy stole komisji.", "pytanie": "Podstawą odnotowania cofnięcia jest pisemne oświadczenie, w którym wola wyborcy została potwierdzona podpisem złożonym w obecności komisji.", "opcje": [{"tekst": "Prawda", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Fałsz", "poprawna": false, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Tak — cofnięcie wymaga pisemnego oświadczenia z podpisem złożonym w obecności komisji (pkt 59).", "feedback_niepoprawny": "Wróć do pkt 59: forma pisemna + podpis w obecności komisji.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt59", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział IV, pkt 59", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-C-q05", "rola": "czlonek_komisji", "faza": "pelnomocnik", "cel_uczenia": "Wiedzieć, że zasady odmowy i zwrotu kart obejmują pełnomocnika.", "poziom_blooma": "rozumienie", "typ": "wielokrotny_wybor", "kontekst": "Pełnomocnik oświadcza, że bierze tylko kartę do Sejmu.", "pytanie": "Jak postępuje komisja?", "opcje": [{"tekst": "Tak samo jak przy każdym wyborcy — wydaje kartę do Sejmu i wpisuje w „Uwagach” właściwą adnotację o odmowie pozostałych.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Odmawia — pełnomocnik musi pobrać komplet kart mocodawcy.", "poprawna": false, "uzasadnienie_dystraktora": "zasady dotyczące odmowy przyjęcia kart (pkt 50–52) stosuje się również do pełnomocnika (pkt 60)"}, {"tekst": "Wydaje wszystkie karty i sama wrzuca niechciane do urny.", "poprawna": false, "uzasadnienie_dystraktora": "komisja nigdy nie wrzuca kart za wyborcę ani pełnomocnika — odmowę odnotowuje adnotacją"}], "feedback_poprawny": "Tak. Zasady z pkt 50–52 (adnotacje o odmowie, zakaz zwrotu) stosuje się też do głosowania przez pełnomocnika (pkt 60).", "feedback_niepoprawny": "Sprawdź pkt 60: pełnomocnika obowiązują te same reguły odmowy i zwrotu kart co wyborcę.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt60", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział IV, pkt 60", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}], "D": [{"id": "kom-D-q01", "rola": "czlonek_komisji", "faza": "pomoc_wyborcy", "cel_uczenia": "Znać krąg osób mogących pomagać wyborcy i charakter pomocy.", "poziom_blooma": "zapamietywanie", "typ": "wielokrotny_wybor", "kontekst": "Wyborca z niepełnosprawnością prosi, by ktoś pomógł mu przy karcie.", "pytanie": "Kto może udzielić pomocy?", "opcje": [{"tekst": "Inna osoba wskazana przez wyborcę, także niepełnoletnia — pomoc może mieć wyłącznie techniczny charakter.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Wyznaczony członek komisji.", "poprawna": false, "uzasadnienie_dystraktora": "pomocy w głosowaniu nie może udzielać członek komisji (pkt 65)"}, {"tekst": "Wyłącznie pełnoletni członek rodziny.", "poprawna": false, "uzasadnienie_dystraktora": "wytyczne nie ograniczają pomocy do rodziny ani do osób pełnoletnich — może pomagać także osoba niepełnoletnia (pkt 65)"}], "feedback_poprawny": "Tak. Pomaga inna osoba, także niepełnoletnia; pomoc jest wyłącznie techniczna, a wyłączeni są członkowie komisji, mężowie zaufania i obserwatorzy (pkt 65).", "feedback_niepoprawny": "Sprawdź pkt 65: technicznie i nie przez funkcyjnych — to dwie granice pomocy.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt65", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział IV, pkt 65", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-D-q02", "rola": "czlonek_komisji", "faza": "pomoc_wyborcy", "cel_uczenia": "Znać dopuszczalność obecności osoby pomagającej za kotarą.", "poziom_blooma": "rozumienie", "typ": "prawda_falsz", "kontekst": "Wyborca chce, by osoba pomagająca weszła z nim za kotarę.", "pytanie": "Na życzenie osoby niepełnosprawnej w miejscu zapewniającym tajność głosowania może przebywać osoba udzielająca pomocy.", "opcje": [{"tekst": "Prawda", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Fałsz", "poprawna": false, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Tak — wytyczne dopuszczają to wprost, na życzenie wyborcy (pkt 65).", "feedback_niepoprawny": "Sprawdź pkt 65: obecność osoby pomagającej za kotarą jest dopuszczalna na życzenie wyborcy.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt65", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział IV, pkt 65", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-D-q03", "rola": "czlonek_komisji", "faza": "pomoc_wyborcy", "cel_uczenia": "Rozpoznać przekroczenie granicy pomocy technicznej.", "poziom_blooma": "ocena", "typ": "scenariusz", "kontekst": "Syn towarzyszący wyborcy mówi przy stole: „tata słabo widzi, ja zaznaczę — i tak wiem, na kogo by głosował”.", "pytanie": "Jak ocenia to komisja?", "opcje": [{"tekst": "To przekroczenie granicy — pomoc nie może polegać na głosowaniu w zastępstwie ani sugerowaniu; syn może jedynie technicznie pomóc wykonać wolę ojca.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "To dopuszczalne — syn działa w dobrej wierze i zna preferencje ojca.", "poprawna": false, "uzasadnienie_dystraktora": "dobra wiara nie zmienia kwalifikacji: decyzja musi pochodzić od wyborcy, nie od pomocnika (pkt 65)"}, {"tekst": "To dopuszczalne, jeśli ojciec kiwnie głową przy komisji.", "poprawna": false, "uzasadnienie_dystraktora": "pomoc techniczna to wykonanie decyzji wyborcy przy karcie, a nie zastępowanie jego głosu deklaracją pomocnika"}], "feedback_poprawny": "Tak. Pomoc ma charakter wyłącznie techniczny — nie może być sugerowaniem sposobu głosowania ani głosowaniem w zastępstwie (pkt 65).", "feedback_niepoprawny": "Wróć do pkt 65: „wiem, jak by głosował” to głosowanie w zastępstwie, nie pomoc techniczna.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt65", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział IV, pkt 65", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-D-q04", "rola": "czlonek_komisji", "faza": "pomoc_wyborcy", "cel_uczenia": "Znać procedurę wydawania i zwrotu nakładek Braille’a.", "poziom_blooma": "rozumienie", "typ": "wielokrotny_wybor", "kontekst": "Wyborca niewidomy prosi o nakładki na karty.", "pytanie": "Jak postępuje komisja?", "opcje": [{"tekst": "Wydaje nakładki wraz z kartami, informuje o obowiązku ich zwrotu po głosowaniu i pilnuje, by nakładka nie trafiła do urny.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Wydaje nakładki, które wyborca zabiera ze sobą na pamiątkę.", "poprawna": false, "uzasadnienie_dystraktora": "po oddaniu głosu wyborca jest obowiązany zwrócić nakładki komisji (pkt 62)"}, {"tekst": "Odmawia — nakładki są dostępne tylko w obwodach dostosowanych.", "poprawna": false, "uzasadnienie_dystraktora": "nakładki wydaje się na prośbę wyborcy niepełnosprawnego wraz z kartami (pkt 61)"}], "feedback_poprawny": "Tak. Nakładki wydaje się na prośbę wraz z kartami; komisja zapewnia miejsce gwarantujące tajność, odbiera nakładkę po głosowaniu, a utratę zgłasza do urzędu gminy (pkt 61–62).", "feedback_niepoprawny": "Sprawdź pkt 61–62: wydanie na prośbę, zwrot po głosowaniu, nakładka nie może trafić do urny.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt61", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział IV, pkt 61–62", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-D-q05", "rola": "czlonek_komisji", "faza": "pomoc_wyborcy", "cel_uczenia": "Znać obowiązek ustnego przekazania treści obwieszczeń.", "poziom_blooma": "zapamietywanie", "typ": "prawda_falsz", "kontekst": "Wyborca 72-letni prosi o odczytanie, jakie listy są zarejestrowane.", "pytanie": "Na prośbę wyborcy niepełnosprawnego oraz wyborcy, który najpóźniej w dniu głosowania ukończył 60 lat, komisja przekazuje ustnie treść obwieszczeń wyborczych.", "opcje": [{"tekst": "Prawda", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Fałsz", "poprawna": false, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Tak — w zakresie informacji o zarejestrowanych listach i kandydatach oraz o pytaniach referendalnych (pkt 58).", "feedback_niepoprawny": "Sprawdź pkt 58: obowiązek dotyczy wyborców niepełnosprawnych i 60+.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt58", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział IV, pkt 58", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}], "E": [{"id": "kom-E-q01", "rola": "czlonek_komisji", "faza": "zaswiadczenie", "cel_uczenia": "Zastosować prawidłową kolejność czynności przy zaświadczeniu.", "poziom_blooma": "stosowanie", "typ": "wielokrotny_wybor", "kontekst": "Wyborca spoza spisu okazuje zaświadczenie o prawie do głosowania.", "pytanie": "Jaka jest prawidłowa kolejność czynności komisji?", "opcje": [{"tekst": "Odebrać zaświadczenie, dołączyć je do spisu, wpisać adnotację w „Uwagach”, dopisać wyborcę na dodatkowym formularzu — i dopiero wtedy wydać karty.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Wydać karty od razu, a formalności z zaświadczeniem dopełnić po głosowaniu.", "poprawna": false, "uzasadnienie_dystraktora": "dopiero po odebraniu zaświadczenia i adnotacji komisja wydaje karty (pkt 47 ppkt 1)"}, {"tekst": "Skopiować zaświadczenie, oryginał oddać wyborcy.", "poprawna": false, "uzasadnienie_dystraktora": "zaświadczenie odbiera się i dołącza do spisu — oryginał zostaje przy komisji (pkt 47 ppkt 1)"}], "feedback_poprawny": "Tak. Zaświadczenie należy odebrać i dołączyć do spisu, wpisać adnotację, dopisać wyborcę na dodatkowym formularzu — karty wydaje się dopiero wtedy (pkt 47).", "feedback_niepoprawny": "Wróć do pkt 47 ppkt 1: najpierw dokument i adnotacja, potem karty.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt47", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział IV, pkt 47 ppkt 1", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-E-q02", "rola": "czlonek_komisji", "faza": "zaswiadczenie", "cel_uczenia": "Znać wymóg oryginału zaświadczenia.", "poziom_blooma": "zapamietywanie", "typ": "prawda_falsz", "kontekst": "Wyborca pokazuje skan zaświadczenia w telefonie.", "pytanie": "Komisja może dopisać wyborcę do spisu na podstawie kopii lub skanu zaświadczenia.", "opcje": [{"tekst": "Prawda", "poprawna": false, "uzasadnienie_dystraktora": "komisja zwraca szczególną uwagę, czy przedkładany jest oryginał zaświadczenia (pkt 47 ppkt 1) — kopia i skan nie wystarczą"}, {"tekst": "Fałsz", "poprawna": true, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Tak — podstawą jest wyłącznie oryginał zaświadczenia; komisja weryfikuje jego oryginalność (pkt 47 ppkt 1).", "feedback_niepoprawny": "Sprawdź pkt 47 ppkt 1: oryginał, nie kopia.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt47", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział IV, pkt 47 ppkt 1", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-E-q03", "rola": "czlonek_komisji", "faza": "zaswiadczenie", "cel_uczenia": "Znać zakres uprawnień z zaświadczenia.", "poziom_blooma": "rozumienie", "typ": "prawda_falsz", "kontekst": "Wyborca z zaświadczeniem pyta, czy dostanie też kartę referendalną.", "pytanie": "Zaświadczenie o prawie do głosowania upoważnia do udziału w wyborach do Sejmu i do Senatu oraz w referendum.", "opcje": [{"tekst": "Prawda", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Fałsz", "poprawna": false, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Tak — jedno zaświadczenie obejmuje wszystkie trzy głosowania (pkt 47 ppkt 1).", "feedback_niepoprawny": "Sprawdź pkt 47 ppkt 1: zaświadczenie działa w wyborach do Sejmu, Senatu i w referendum.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt47", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział IV, pkt 47 ppkt 1", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-E-q04", "rola": "czlonek_komisji", "faza": "zaswiadczenie", "cel_uczenia": "Rozstrzygnąć przypadek wyborcy wracającego z zaświadczeniem do „swojego” obwodu.", "poziom_blooma": "stosowanie", "typ": "scenariusz", "kontekst": "Wyborca pobrał zaświadczenie, bo planował głosować nad morzem. Plany się zmieniły — przychodzi do swojego dotychczasowego lokalu z zaświadczeniem w ręku.", "pytanie": "Co robi komisja?", "opcje": [{"tekst": "Postępuje jak przy każdym zaświadczeniu: odbiera je, dołącza do spisu, dopisuje wyborcę na dodatkowym formularzu z adnotacją i wydaje karty.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Odmawia — zaświadczenie „zużywa się” z chwilą wydania i wyborca może głosować tylko poza swoim obwodem.", "poprawna": false, "uzasadnienie_dystraktora": "wytyczne każą postąpić analogicznie wobec osób chcących głosować w „swoim” obwodzie na podstawie zaświadczenia (pkt 47 ppkt 1)"}, {"tekst": "Wydaje karty bez odbierania zaświadczenia — przecież to jego obwód.", "poprawna": false, "uzasadnienie_dystraktora": "również w „swoim” obwodzie podstawą dopisania jest odebrane zaświadczenie (pkt 47 ppkt 1)"}], "feedback_poprawny": "Tak. Wobec wracających do „swojego” obwodu komisja postępuje analogicznie: odbiera zaświadczenie i dopisuje wyborcę do spisu (pkt 47 ppkt 1).", "feedback_niepoprawny": "Wróć do pkt 47 ppkt 1: zmiana planów nie odbiera prawa głosu — ścieżka przez zaświadczenie działa też w macierzystym obwodzie.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt47", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział IV, pkt 47 ppkt 1", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-E-q05", "rola": "czlonek_komisji", "faza": "zaswiadczenie", "cel_uczenia": "Znać brzmienie adnotacji w spisie.", "poziom_blooma": "zapamietywanie", "typ": "wielokrotny_wybor", "kontekst": "Dopisujesz wyborcę z zaświadczeniem do dodatkowego formularza spisu.", "pytanie": "Jaką adnotację wpisujesz w rubryce „Uwagi”?", "opcje": [{"tekst": "„Wyborca zagłosował na podstawie zaświadczenia” albo „Zaświadczenie”.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "„Spoza obwodu”.", "poprawna": false, "uzasadnienie_dystraktora": "wytyczne wskazują konkretne brzmienia adnotacji (pkt 47 ppkt 1)"}, {"tekst": "Żadnej — wystarczy dołączone zaświadczenie.", "poprawna": false, "uzasadnienie_dystraktora": "adnotacja w „Uwagach” jest wymagana obok dołączenia zaświadczenia do spisu (pkt 47 ppkt 1)"}], "feedback_poprawny": "Tak. W „Uwagach” wpisuje się „wyborca zagłosował na podstawie zaświadczenia” albo „Zaświadczenie” (pkt 47 ppkt 1) — to podstawa wieczornego rozliczenia punktu 8 protokołów.", "feedback_niepoprawny": "Sprawdź pkt 47 ppkt 1: adnotacja ma ustalone brzmienie.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt47", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział IV, pkt 47 ppkt 1", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}], "F": [{"id": "kom-F-q01", "rola": "czlonek_komisji", "faza": "zamkniecie_lokalu", "cel_uczenia": "Znać zasadę zakończenia głosowania o 21:00 z poszanowaniem kolejki.", "poziom_blooma": "rozumienie", "typ": "wielokrotny_wybor", "kontekst": "Jest 21:00, przed lokalem stoi jeszcze kilkanaście osób.", "pytanie": "Co robi komisja?", "opcje": [{"tekst": "Przewodniczący zarządza zakończenie głosowania i komisja zamyka lokal, ale wyborcom przybyłym przed 21:00 umożliwia oddanie głosu.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Zamyka drzwi punktualnie o 21:00 — kolejka odchodzi z kwitkiem.", "poprawna": false, "uzasadnienie_dystraktora": "wyborcom przybyłym do lokalu przed 21:00 należy umożliwić oddanie głosu (pkt 97)"}, {"tekst": "Głosowanie trwa, dopóki przychodzą chętni.", "poprawna": false, "uzasadnienie_dystraktora": "po 21:00 głos oddają tylko ci, którzy przybyli przed tą godziną (pkt 97)"}], "feedback_poprawny": "Tak. O 21:00 przewodniczący zarządza zakończenie głosowania; osobom przybyłym przed 21:00 umożliwia się oddanie głosu (pkt 97).", "feedback_niepoprawny": "Sprawdź pkt 97: zamknięcie o 21:00, ale kolejka sprzed tej godziny głosuje.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt97", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział V, pkt 97", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-F-q02", "rola": "czlonek_komisji", "faza": "zamkniecie_lokalu", "cel_uczenia": "Znać krąg osób mogących przebywać w lokalu po zamknięciu.", "poziom_blooma": "zapamietywanie", "typ": "prawda_falsz", "kontekst": "Po zamknięciu lokalu sprawdzacie, kto pozostał w środku.", "pytanie": "Po zakończeniu głosowania w lokalu mogą przebywać — poza komisją — mężowie zaufania, obserwatorzy społeczni i międzynarodowi oraz osoba obsługi informatycznej, jeśli ją zapewniono.", "opcje": [{"tekst": "Prawda", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Fałsz", "poprawna": false, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Tak — a dziennikarze wyłącznie w czasie otwierania urny i wyjmowania z niej kart (pkt 99–100).", "feedback_niepoprawny": "Sprawdź pkt 99–100: katalog osób po zamknięciu plus wyjątek dla dziennikarzy przy otwieraniu urny.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt99", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział V, pkt 99–100", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-F-q03", "rola": "czlonek_komisji", "faza": "zamkniecie_lokalu", "cel_uczenia": "Zastosować próg 2/3 składu przed czynnościami po zamknięciu.", "poziom_blooma": "stosowanie", "typ": "scenariusz", "kontekst": "Komisja liczy 7 osób. Po zamknięciu lokalu obecnych jest 4 członków, w tym przewodniczący. Ktoś proponuje: „zaczynajmy, połowa jest”.", "pytanie": "Czy komisja może przystąpić do czynności po zakończeniu głosowania?", "opcje": [{"tekst": "Nie — przy 7-osobowym składzie minimum to 5 osób (2/3 z zaokrągleniem w górę); czekacie na piątego członka.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Tak — 4 osoby z przewodniczącym to ponad połowa składu.", "poprawna": false, "uzasadnienie_dystraktora": "próg 1/2 dotyczy czasu głosowania (pkt 37); po zakończeniu obowiązuje 2/3 pełnego składu (pkt 99, pkt 104)"}, {"tekst": "Tak, jeśli przewodniczący weźmie odpowiedzialność.", "poprawna": false, "uzasadnienie_dystraktora": "decyzja przewodniczącego nie zastępuje kworum 2/3"}], "feedback_poprawny": "Tak. Czynności po zakończeniu głosowania wymagają co najmniej 2/3 pełnego składu z przewodniczącym lub zastępcą; 2/3 z 7 to po zaokrągleniu 5 (pkt 99, pkt 104).", "feedback_niepoprawny": "Wróć do pkt 104: 2/3 z zaokrągleniem w górę — przy 7 osobach minimum 5.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt104", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział V–VI, pkt 99 i pkt 104", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-F-q04", "rola": "czlonek_komisji", "faza": "zamkniecie_lokalu", "cel_uczenia": "Znać sposób zapieczętowania wlotu urny.", "poziom_blooma": "zapamietywanie", "typ": "wielokrotny_wybor", "kontekst": "Ostatni wyborca opuścił lokal.", "pytanie": "Jak przewodniczący zapieczętowuje wlot urny?", "opcje": [{"tekst": "Zakleja go paskiem papieru z pieczęcią komisji i podpisami członków, a przy plombach-nalepkach wpisuje ich numer do protokołu wewnętrznego.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Dowolny członek komisji okleja wlot taśmą biurową.", "poprawna": false, "uzasadnienie_dystraktora": "pieczętuje przewodniczący: pasek papieru z pieczęcią i podpisami albo plomba-nalepka z numerem w protokole wewnętrznym (pkt 101)"}, {"tekst": "Urny nie pieczętuje się — wystarczy jej pilnować do otwarcia.", "poprawna": false, "uzasadnienie_dystraktora": "zapieczętowanie wlotu niezwłocznie po zakończeniu głosowania jest obowiązkowe (pkt 101)"}], "feedback_poprawny": "Tak. Wlot urny pieczętuje przewodniczący: pasek papieru z pieczęcią i podpisami członków; plomba-nalepka wymaga wpisu numeru do protokołu wewnętrznego (pkt 101).", "feedback_niepoprawny": "Sprawdź pkt 101: kto (przewodniczący), czym (pasek/plomba) i z jaką ewidencją (protokół wewnętrzny).", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt101", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział V, pkt 101", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-F-q05", "rola": "czlonek_komisji", "faza": "zamkniecie_lokalu", "cel_uczenia": "Znać warunki wcześniejszego zakończenia głosowania w obwodach odrębnych.", "poziom_blooma": "rozumienie", "typ": "prawda_falsz", "kontekst": "Komisja w domu pomocy społecznej: wszyscy ze spisu zagłosowali do 17:30.", "pytanie": "Komisja w obwodzie odrębnym może zarządzić wcześniejsze zakończenie głosowania, jednak nie wcześniej niż o godzinie 18:00.", "opcje": [{"tekst": "Prawda", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Fałsz", "poprawna": false, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Tak — pod warunkiem, że zagłosowali wszyscy wyborcy ze spisu; protokoły podaje się do wiadomości nie wcześniej niż o 21:00 (pkt 98).", "feedback_niepoprawny": "Sprawdź pkt 98: wcześniejsze zakończenie najwcześniej o 18:00 i tylko po zagłosowaniu wszystkich ze spisu.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt98", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział V, pkt 98", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}], "G": [{"id": "kom-G-q01", "rola": "czlonek_komisji", "faza": "rozliczenie_kart", "cel_uczenia": "Znać treść punktu 1 protokołów i dopuszczalność różnic między protokołami.", "poziom_blooma": "rozumienie", "typ": "wielokrotny_wybor", "kontekst": "Wypełniacie punkt 1 trzech protokołów głosowania.", "pytanie": "Co wpisuje komisja i czy liczby mogą się różnić między protokołami?", "opcje": [{"tekst": "Liczby kart otrzymanych ustalone rano, powiększone o karty z rezerwy — i mogą być różne dla Sejmu, Senatu i referendum.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Liczby kart otrzymanych — muszą być identyczne we wszystkich protokołach.", "poprawna": false, "uzasadnienie_dystraktora": "liczby otrzymanych kart w trzech głosowaniach mogą być różne (pkt 111 ppkt 1); to liczby uprawnionych muszą być równe (ppkt 2)"}, {"tekst": "Liczby kart wyjętych z urny.", "poprawna": false, "uzasadnienie_dystraktora": "punkt 1 dotyczy kart otrzymanych, nie wyjętych z urny (pkt 111 ppkt 1)"}], "feedback_poprawny": "Tak. Punkt 1 = karty otrzymane (z rezerwą), odrębnie w trzech protokołach; te liczby mogą się różnić (pkt 111 ppkt 1).", "feedback_niepoprawny": "Sprawdź pkt 111 ppkt 1: karty otrzymane + rezerwa; różnice między protokołami są dopuszczalne.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt111", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 111 ppkt 1", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-G-q02", "rola": "czlonek_komisji", "faza": "rozliczenie_kart", "cel_uczenia": "Znać wymóg równości liczby uprawnionych w trzech protokołach.", "poziom_blooma": "zapamietywanie", "typ": "prawda_falsz", "kontekst": "Punkt 2 protokołów: liczba uprawnionych do głosowania.", "pytanie": "Liczby uprawnionych do głosowania w protokołach Sejmu, Senatu i referendum muszą być równe.", "opcje": [{"tekst": "Prawda", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Fałsz", "poprawna": false, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Tak — liczbę uprawnionych ustala się ze spisu (z dopisanymi) w chwili zakończenia głosowania i jest ona wspólna dla trzech protokołów (pkt 111 ppkt 2).", "feedback_niepoprawny": "Sprawdź pkt 111 ppkt 2: jeden spis, jedna liczba uprawnionych — w trzech protokołach równa.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt111", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 111 ppkt 2", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-G-q03", "rola": "czlonek_komisji", "faza": "rozliczenie_kart", "cel_uczenia": "Zastosować procedurę przy niezgodności rozliczenia kart.", "poziom_blooma": "stosowanie", "typ": "scenariusz", "kontekst": "W protokole Sejmu: karty niewykorzystane (pkt 3) + wydane (pkt 4) nie sumują się do otrzymanych (pkt 1). Różnica: 2 karty.", "pytanie": "Jaka jest prawidłowa kolejność działań?", "opcje": [{"tekst": "Ponownie przeliczyć podpisy w spisie; jeśli niezgodność trwa — ponownie przeliczyć karty niewykorzystane; utrzymującą się rozbieżność opisać z przypuszczalną przyczyną w punkcie 16.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Dopisać brakujące 2 karty do punktu 3, żeby bilans się zgadzał.", "poprawna": false, "uzasadnienie_dystraktora": "liczbę w punkcie 3 zmienia się wyłącznie wtedy, gdy ponowne przeliczenie da inny wynik — nie po to, by „domknąć” bilans (pkt 111 ppkt 5)"}, {"tekst": "Wpisać w punkcie 16 „występuje niezgodność” i przejść dalej.", "poprawna": false, "uzasadnienie_dystraktora": "w punkcie 16 wskazuje się przypuszczalną przyczynę, a nie samą informację o niezgodności (pkt 111 ppkt 5)"}], "feedback_poprawny": "Tak. Kolejność: podpisy → niewykorzystane karty → opis przypuszczalnej przyczyny w pkt 16/25; przy braku uwag wpisuje się „brak uwag” (pkt 111 ppkt 5).", "feedback_niepoprawny": "Wróć do pkt 111 ppkt 5: dwie tury przeliczeń, potem opis przyczyny — nigdy „dopasowywanie” liczb.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt111", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 111 ppkt 5", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-G-q04", "rola": "czlonek_komisji", "faza": "rozliczenie_kart", "cel_uczenia": "Znać zasady ustalania liczby wydanych kart (punkt 4).", "poziom_blooma": "rozumienie", "typ": "wielokrotny_wybor", "kontekst": "Ustalacie liczbę wyborców, którym wydano karty w lokalu.", "pytanie": "Które adnotacje w spisie mają znaczenie dla punktu 4?", "opcje": [{"tekst": "Adnotacje o odmowie przyjęcia kart („bez Sejmu” itp.) — uwzględnia się; adnotacji o wysłaniu pakietu wyborczego nie uwzględnia się.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Wszystkie adnotacje, łącznie z wysłanymi pakietami wyborczymi.", "poprawna": false, "uzasadnienie_dystraktora": "przy punkcie 4 nie uwzględnia się adnotacji o wysłaniu pakietu (pkt 111 ppkt 4) — pakiety mają własny punkt 5"}, {"tekst": "Żadne — liczy się wyłącznie surowa liczba podpisów.", "poprawna": false, "uzasadnienie_dystraktora": "adnotacje „bez Sejmu” itp. korygują liczbę wydanych kart w danym głosowaniu (pkt 111 ppkt 4)"}], "feedback_poprawny": "Tak. Punkt 4 opiera się na podpisach z uwzględnieniem adnotacji o odmowach; pakietów wyborczych nie wlicza się — i liczba nie może przekroczyć uprawnionych z punktu 2 (pkt 111 ppkt 4).", "feedback_niepoprawny": "Sprawdź pkt 111 ppkt 4: odmowy tak, pakiety nie.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt111", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 111 ppkt 4", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}, {"id": "kom-G-q05", "rola": "czlonek_komisji", "faza": "rozliczenie_kart", "cel_uczenia": "Znać obowiązek pakowania kart niewykorzystanych.", "poziom_blooma": "zapamietywanie", "typ": "prawda_falsz", "kontekst": "Policzyliście karty niewykorzystane dla trzech głosowań.", "pytanie": "Karty niewykorzystane pakuje się w odrębne pakiety — osobno dla Sejmu, Senatu i referendum — opieczętowuje i opisuje.", "opcje": [{"tekst": "Prawda", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Fałsz", "poprawna": false, "uzasadnienie_dystraktora": null}], "feedback_poprawny": "Tak — po wpisaniu liczb do punktu 3 karty niewykorzystane trafiają do trzech odrębnych, opieczętowanych i opisanych pakietów (pkt 111 ppkt 3).", "feedback_niepoprawny": "Sprawdź pkt 111 ppkt 3: trzy pakiety, pieczęć, opis.", "zrodlo": {"chunk_id": "wytyczne-kraj:pkt111", "akt": "Uchwała PKW nr 211/2023 (wytyczne dla OKW w kraju)", "jednostka": "Rozdział VI, pkt 111 ppkt 3", "stan_prawny": "2023-09-25", "wybory": "Sejm/Senat/referendum 15.10.2023"}}], "H": SRC_QUIZ_KOM }, obserwator:{ "A": [{"id": "obs-A-q01", "rola": "obserwator", "faza": "otwarcie_lokalu", "cel_uczenia": "Odróżnić obserwację od wykonywania czynności komisji.", "poziom_blooma": "stosowanie", "typ": "scenariusz", "kontekst": "Jest 6:15. Przewodniczący widzi, że komisja nie wyrabia się ze stemplowaniem, i prosi Cię o pomoc przy przeliczaniu kart.", "pytanie": "Jak reagujesz?", "opcje": [{"tekst": "Odmawiam — obserwatorka ma uprawnienia męża zaufania i nie może wykonywać czynności komisji ani dotykać kart.", "poprawna": true, "uzasadnienie_dystraktora": null}, {"tekst": "Pomagam — głosowanie jeszcze się nie zaczęło, więc zakazy nie obowiązują.", "poprawna": false, "uzasadnienie_dystraktora": "zakaz dotykania kart obowiązuje przed rozpoczęciem głosowania, w jego trakcie i po zakończeniu (pkt 9 ppkt 3 w zw. z pkt 20)"}, {"tekst": "Pomagam, jeśli zgodzi się cała komisja.", "poprawna": false, "uzasadnienie_dystraktora": "zgoda komisji nie uchyla zakazu — obserwator nie wykonuje żadnych czynności komisji (pkt 9 ppkt 1 w zw. z pkt 20)"}], "feedback_poprawny": "Tak. Obserwatorzy mają uprawnienia mężów zaufania (pkt 20), a ci nie mogą wykonywać czynności komisji ani dotykać kart w żadnym momencie (pkt 9).", "feedback_niepoprawny": "Wróć do pkt 20 i pkt 9: obserwatorka nie wykonuje czynności komisji i nie dotyka kart — także przed otwarciem lokalu.", "zrodlo": {"chunk_id
